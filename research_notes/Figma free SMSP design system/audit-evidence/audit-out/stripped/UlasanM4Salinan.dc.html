<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // DATA CONTOH — 50 ulasan karangan untuk menguji tata letak, bukan ulasan nyata.
    // Sifat sesuai/tepat/respons juga contoh; persentase di bilah dihitung darinya,
    // jadi angka di layar selalu cocok dengan daftar di bawahnya.
    // Pita bergerak lewat animasi CSS, jadi tidak ada timer di sini: satu-satunya
    // keadaan yang tersisa adalah berapa ulasan yang sudah dimuat di daftar bawah.
    this.state = { tampil: 8 };
  }

  _data() {
    var nama = ['Pak Andi', 'Bu Fitri', 'Pak Ignasius', 'Bu Ratna', 'Pak Hendra', 'Bu Lilis', 'Pak Joko',
                'Bu Maria', 'Pak Rudi', 'Bu Sari'];
    var kota = ['Surabaya', 'Sidoarjo', 'Gresik', 'Malang', 'Mojokerto'];
    var judul = [
      'Ukuran dan tebal pas', 'Penawaran cepat', 'Kirim tepat waktu', 'Harga bersaing',
      'Potongan rapi', 'Kualitas stabil', 'Admin responsif', 'Stok selalu ada'
    ];
    var kalimat = [
      'Barang sesuai ukuran, tebalnya pas dan tidak ada yang penyok saat bongkar.',
      'Salesnya ramah, penawaran dikirim cepat lengkap dengan berat per batang.',
      'Kirim tepat waktu ke lokasi proyek, sopirnya kooperatif waktu bongkar.',
      'Harga bersaing dan beratnya sesuai dengan yang tertulis di penawaran.',
      'Potongan rapi, tidak perlu banyak gerinda waktu pemasangan.',
      'Sudah langganan dua tahun, kualitasnya stabil dari kiriman ke kiriman.',
      'Admin responsif, sertifikat pabrik dikirim tanpa diminta dua kali.',
      'Stok selalu ada, pesan pagi sore sudah jalan ke lokasi.'
    ];
    var bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt'];
    var out = [];
    for (var i = 0; i < 50; i++) {
      var r = i % 11 === 0 ? 4 : 5;                       // sesekali 4, selebihnya 5
      out.push({
        who: nama[i % nama.length] + ' — ' + kota[(i * 3) % kota.length],
        date: (((i * 7) % 28) + 1) + ' ' + bulan[(i * 5) % bulan.length] + ' 2026',
        rating: r,
        judul: judul[(i * 3) % judul.length],
        text: kalimat[(i * 3) % kalimat.length],
        // Tujuh penanda, modulusnya sengaja berbeda-beda supaya persentasenya
        // MELEBAR (98 … 50 %), bukan menumpuk di angka sembilan puluhan. Tiga
        // penanda lama semuanya 90/90/84, dan pada rentang sesempit itu ukuran
        // huruf yang jujur hampir tak terlihat bedanya. Ini data contoh, jadi
        // sebarannya boleh dipilih; begitu ulasan sungguhan masuk, angkanyalah
        // yang menentukan ukuran.
        sesuai: i % 50 !== 0,
        respons: i % 12 !== 0,
        tepat: i % 7 !== 0,
        harga: i % 5 !== 0,
        potong: i % 4 !== 0,
        kualitas: i % 3 !== 0,
        stok: i % 2 !== 0
      });
    }
    return out;
  }

  _hias(r, i) {
    return Object.assign({}, r, {
      ratingLabel: 'Rating ' + r.rating + ' dari 5',
      stars: [1, 2, 3, 4, 5].map(function (k) {
        return { fill: k <= r.rating ? 'var(--star)' : 'var(--star-kosong)' };
      })
    });
  }

  renderVals() {
    var self = this;
    var s = this.state || {};
    var SEMUA = this._data();
    var n = SEMUA.length;
    var tampil = Math.min(s.tampil || 8, n);


    // Bagian yang dipuji, dihitung dari data contoh lalu diurutkan dari yang terbanyak.
    var bagian = function (kunci) {
      return SEMUA.filter(function (r) { return r[kunci]; }).length / n;
    };
    // ikon menempel pada MAKNA, bukan pada urutan: daftar ini diurutkan ulang menurut
    // persentase, jadi memilih ikon dari posisi akan memindahkan truk ke harga begitu
    // angkanya bergeser.
    var sebutan = [
      { label: 'Barang sesuai', ikon: 'perisai', p: bagian('sesuai') },
      { label: 'Admin responsif', ikon: 'obrol', p: bagian('respons') },
      { label: 'Tepat Waktu', ikon: 'truk', p: bagian('tepat') },
      { label: 'Harga bersaing', ikon: 'label', p: bagian('harga') },
      { label: 'Potongan rapi', ikon: 'perisai', p: bagian('potong') },
      { label: 'Kualitas stabil', ikon: 'perisai', p: bagian('kualitas') },
      { label: 'Stok tersedia', ikon: 'truk', p: bagian('stok') }
    ].sort(function (x, y) { return y.p - x.p; });
    var DELAPAN = SEMUA.slice(0, 8);

    return {
      // Empat tema teratas saja, seperti acuan; sisanya tetap dihitung tapi tidak
      // ditampilkan. Ukuran huruf tidak lagi ikut nilainya — di panel ini yang
      // membawa besarannya adalah bilah dan angkanya.
      sebutan: sebutan.slice(0, 4).map(function (b) {
        return { label: b.label, pctLabel: Math.round(b.p * 100) + '%',
                 barGaya: 'width:' + Math.round(b.p * 100) + '%',
                 isPerisai: b.ikon === 'perisai', isObrol: b.ikon === 'obrol',
                 isTruk: b.ikon === 'truk', isLabel: b.ikon === 'label' };
      }),

      // Rel pita = DUA salinan dari delapan ulasan pertama. Salinan kedua hanya untuk
      // mata: aria-hidden, supaya pembaca layar tidak membacakan daftar yang sama dua kali.
      // false = pil kembali di hero disembunyikan; true memunculkannya lagi.
      pilTampil: false,

      pitaLabel: 'Ulasan terbaru, berjalan otomatis',
      pita: DELAPAN.map(function (r, i) {
        return Object.assign(self._hias(r, i), { salinan: 'false' });
      }).concat(DELAPAN.map(function (r, i) {
        return Object.assign(self._hias(r, i), { salinan: 'true' });
      })),

      daftar: SEMUA.slice(0, tampil).map(function (r, i) { return self._hias(r, i); }),
      adaLagi: tampil < n,
      muatLabel: 'Muat ' + Math.min(8, n - tampil) + ' ulasan lagi',
      muatLagi: function () { self.setState({ tampil: Math.min(tampil + 8, n) }); }
    };
  }
}
</script>
