<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Fondasi · Ukuran huruf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap">
<link rel="stylesheet" href="tokens.css">
</helmet>
<div style="width: 1200px; box-sizing: border-box; padding: 48px; background: var(--surface); color: var(--ink); font-family: var(--font-isi); display: flex; flex-direction: column; gap: 40px">
  <h1 style="margin: 0; font-size: var(--teks-display); font-weight: var(--bobot-bold); line-height: var(--tinggi-rapat)">Ukuran huruf</h1>
  <sc-for list="{{ grup }}" as="g" hint-placeholder-count="3">
    <section style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 12px; font-size: var(--teks-section); font-weight: var(--bobot-medium); text-transform: uppercase; letter-spacing: var(--renggang-label-m); line-height: var(--tinggi-sedang); color: var(--ink-2)">{{ g.judul }}</h2>
      <sc-for list="{{ g.isi }}" as="u" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 220px 70px minmax(0, 1fr) 280px; column-gap: 16px; align-items: baseline; padding: 10px 0; box-shadow: inset 0 -1px 0 var(--line)">
          <span data-harga="1" style="font-size: var(--teks-meta); font-weight: var(--bobot-bold)">{{ u.token }}</span>
          <span data-harga="1" style="font-size: var(--teks-meta); color: var(--ink-2)">{{ u.px }}</span>
          <span style="font-size: {{ u.css }}; line-height: var(--tinggi-rapat); white-space: nowrap; overflow: hidden">Besi Hollow Hitam</span>
          <span style="font-size: var(--teks-meta); line-height: var(--tinggi-sedang); color: var(--ink-2)">{{ u.peran }}</span>
        </div>
      </sc-for>
    </section>
  </sc-for>
  <section style="display: flex; flex-direction: column; gap: 4px">
    <h2 style="margin: 0 0 12px; font-size: var(--teks-section); font-weight: var(--bobot-medium); text-transform: uppercase; letter-spacing: var(--renggang-label-m); line-height: var(--tinggi-sedang); color: var(--ink-2)">Bobot</h2>
    <sc-for list="{{ bobot }}" as="b" hint-placeholder-count="7">
      <div style="display: grid; grid-template-columns: 220px 70px minmax(0, 1fr); column-gap: 16px; align-items: baseline; padding: 10px 0; box-shadow: inset 0 -1px 0 var(--line)">
        <span data-harga="1" style="font-size: var(--teks-meta); font-weight: var(--bobot-bold)">{{ b.token }}</span>
        <span data-harga="1" style="font-size: var(--teks-meta); color: var(--ink-2)">{{ b.nilai }}</span>
        <span style="font-size: var(--teks-lead); font-weight: {{ b.css }}">Besi Hollow Hitam</span>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":2100}}'>
class Component extends DCLogic {
  state = { n: 0 };
  componentDidMount() {
    this.t = setInterval(() => {
      this.setState({ n: this.state.n + 1 });
      if (this.state.n > 4) clearInterval(this.t);
    }, 400);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    let gaya = null;
    try { gaya = getComputedStyle(document.documentElement); } catch (e) {}
    const baca = (t) => (gaya ? gaya.getPropertyValue(t).trim() : '');
    const u = (token, peran) => {
      const rem = parseFloat(baca(token));
      return { token, peran, css: 'var(' + token + ')', px: rem ? Math.round(rem * 100) / 10 + ' px' : '' };
    };
    const b = (token) => ({ token, css: 'var(' + token + ')', nilai: baca(token) });
    return {
      grup: [
        { judul: 'Bersama', isi: [
          u('--teks-sup', 'Penanda Rp'),
          u('--teks-micro', 'Pita peringatan'),
          u('--teks-tiny', 'Keterangan, per batang'),
          u('--teks-chip', 'Chip'),
          u('--teks-meta', 'Meta, tombol kecil'),
          u('--teks-body', 'Isi')
        ]},
        { judul: 'Ponsel', isi: [
          u('--teks-price', 'Harga baris'),
          u('--teks-section', 'Label seksi'),
          u('--teks-page', 'Judul halaman')
        ]},
        { judul: 'Desktop', isi: [
          u('--teks-advantage', 'Keunggulan, 0 pemakaian di kanon'),
          u('--teks-subhead', 'Subjudul'),
          u('--teks-lead', 'Isi menonjol, nama SKU'),
          u('--teks-price-lg', 'Harga baris'),
          u('--teks-subsection', 'Subseksi'),
          u('--teks-section-md', 'Label seksi'),
          u('--teks-cta', 'Tombol spanduk'),
          u('--teks-section-lg', 'Seksi besar'),
          u('--teks-display', 'Judul halaman')
        ]}
      ],
      bobot: [b('--bobot-light'), b('--bobot-regular'), b('--bobot-medium'), b('--bobot-semibold'), b('--bobot-bold'), b('--bobot-heavy'), b('--bobot-black')]
    };
  }
}
</script>
</body>
</html>
