<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>CourseGroup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<div style="display: flex; flex-direction: column; row-gap: 1.2rem">
  <div style="display: flex; align-items: center; justify-content: space-between; column-gap: 1.2rem">
    <dc-import name="Heading" level="{{ 3 }}" varian="polos" ukuran="var(--teks-price)" tinggi="var(--tinggi-artikel)" bobot="var(--bobot-bold)" renggang="0" rata="left" warna="var(--ink)" teks="{{ nama }}" hint-size="10rem,2.2rem"></dc-import>
    <dc-import name="Button" variant="teks-merah-kecil" href="" label="{{ label }}" ariaLabel="{{ aria }}" onPress="{{ onSemua }}" hint-size="8rem,4.4rem"></dc-import>
  </div>
  <div style="position: relative"><dc-import name="CourseRail" butir="{{ butir }}" hint-size="100%,24rem"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nama":{"editor":"text","default":"Dasar Baja","section":"Isi"},"label":{"editor":"text","default":"Lihat semua","section":"Isi"},"aria":{"editor":"text","default":"","section":"Aksesibilitas"},"onSemua":{"editor":null,"section":"Aksi"},"butir":{"editor":null,"section":"Data","tsType":"Array<CourseCard props>"},"$preview":{"width":330,"height":300}}'>
class Component extends DCLogic {
renderVals() {
    const p = this.props;
    const nama = p.nama ?? 'Dasar Baja';
    return { nama, label: p.label ?? 'Lihat semua', aria: p.aria || ('Lihat semua materi ' + nama), onSemua: p.onSemua, butir: p.butir };
  }
}
</script>
</body>
</html>
