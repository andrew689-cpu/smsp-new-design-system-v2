<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Heading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<sc-if value="{{ isH1 }}" hint-placeholder-val="{{ false }}"><h1 style="{{ gaya }}"><sc-if value="{{ adaGambar }}" hint-placeholder-val="{{ false }}"><img src="{{ gambar }}" alt="{{ alt }}" style="{{ gayaGambar }}"></sc-if><sc-if value="{{ adaBaris }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ baris }}" as="b" hint-placeholder-count="2"><span style="{{ b.gaya }}">{{ b.teks }}</span></sc-for></sc-if><sc-if value="{{ tanpaBaris }}" hint-placeholder-val="{{ true }}">{{ teks }}</sc-if></h1></sc-if>
<sc-if value="{{ isH2 }}" hint-placeholder-val="{{ true }}"><h2 style="{{ gaya }}"><sc-if value="{{ adaGambar }}" hint-placeholder-val="{{ false }}"><img src="{{ gambar }}" alt="{{ alt }}" style="{{ gayaGambar }}"></sc-if><sc-if value="{{ adaBaris }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ baris }}" as="b" hint-placeholder-count="2"><span style="{{ b.gaya }}">{{ b.teks }}</span></sc-for></sc-if><sc-if value="{{ tanpaBaris }}" hint-placeholder-val="{{ true }}">{{ teks }}</sc-if></h2></sc-if>
<sc-if value="{{ isH2Tautan }}" hint-placeholder-val="{{ false }}"><a href="{{ href }}" aria-label="{{ ariaLabel }}" style="display: flex; align-items: center; gap: var(--rapat); min-height: 4.4rem; text-decoration: none; color: var(--ink)"><h2 style="{{ gaya }}"><sc-if value="{{ adaGambar }}" hint-placeholder-val="{{ false }}"><img src="{{ gambar }}" alt="{{ alt }}" style="{{ gayaGambar }}"></sc-if><sc-if value="{{ adaBaris }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ baris }}" as="b" hint-placeholder-count="2"><span style="{{ b.gaya }}">{{ b.teks }}</span></sc-for></sc-if><sc-if value="{{ tanpaBaris }}" hint-placeholder-val="{{ true }}">{{ teks }}</sc-if></h2></a></sc-if>
<sc-if value="{{ isH3 }}" hint-placeholder-val="{{ false }}"><h3 style="{{ gaya }}"><sc-if value="{{ adaGambar }}" hint-placeholder-val="{{ false }}"><img src="{{ gambar }}" alt="{{ alt }}" style="{{ gayaGambar }}"></sc-if><sc-if value="{{ adaBaris }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ baris }}" as="b" hint-placeholder-count="2"><span style="{{ b.gaya }}">{{ b.teks }}</span></sc-for></sc-if><sc-if value="{{ tanpaBaris }}" hint-placeholder-val="{{ true }}">{{ teks }}</sc-if></h3></sc-if>
<sc-if value="{{ isH4 }}" hint-placeholder-val="{{ false }}"><h4 style="{{ gaya }}"><sc-if value="{{ adaGambar }}" hint-placeholder-val="{{ false }}"><img src="{{ gambar }}" alt="{{ alt }}" style="{{ gayaGambar }}"></sc-if><sc-if value="{{ adaBaris }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ baris }}" as="b" hint-placeholder-count="2"><span style="{{ b.gaya }}">{{ b.teks }}</span></sc-for></sc-if><sc-if value="{{ tanpaBaris }}" hint-placeholder-val="{{ true }}">{{ teks }}</sc-if></h4></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"level":{"editor":"enum","options":[1,2,3,4],"default":2,"section":"Resep"},"tata":{"editor":"enum","options":["ponsel","desktop"],"default":"ponsel","section":"Resep"},"varian":{"editor":"enum","options":["bawaan","polos","lama","seksi","label","besar","kecil","produk","sku","artikel","hero","ulasan","ulasan-besar","judul","kosong","filter"],"default":"bawaan","section":"Resep"},"ukuran":{"editor":"text","default":"","section":"Huruf"},"bobot":{"editor":"text","default":"","section":"Huruf"},"tinggi":{"editor":"text","default":"","section":"Huruf"},"renggang":{"editor":"text","default":"","section":"Huruf"},"kapital":{"editor":"enum","options":["otomatis","ya","tidak"],"default":"otomatis","section":"Huruf"},"warna":{"editor":"text","default":"","section":"Huruf"},"rata":{"editor":"text","default":"","section":"Tata letak"},"margin":{"editor":"text","default":"","section":"Tata letak"},"padKiri":{"editor":"text","default":"","section":"Tata letak"},"bayang":{"editor":"text","default":"","section":"Tata letak"},"posisi":{"editor":"text","default":"","section":"Tata letak"},"celah":{"editor":"text","default":"","section":"Tata letak"},"sudutGambar":{"editor":"text","default":"","section":"Tata letak"},"gambar":{"editor":null},"alt":{"editor":null},"href":{"editor":null},"ariaLabel":{"editor":null},"teks":{"editor":null,"default":"Kategori produk"},"baris":{"editor":null,"tsType":"Array<{teks:string,warna?:string,ukuran?:string,bobot?:string,tinggi?:string,renggang?:string,kapital?:boolean,sebaris?:boolean}>"},"font":{"editor":"text","default":"","section":"Tata letak"},"$preview":{"width":360,"height":50}}'>
class Component extends DCLogic {
  renderVals() {
    const level = Number(this.props.level ?? 2);
    const tata = this.props.tata === 'desktop' ? 'd' : 'm';
    const v = this.props.varian ?? 'bawaan';
    const r = (u, b, t, s, w, up) => ({ u, b, t, s, w, up });
    const M = 'var(--bobot-medium)'; const B = 'var(--bobot-bold)'; const H = 'var(--bobot-black)';
    const label2 = { m: r('var(--teks-section)', 'var(--label-bobot, var(--bobot-medium))', 'var(--tinggi-sedang)', 'var(--renggang-label-m)', 'var(--label-warna, var(--ink-2))', 1), d: r('var(--teks-section-md)', M, 'var(--tinggi-rapat)', 'var(--renggang-label-d)', 'var(--ink-2)', 1) };
    const label3 = { m: r('var(--teks-body)', M, 'var(--tinggi-sedang)', 'var(--renggang-label-m)', 'var(--ink-2)', 1), d: r('var(--teks-subsection)', M, 'var(--tinggi-rapat)', 'var(--renggang-label-d)', 'var(--ink-2)', 1) };
    const h1 = { m: r('var(--teks-page)', B, 'var(--tinggi-rapat)', 'var(--renggang-judul)'), d: r('var(--teks-display)', B, 'var(--tinggi-rapat)', 'var(--renggang-judul)') };
    const peta = {
      1: {
        bawaan: h1,
        produk: { m: r('var(--teks-page)', B, 'var(--tinggi-rapat)', 'var(--renggang-produk-m)'), d: r('var(--teks-display)', B, 'var(--tinggi-sempit)', 'var(--renggang-produk-d)') },
        sku: { m: h1.m, d: r('var(--teks-judul-sku)', B, 'var(--tinggi-sempit)', 'var(--renggang-produk-d)') },
        artikel: { m: h1.m, d: r('var(--teks-display)', B, 'var(--tinggi-artikel-h1)', 'var(--renggang-judul)') },
        hero: { m: r('var(--teks-page)', B, 'var(--tinggi-artikel-h1)', 'var(--renggang-judul)'), d: r('var(--teks-display)', B, 'var(--tinggi-artikel-h1)', 'var(--renggang-judul)') },
        ulasan: { m: r('var(--teks-section-lg)', H, 'var(--tinggi-ulasan-m)', 'var(--renggang-ulasan-m)', 'var(--ink)'), d: r('var(--teks-judul-ulasan)', H, 'var(--tinggi-ulasan-d)', 'var(--renggang-ulasan-d)', 'var(--ink)') }
      },
      2: {
        lama: { m: r('var(--teks-section)', B, 'var(--tinggi-sedang)', 'var(--renggang-label-m)', 'var(--ink)', 1), d: r('var(--teks-section)', B, 'var(--tinggi-sedang)', 'var(--renggang-label-m)', 'var(--ink)', 1) },
        bawaan: label2,
        label: label2,
        besar: { m: label2.m, d: r('var(--teks-section-lg)', M, 'var(--tinggi-rapat)', 'var(--renggang-label-d)', 'var(--ink-2)', 1) },
        kecil: { m: label2.m, d: r('var(--teks-subsection)', M, 'var(--tinggi-rapat)', 'var(--renggang-label-d)', 'var(--ink-2)', 1) },
        artikel: { m: r('var(--teks-section)', B, 'var(--tinggi-artikel)', undefined, 'var(--ink)'), d: r('var(--teks-section-md)', B, 'var(--tinggi-artikel)', undefined, 'var(--ink)') },
        ulasan: { m: r('var(--teks-body)', B, 'var(--tinggi-rapat)', 'var(--renggang-ulasan)', 'var(--ink-2)', 1), d: r('var(--teks-unit-lg)', B, 'var(--tinggi-rapat)', 'var(--renggang-ulasan)', 'var(--ink-2)', 1) },
        'ulasan-besar': { m: label2.m, d: r('var(--teks-section-md)', B, 'var(--tinggi-rapat)', 'var(--renggang-label-d)', 'var(--ink)', 1) },
        filter: { m: r('var(--teks-price)', M, 'var(--tinggi-rapat)', undefined, 'var(--ink-2)'), d: r('var(--teks-price)', M, 'var(--tinggi-rapat)', undefined, 'var(--ink-2)') },
        seksi: { m: r('var(--teks-seksi)', M, 'var(--tinggi-sedang)', 'var(--renggang-label-m)', 'var(--ink-2)', 1), d: label2.d }
      },
      3: {
        bawaan: label3,
        label: label3,
        judul: { m: r('var(--teks-body)', M, 'var(--tinggi-sedang)', undefined, 'var(--ink)'), d: r('var(--teks-subhead)', M, 'var(--tinggi-tengah)', undefined, 'var(--ink)') },
        artikel: { m: r('var(--teks-body)', B, 'var(--tinggi-tengah)', undefined, 'var(--ink)'), d: r('var(--teks-lead)', B, 'var(--tinggi-tengah)', undefined, 'var(--ink)') },
        kosong: { m: r('var(--teks-section)', M, undefined, undefined, 'var(--ink-2)'), d: r('var(--teks-lead)', M, undefined, undefined, 'var(--ink-2)') },
        filter: { m: r('var(--teks-lead)', M), d: r('var(--teks-lead)', M) }
      }
    };
    const per = peta[level] || peta[2];
    const x = v === 'polos' ? {} : (per[v] || per.bawaan)[tata];
    const pil = (a, f) => (a === undefined || a === null || a === '' ? f : a);
    const p = this.props;
    const warna = pil(p.warna, x.w);
    const ukuran = pil(p.ukuran, x.u);
    const bobot = pil(p.bobot, x.b);
    const tinggi = pil(p.tinggi, x.t);
    const gaya = ['margin: ' + pil(p.margin, '0')];
    if (ukuran) gaya.push('font-size: ' + ukuran);
    if (bobot) gaya.push('font-weight: ' + bobot);
    if (tinggi) gaya.push('line-height: ' + tinggi);
    const renggang = pil(p.renggang, x.s);
    if (renggang) gaya.push('letter-spacing: ' + renggang);
    const kapital = p.kapital ?? 'otomatis';
    if (kapital === 'ya' || (kapital === 'otomatis' && x.up)) gaya.push('text-transform: uppercase');
    if (kapital === 'tidak') gaya.push('text-transform: none');
    if (warna) gaya.push('color: ' + warna);
    if (p.rata) gaya.push('text-align: ' + p.rata);
    if (p.padKiri) gaya.push('box-sizing: border-box', 'padding-left: ' + p.padKiri);
    if (p.bayang) gaya.push('box-shadow: ' + p.bayang);
    if (p.posisi) gaya.push('position: ' + p.posisi);
    if (p.celah) gaya.push('display: flex', 'flex-direction: column', 'gap: ' + p.celah);
    const gayaBaris = (b) => [
      b.sebaris ? '' : 'display: block',
      b.ukuran ? 'font-size: ' + b.ukuran : '',
      b.tinggi ? 'line-height: ' + b.tinggi : '',
      b.bobot ? 'font-weight: ' + b.bobot : '',
      b.renggang ? 'letter-spacing: ' + b.renggang : '',
      b.kapital ? 'text-transform: uppercase' : '',
      b.warna ? 'color: ' + b.warna : ''
    ].filter(Boolean).join('; ');
    return {
      isH1: level === 1,
      isH2: level !== 1 && level !== 3 && level !== 4 && !this.props.href,
      isH2Tautan: level !== 1 && level !== 3 && level !== 4 && !!this.props.href,
      href: this.props.href,
      ariaLabel: this.props.ariaLabel,
      isH3: level === 3,
      isH4: level === 4,
      adaGambar: !!p.gambar,
      gambar: p.gambar,
      alt: p.alt ?? '',
      gayaGambar: 'width: 100%; height: auto; display: block; border-radius: ' + pil(p.sudutGambar, 'var(--card)'),
      teks: this.props.teks ?? 'Kategori produk',
      adaBaris: !!this.props.baris,
      tanpaBaris: !this.props.baris && !p.gambar,
      baris: (this.props.baris || []).map((b) => ({ teks: b.teks, gaya: gayaBaris(b) })),
      gaya: gaya.join('; ') + (this.props.font ? '; font-family: ' + this.props.font : '')
    };
  }
}
</script>
</body>
</html>
