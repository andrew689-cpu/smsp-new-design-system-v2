        wadah: kisi
          ? 'display: flex; margin: ' + (i < 3 ? '0' : '1rem') + ' ' + ((i + 1) % 3 === 0 ? '0' : '1rem') + ' ' + (i >= n - 3 ? '0' : '1rem') + ' ' + (i % 3 === 0 ? '0' : '1rem')
          : 'flex-shrink: 0; width: calc((100% - 2 * var(--rapat)) / 3); box-sizing: border-box; scroll-snap-align: start; display: flex; margin-left: ' + (i === 0 ? '0' : 'calc(var(--rapat) / 2)') + '; margin-right: calc(var(--rapat) / 2)'
      })),
      ulSpy: () => this._ulSpy(),
      ulTitik
    };
  }
}
</script>
</body>
</html>
