<sc-if value="{{ isPonsel }}" hint-placeholder-val="{{ true }}">

    </sc-if>
    <main style="{{ gayaMain }}">
      <div style="{{ gayaAtas }}">

        <sc-if value="{{ tampilBaru }}" hint-placeholder-val="{{ true }}">
          <div style="{{ gayaBaru }}"><dc-import name="BlogSection" dc-props="{{ baru }}" hint-size="100%,24.2rem"></dc-import></div>
        </sc-if>
      </div>
      <sc-if value="{{ cariAktif }}" hint-placeholder-val="{{ false }}">
        <div style="{{ gayaHasil }}"><dc-import name="BlogSearchResults" dc-props="{{ hasil }}" hint-size="100%,30rem"></dc-import></div>
      </sc-if>
      <sc-if value="{{ indeksTampil }}" hint-placeholder-val="{{ true }}">
        <div style="{{ gayaIndeks }}">
          <sc-for list="{{ daftarSeksi }}" as="x" hint-placeholder-count="5">
            <div style="{{ x.gaya }}"><dc-import name="BlogSection" dc-props="{{ x.props }}" hint-size="100%,85rem"></dc-import></div>
          </sc-for>
        </div>
      </sc-if>
    </main>
    <div style="margin-top: {{ kakiAtas }}"><dc-import name="Footer" dc-props="{{ kaki }}" hint-size="100%,181rem"></dc-import></div>
    <dc-import name="BottomGlassBar" dc-props="{{ bar }}" hint-size="100%,5.2rem"></dc-import>
    <sc-if value="{{ adaLembar }}" hint-placeholder-val="{{ true }}">
      <dc-import name="SectionSheet" varian="kategori" terbuka="{{ navOpen }}" seksi="{{ lembarSeksi }}" onTutup="{{ navTutup }}" hint-size="33.6rem,6.8rem"></dc-import>
    </sc-if>
    <dc-import name="HelpCentre" gaya="blog" bannerJenis="{{ bannerBantu }}" buka="{{ bantuanOpen }}" onTutup="{{ bantuanTutup }}" hint-size="36rem,80rem"></dc-import>
  </div>
</sc-if>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
  <div style="width: 144rem; max-width: 100%; margin: 0 auto; box-sizing: border-box; min-height: 100vh; background: var(--surface)">
    <dc-import name="FraudRibbon" tata="desktop" buka="{{ awasBuka }}" onTutup="{{ awasTutup }}" hint-size="100%,5.4rem"></dc-import>
    <dc-import name="SiteHeader" tata="desktop" hrefLogo="{{ hrefLogo }}" nilai="{{ cariQ }}" onUbah="{{ cariKetik }}" navIsi="{{ navIsi }}" hint-size="100%,12.4rem"></dc-import>
    <main style="box-sizing: border-box; padding: 0 var(--sisi)">
      <div style="margin-top: var(--seksi)"><dc-import name="BlogHero" jenis="desktop" hint-size="100%,20rem"></dc-import></div>
      <sc-if value="{{ cariAktif }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top: var(--seksi)"><dc-import name="BlogSearchResults" tata="desktop" hitung="{{ cariHitung }}" hasil="{{ hasilKartu }}" hint-size="100%,30rem"></dc-import></div>

        <div style="margin-top: var(--dalam)"><dc-import name="BlogCardGrid" butir="{{ pilihan }}" hint-size="100%,33.7rem"></dc-import></div>

          <div style="{{ x.gaya }}"><dc-import name="BlogSection" dc-props="{{ x.props }}" hint-size="100%,60rem"></dc-import></div>
        </sc-for>
      </sc-if>
    </main>
    <div style="margin-top: calc(var(--footer-jarak) / 2)"><dc-import name="Footer" tata="desktop" hint-size="100%,38rem"></dc-import></div>
  </div>
</sc-if>

    ];
  }
  componentDidMount() {
    if (this.props.tata === 'desktop' || !this._resep().keAtas) return;
    this._gulirOn = () => {
      let y = 0;
      try { y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0; } catch (e) {}
      const turun = y > 160;
      if (turun !== this.state.gulir) this.setState({ gulir: turun });
    };
    window.addEventListener('scroll', this._gulirOn, { passive: true });
    this._gulirOn();
  }
  componentWillUnmount() {
    if (this._gulirOn) window.removeEventListener('scroll', this._gulirOn);
  }
  renderVals() {
    const s = this.state;
    const desktop = this.props.tata === 'desktop';
    const r = this._resep();
    const ARTIKEL = this._artikel();
    const SEKSI = this.props.seksi ?? [
      { id: 'kat-berita', judul: 'Berita Baja', deskripsi: 'Perkembangan industri, kebijakan dan pergerakan harga besi baja.', kunci: 'Berita Besi Baja' },
      { id: 'kat-industri', judul: 'Industri Baja', deskripsi: 'Teknologi produksi, metode konstruksi dan praktik di lapangan.', kunci: 'Industri Besi Baja' },
      { id: 'kat-produk', judul: 'Produk Besi', deskripsi: 'Jenis, ukuran dan penggunaan tiap produk besi dan baja.', kunci: 'Produk Besi' },
      { id: 'kat-team', judul: 'Team', deskripsi: 'Budaya kerja, kegiatan dan pengembangan tim SMS Perkasa.', kunci: 'Team' },
      { id: 'kat-trivia', judul: 'Trivia', deskripsi: 'Serba-serbi desain, hunian dan fakta menarik seputar konstruksi.', kunci: 'Trivia' }
    ];
    const hrefArtikel = this.props.hrefArtikel || r.href;
    const hrefLogo = this.props.hrefLogo || 'Artboard-pp1u.dc.html';
    const BULAN = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, Mei: 4, Jun: 5, Jul: 6, Agu: 7, Sep: 8, Okt: 9, Nov: 10, Des: 11 };
    const waktu = (tgl) => {
      const p = String(tgl).split(' ');
      const b = BULAN[p[1]];
      if (p.length !== 3 || b === undefined) return 0;
      return new Date(parseInt(p[2], 10), b, parseInt(p[0], 10)).getTime();
    };
    const lalu = (tgl) => {
      const t = waktu(tgl);
      if (!t) return tgl;
      const hari = Math.floor((Date.now() - t) / 86400000);
      if (hari < 1) return 'hari ini';
      if (hari === 1) return 'kemarin';
      if (hari < 30) return hari + ' hari yang lalu';
      if (hari < 365) return Math.floor(hari / 30) + ' bulan yang lalu';
      return Math.floor(hari / 365) + ' tahun yang lalu';
    };
    const PENDEK = { 'Berita Besi Baja': 'Berita Baja', 'Industri Besi Baja': 'Industri Baja' };
    const pendek = (k) => PENDEK[k] || k;
    const kartu = (a) => ({
      judul: a.judul,
      href: hrefArtikel,
      target: '_self',
      kategori: pendek(a.kategori),
      tanggal: a.tanggal,
      lalu: lalu(a.tanggal),
      foto: a.foto || null,
      ringkas: a.ringkas,
      ariaLabel: 'Artikel: ' + a.judul + ', ' + pendek(a.kategori) + ', ' + a.tanggal + ', oleh Sofia, buka halaman artikel'
    });
    const kat = (k) => ARTIKEL.filter((a) => a.kategori === k).map(kartu);
    const qMentah = (s.q || '').trim();
    const qq = qMentah.toLowerCase();
    const HASIL = qq ? ARTIKEL.filter((a) => a.judul.toLowerCase().indexOf(qq) !== -1) : [];
    const cariHitung = HASIL.length + ' artikel cocok dengan "' + (desktop ? qMentah : qq) + '"';
    const umum = {
      isPonsel: !desktop,
      isDesktop: desktop,
      hrefLogo,
      navIsi: this.props.navIsi ?? 'artikel',
      awasBuka: s.awas,
      awasTutup: () => this.setState({ awas: false }),
      cariQ: s.q,
      cariKetik: (v) => this.setState({ q: v }),
      cariAktif: !!qq,
      indeksTampil: !qq,
      cariHitung
    };
    const antarSeksi = (x, n) => 'margin-top: ' + (n === 0 ? 'var(--seksi)' : 'calc(var(--seksi) / 2)') + (n === SEKSI.length - 1 ? '' : '; padding-bottom: calc(var(--seksi) / 2)');
    if (desktop) {
      return {
        ...umum,
        hasilKartu: HASIL.map(kartu),
        pilihan: ARTIKEL.filter((a) => a.tanggal === '9 Okt 2026').slice(0, 2).map(kartu),
        daftarSeksi: SEKSI.map((x, n) => ({
          gaya: antarSeksi(x, n),
          props: { tata: 'desktop', id: x.id, judul: x.judul, deskripsi: x.deskripsi, baris: kat(x.kunci) }
        }))
      };
    }
    const URUT = ARTIKEL.slice().sort((a, c) => waktu(c.tanggal) - waktu(a.tanggal));
    const TAMPIL = (i) => s.kat === -1 || s.kat === i || (s.kat === 6 && (i === 2 || i === 4));
    const hadir = SEKSI.map((x, i) => ({ ...x, i })).filter((x) => TAMPIL(x.i));
    const BASIS = s.kat === -1 ? 60 : 35;
    const jarak = (a, b, basis) => Math.round(Math.min(1.4, Math.max(0.75, Math.pow(a / b, 0.35))) * basis);
    const rem = (px) => px / 10 + 'rem';
    let daftarSeksi;
    let atasBawah = '0';
    let bawahAtas = '0';
    let kakiAtas = 'calc(var(--seksi) / 2)';
    if (r.tetap) {
      daftarSeksi = SEKSI.map((x, n) => ({
        gaya: antarSeksi(x, n),
        props: { ...r.seksi, id: x.id, judul: x.judul, deskripsi: x.deskripsi, baris: kat(x.kunci) }
      }));
    } else {
      let tinggiDaftar = 0;
      daftarSeksi = hadir.map((x, n) => {
        const h = r.tinggi[x.i];
        const g = n === 0 ? 0 : jarak(r.tinggi[hadir[n - 1].i], h, BASIS);
        const g2 = n === hadir.length - 1 ? 0 : jarak(h, r.tinggi[hadir[n + 1].i], BASIS);
        tinggiDaftar += h + g;
        return {
          gaya: 'margin-top: ' + rem(g - Math.round(g / 2)) + '; margin-bottom: ' + rem(Math.round(g2 / 2)),
          props: { id: x.id, judul: x.judul, deskripsi: x.deskripsi, baris: kat(x.kunci), ...r.seksi }
        };
      });
      const tinggiBawah = qq ? Math.round(r.hasilDasar + 185.625 * HASIL.length) : tinggiDaftar;
      const jarakBawah = jarak(r.atas, tinggiBawah, BASIS);
      const tinggiUtama = Math.floor(r.atas + r.tambah + jarakBawah + tinggiBawah);
      atasBawah = rem(Math.round(jarakBawah / 2));
      bawahAtas = rem(jarakBawah - Math.round(jarakBawah / 2));
      kakiAtas = rem(jarak(tinggiUtama, 1811, 60));
    }
    const daftarTab = r.tabHero || r.tabPita;
    const tab = daftarTab ? daftarTab.map((t) => ({ label: t[0], kini: s.kat === t[1], pilih: () => this.setState({ kat: t[1] }) })) : undefined;
    const hero = r.tabHero ? { ...r.hero, tab } : r.hero;
    const hasil = { hitung: cariHitung, hasil: HASIL.map(kartu) };
    if (r.tetap) hasil.gaya = 'lama';
    if (r.judulHasil) hasil.judulVarian = r.judulHasil;
    const kaki = { tata: 'ponsel' };
    if (r.sisi) kaki.sisiPonsel = r.sisi;
    const header = { tata: 'ponsel', hrefLogo };
    if (r.nada) header.nada = r.nada;
    if (r.sisi) header.sisiPonsel = r.sisi;
    const bar = {
      jenis: 'blog',
      terbuka: s.nav,
      cariTerbuka: s.cari,
      bantuanTerbuka: s.bantuan,
      kueri: s.q,
      onKetik: (v) => this.setState({ q: v }),
      onNav: () => this.setState({ nav: !s.nav }),
      onCari: () => this.setState({ cari: !s.cari, q: s.cari ? '' : s.q, bantuan: false, nav: false }),
      onBantuan: () => this.setState({ bantuan: !s.bantuan, nav: false })
    };
    if (r.keAtas) {
      bar.keAtasAda = true;
      bar.keAtasTampil = s.gulir;
      bar.onKeAtas = () => {
        let halus = true;
        try { halus = !window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        try { window.scrollTo({ top: 0, behavior: halus ? 'smooth' : 'auto' }); }
        catch (e) { try { window.scrollTo(0, 0); } catch (e2) {} }
      };
    }
    return {
      ...umum,
      header,
      adaPita: !!r.tabPita,
      tab,
      gayaMain: 'box-sizing: border-box; padding: 0 var(--talang)' + (r.tetap ? '' : '; display: flex; flex-direction: column; gap: 0'),
      gayaAtas: r.gayaAtas ? r.gayaAtas(atasBawah) : 'display: contents',
      gayaHero: r.gayaHero,
      hero,
      tampilBaru: s.kat === -1,
      gayaBaru: r.gayaBaru(atasBawah),
      baru: { ...r.baru, baris: URUT.slice(0, 3).map(kartu) },
      gayaHasil: 'margin-top: ' + (r.tetap ? 'var(--seksi)' : bawahAtas),
      hasil,
      gayaIndeks: r.tetap ? 'display: contents' : 'margin-top: ' + bawahAtas + '; display: flex; flex-direction: column; gap: 0',
      daftarSeksi,
      kakiAtas,
      kaki,
      bar,
      adaLembar: !!r.lembar,
      navOpen: s.nav,
      navTutup: () => this.setState({ nav: false }),
      lembarSeksi: r.lembarSeksi,
      bantuanOpen: s.bantuan,
      bantuanTutup: () => this.setState({ bantuan: false }),
      bannerBantu: r.banner
    };
  }
}
</script>
