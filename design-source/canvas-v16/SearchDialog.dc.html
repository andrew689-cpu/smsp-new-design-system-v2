    const atur = (nilai) => {
      if (!dikendalikan) this.setState({ q: nilai });
      if (this.props.onUbah) this.props.onUbah(nilai);
    };
    const pakai = (kata) => () => atur(kata);
    let grup = this.props.grup;
    if (grup === undefined && qSitus) {
      const rp = (n) => 'Rp ' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      const koma = (n) => String(n).replace('.', ',');
      const produk = [];
      K.TREE.forEach((g) => g[1].forEach((n) => produk.push({ n, grup: g[0], jml: K.COUNT[n] || 0, img: K.IMG[n] || '' })));
      const pr = produk.filter((x) => this.cocok((x.n + ' ' + x.grup).toLowerCase(), toks)).slice(0, 6).map((x) => ({ n: x.n, sub: x.jml ? x.jml + ' SKU · ' + x.grup : x.grup, img: x.img }));
      const sk = [];
      (this.props.barisSku ?? K.SKU.map((r) => ({ a: r[0], b: r[1], t: r[2], p: r[3] }))).forEach((r) => {
        if (sk.length >= 6) return;
        const tb = r.tb ?? koma(r.t);
        if (this.cocok(('besi hollow hitam ' + r.a + ' ' + r.b + ' ' + tb).toLowerCase(), toks)) sk.push({ n: r.a + ' × ' + r.b + ' × ' + tb + ' mm × 6 M', sub: 'Besi Hollow Hitam · ' + rp(r.harga ?? r.p) + ' per batang', img: K.IMG['Besi Hollow Hitam'] });
      });
      K.beton.forEach((r) => {
        if (sk.length >= 8) return;
        if (this.cocok(('besi beton ' + r[1] + ' ' + r[2] + ' ' + r[3] + ' ' + r[0]).toLowerCase(), toks)) sk.push({ n: 'Besi Beton ' + r[1] + ' Ø' + r[2] + ' mm · ' + r[3], sub: koma(r[4]) + ' kg · ' + rp(r[5]) + ' per batang', img: K.IMG['Besi Beton'] });
      });
      const hl = K.halaman.filter((x) => this.cocok((x[0] + ' ' + x[1]).toLowerCase(), toks)).slice(0, 5).map((x) => ({ n: x[0], sub: x[1], img: '' }));
      grup = [];
      if (pr.length) grup.push({ h: 'Produk', items: pr });
      if (sk.length) grup.push({ h: 'SKU', items: sk });
      if (hl.length) grup.push({ h: 'Halaman', items: hl });
    }
    grup = grup || [];
    const nHasil = grup.reduce((a, g) => a + g.items.length, 0);
    const placeholder = this.props.placeholder ?? 'Cari produk, ukuran, atau info';
    const recent = this.props.recent ?? ['40 40 2', 'besi beton ulir 13', 'wiremesh'];
    const populer = this.props.populer ?? ['Besi Hollow Hitam', 'Besi Beton', 'Wiremesh', 'Plat Besi Hitam', 'Besi CNP', 'Besi Siku'].map((n) => ({ n, sub: (K.COUNT[n] || 0) + ' SKU', img: K.IMG[n] || '' }));
    const kategori = this.props.kategori ?? K.TREE.map((g) => g[0]);
    return {
      terbuka: this.props.terbuka ?? true,
      ariaLabel: this.props.ariaLabel ?? 'Cari di seluruh SMS Perkasa',
      placeholder,
      q,
      isCincin: !isAbu && !isApung,
      isApung,
      peran: isApung ? undefined : 'dialog',
      gayaAkar: isApung && this.props.tertanam
        ? 'display: flex; flex-direction: column; align-items: stretch; gap: var(--rapat)'
        : isApung
        ? 'position: fixed; left: 50%; transform: translateX(-50%); width: 36rem; max-width: 100%; box-sizing: border-box; padding: 0 1.2rem; bottom: 3.4rem; z-index: 9999; display: flex; flex-direction: column; align-items: stretch; gap: var(--rapat)'
        : 'position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 36rem; max-width: 100%; z-index: 9999; box-sizing: border-box; background: var(--surface); display: flex; flex-direction: column',
      gayaGulir: isApung
        ? 'box-sizing: border-box; background: var(--surface); box-shadow: var(--bayang-lama); border-radius: var(--sudut-lama-baris); max-height: 39.2rem; overflow-y: auto; padding: 0.4rem 1.4rem 1.4rem 1.4rem'
        : 'flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 0.4rem 1.6rem 1.8rem 1.6rem',
      atasKepala: isApung ? '1.4rem' : '0.4rem',
      sudutBaris: isApung ? 'var(--sudut-lama)' : 'var(--tile)',
      isAbu,
      tutupDiAtas: isAbu,
      selaKepala: isAbu ? '0' : 'var(--rapat)',
      kananKepala: isAbu ? 'calc(var(--rapat) / 2)' : '0',
      kosong: qSitus === '',
      adaQ: qSitus !== '',
      idKolom: this.props.idKolom || undefined,
      ikonHapus: this.props.ikonHapus || undefined,
      bisaHapus: !!this.props.hapusSelalu || qSitus !== '',
      nihil: qSitus !== '' && nHasil === 0,
      ringkas: nHasil + ' hasil untuk “' + (q || '').trim() + '”',
      teksNihil: this.props.teksNihil ?? 'Tidak ada yang cocok. Coba kata lain, atau hubungi tim sales kami lewat tombol di kanan bawah.',
      recent: recent.map((l, i) => ({ l, pakai: pakai(l), kiri: i === 0 ? '0' : '0.4rem' })),
      populer: populer.map((p) => ({ n: p.n, sub: p.sub, img: p.img, pakai: pakai(p.n) })),
      kategori: kategori.map((l, i) => ({ l, pakai: pakai(l), kiri: i === 0 ? '0' : '0.4rem' })),
      grup: grup.map((g) => ({
        h: g.h,
        items: g.items.map((it) => ({ judul: it.n, sub: it.sub, gambar: it.img || '', barisRapat: true, warnaJudul: (isAbu || isApung) ? undefined : 'var(--produk-nama)', sudut: isApung ? 'var(--sudut-lama)' : 'var(--tile)', onPress: it.onPress }))
      })),
      ubah: (nilai) => atur(nilai),
      hapus: () => {
        if (!dikendalikan) this.setState({ q: '' });
        if (this.props.onHapus) this.props.onHapus();
        if (this.props.onUbah) this.props.onUbah('');
      },
      tutup: () => {
        if (!dikendalikan) this.setState({ q: '' });
        if (this.props.onTutup) this.props.onTutup();
      }
    };
  }
}
</script>
</body>
</html>
