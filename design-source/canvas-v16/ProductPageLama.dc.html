    const sisa = hasil.length - tampilBaris.length;
    const adaFilter = uk.length + tb.length > 0 || q !== '';
    const ocN = uk.length + tb.length + (q ? 1 : 0);
    const nol = hasil.length === 0;
    const chipAktif = [];
    uk.forEach((id) => {
      const u = id.split('x');
      chipAktif.push({ label: u[0] + ' × ' + u[1] + ' mm', aria: 'Hapus filter ukuran ' + u[0] + ' kali ' + u[1], buang: () => this.togel('ukuran', id) });
    });
    tb.forEach((t) => chipAktif.push({ label: 'Tebal ' + this.koma(t) + ' mm', aria: 'Hapus filter tebal ' + this.koma(t), buang: () => this.togel('tebal', t) }));
    if (q) chipAktif.push({ label: 'Cari: ' + q, aria: 'Hapus kata pencarian', buang: () => this.setState({ q: '', limit: 50 }) });
    return {
      baris: tampilBaris.map((r) => ({ head: 'Besi Hollow ' + r.a + ' × ' + r.b + ' × ' + this.koma(r.t) + ' mm × 6 M [STD, NB]', pNum: this.angka(r.p), vmBerat: this.koma(r.w) + ' kg' })),
      isTable: s.vm === 'table',
      isCard2: s.vm === 'card2',
      vmTableOn: s.vm === 'table' ? 'true' : 'false',
      vmCard2On: s.vm === 'card2' ? 'true' : 'false',
      vmTable: () => this.setState({ vm: 'table' }),
      vmCard2: () => this.setState({ vm: 'card2' }),
      kosong: nol,
      tampil: tampilBaris.length,
      total: semua.length,
      adaLagi: sisa > 0,
      lazyLabel: 'Memuat ' + Math.min(50, sisa) + ' SKU berikutnya · ' + tampilBaris.length + ' dari ' + hasil.length,
      adaFilter,
      chipAktif,
      hapusSemua: () => this.setState({ ukuran: [], tebal: [], q: '', limit: 50 }),
      q: s.q,
      setQ: (e) => this.setState({ q: e.target.value, limit: 50 }),
      ocTerbuka: s.ocOpen,
      ocN,
      ocToggle: () => this.setState({ ocOpen: !s.ocOpen, bantuan: false }),
      ocFilter: () => {
        if (s.ocOpen) { this.setState({ ocOpen: false }); return; }
        this.setState({ ocOpen: true, urutOpen: false, ocSeg: 'ukuran', bantuan: false });
      },
      urutBuka: () => {
        if (s.urutOpen) { this.setState({ urutOpen: false }); return; }
        this.setState({ urutOpen: true, ocOpen: false, bantuan: false });
      },
      ocExpFilter: s.ocOpen ? 'true' : 'false',
      ocExpUrut: s.urutOpen ? 'true' : 'false',
      urutTerbuka: s.urutOpen,
      ocFilterAria: s.ocOpen ? 'Tutup Filter' : 'Filter' + (ocN ? ', ' + ocN + ' aktif' : ''),
      urutAda: s.urut !== 'ukuran',
      ocUrutAria: s.urutOpen ? 'Tutup Urutkan' : 'Urutkan' + (s.urut !== 'ukuran' ? ', ' + urutKini[1] : ''),
      navOpen: s.nav && !s.cariOpen && !s.ocOpen && !s.urutOpen,
      navExp: s.nav ? 'true' : 'false',
      navAria: s.nav ? 'Tutup daftar bagian' : 'Daftar bagian halaman',
      navDot: ocN > 0,
      navSet: 'bagian',
      navTutup: () => this.setState({ nav: false }),
      navToggle: () => this.setState({ nav: !s.nav, bantuan: false }),
      bantuanOpen: s.bantuan,
      bantuanExp: s.bantuan ? 'true' : 'false',
      bantuanToggle: () => this.setState({ bantuan: !s.bantuan }),
      fabTampil: !s.ocOpen && !s.urutOpen && !s.cariOpen,
      seksi: this.seksi().map((x, i) => {
        const aksi = x[0] === 'aksi-filter';
        return {
          href: '#' + x[0], label: x[1], tunda: (70 + i * 55) + 'ms',
          isAksi: aksi, isFoto: x[0] === 'm-ringkasan', isHarga: x[0] === 'm-harga', isFaq: x[0] === 'm-faq',
          adaFilter: aksi && ocN > 0,
          aria: aksi ? (s.ocOpen ? 'Tutup Filter & Urutkan' : 'Filter & Urutkan' + (ocN ? ', ' + ocN + ' aktif' : '')) : '',
          exp: aksi && s.ocOpen ? 'true' : 'false',
          kini: !aksi && s.sek === x[0] ? 'true' : 'false',
          pergi: (e) => {
            if (e && e.preventDefault) e.preventDefault();
            if (aksi) {
              if (s.ocOpen) { this.setState({ ocOpen: false, nav: false }); return; }
              const tb2 = document.getElementById('btn-filter');
              if (tb2 && tb2.scrollIntoView) tb2.scrollIntoView({ block: 'center' });
              this.setState({ ocOpen: true, nav: false, bantuan: false });
              return;
            }
            const el = document.getElementById(x[0]);
            if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
            this.setState({ sek: x[0], nav: false });
          }
        };
      }),
      ocPilText: adaFilter ? hasil.length + ' SKU · urut ' + urutKini[1] : 'Semua ' + semua.length + ' SKU · urut ' + urutKini[1],
      ocCta: nol ? 'Tidak ada' : 'Lihat ' + hasil.length,
      ocNol: nol,
      ocTerap: () => { if (!nol) this.setState({ ocOpen: false }); },
      urutTerap: () => this.setState({ urutOpen: false }),
      urutReset: () => this.setState({ urut: 'ukuran' }),
      urutBersih: s.urut === 'ukuran',
      ocSeg: s.ocSeg,
      nUkuran: uk.length,
      nTebal: tb.length,
      pilihSeg: (id) => this.setState({ ocSeg: id }),
      ocUkuran: this.ukuranUnik().map((u) => {
        const n = semua.filter((r) => r.uk === u.uk && this.cocok(r, [], tb, q)).length;
        const on = uk.indexOf(u.uk) !== -1;
        const mati = n === 0 && !on;
        return { label: u.a + ' × ' + u.b, jumlahLabel: n + ' varian', aktif: on, aria: 'Ukuran ' + u.a + ' kali ' + u.b + ' milimeter, ' + n + ' varian' + (on ? ', dipilih' : ''), mati, pick: () => { if (!mati) this.togel('ukuran', u.uk); } };
      }),
      ocTebal: this.tebalUnik().map((t) => {
        const n = semua.filter((r) => r.t === t && this.cocok(r, uk, [], q)).length;
        const on = tb.indexOf(t) !== -1;
        const mati = n === 0 && !on;
        return { label: this.koma(t), jumlahLabel: n + ' SKU', aktif: on, aria: 'Tebal ' + this.koma(t) + ' milimeter, ' + n + ' SKU' + (on ? ', dipilih' : ''), mati, pick: () => { if (!mati) this.togel('tebal', t); } };
      }),
      ocUrut: URUT.map((o) => ({ value: o[0], label: 'Urut ' + o[1], checked: s.urut === o[0], pick: () => this.setState({ urut: o[0], limit: 50 }) })),
      ocBersih: !adaFilter && s.urut === 'ukuran',
      ocReset: () => this.setState({ ukuran: [], tebal: [], q: '', urut: 'ukuran', limit: 50 }),
      cariOpen: s.cariOpen,
      cariQ: s.cariQ,
      cariTutup2: !s.cariOpen,
      cariBuka: () => this.setState({ cariOpen: true, bantuan: false, cariQ: '', ocOpen: false }),
      cariTutup: () => this.setState({ cariOpen: false, cariQ: '' }),
      cariUbah: (v) => this.setState({ cariQ: v })
    };
  }
  renderVals() {
    return {
      v: this.nilai(),
      gulir: this.state.gulir,
      lembar: !!this.props.lembar,
      lamaRata: !!this.props.lamaRata,
      font: this.props.font ?? 'bawaan',
      hrefBaris: this.props.hrefBaris || 'SkuDetailM4.dc.html',
      fotoKartu: this.props.fotoKartu || '/_blob/7cf9caf5815cec7ca47570545222d743',
      altKartu: this.props.altKartu ?? ''
    };
  }
}
</script>
