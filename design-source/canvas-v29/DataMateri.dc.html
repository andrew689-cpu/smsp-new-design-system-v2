<script type="text/x-dc" data-dc-script data-props='{"koleksi":{"editor":"enum","options":["foto","ikon","foto-lengkap"],"default":"foto","section":"Resep"},"onData":{"editor":null,"section":"Aksi"},"judul":{"editor":"text","default":"Materi Learning: satu tempat","section":"Isi"},"$preview":{"width":720,"height":560}}'>

  _semua() {
    return [{"id": "dasar", "judul": "Mengenal Besi dan Baja", "topik": "Dasar Baja", "tab": "dasar", "level": "Pemula", "ringkas": "Bekal pertama sebelum memilih material: apa itu baja, bagaimana ia dibentuk, dan profil apa saja yang ada di pasaran.", "hasil": ["Membedakan besi dan baja", "Memahami canai panas dan canai dingin", "Mengenali bentuk profil yang umum", "Memahami istilah di daftar harga"], "pelajaran": [{"judul": "Besi atau baja, apa bedanya?", "isi": [{"p": "Di lapangan, kata besi dan baja sering dipakai bergantian. Besi hollow, besi beton, dan besi WF sebenarnya terbuat dari baja, yaitu besi yang dicampur sedikit karbon dan unsur lain agar lebih kuat dan mudah dibentuk."}, {"p": "Kadar karbon ikut menentukan sifatnya. Makin tinggi karbonnya, baja umumnya makin keras, tetapi makin sulit dilas dan dibentuk. Baja karbon rendah banyak dipakai di konstruksi karena mudah dipotong dan dilas."}, {"p": "Jadi, saat seseorang menyebut besi di toko material, yang dimaksud hampir selalu produk baja."}]}, {"judul": "Canai panas dan canai dingin", "isi": [{"p": "Sebagian besar produk baja dibentuk dengan cara digiling atau dicanai. Bedanya ada pada suhu saat proses itu dilakukan."}, {"poin": ["Canai panas (hot-rolled): digiling saat baja masih sangat panas. Permukaannya cenderung lebih kasar, dan cocok untuk profil struktural.", "Canai dingin (cold-rolled): digiling lagi pada suhu ruang. Permukaannya lebih halus dan ukurannya lebih presisi, sehingga banyak dipakai untuk pelat tipis."]}, {"p": "Keduanya bukan soal mana yang lebih baik. Pilihannya mengikuti kebutuhan pekerjaan."}]}, {"judul": "Bentuk profil yang sering dipakai", "isi": [{"p": "Nama produk baja biasanya mengikuti bentuk penampangnya. Berikut yang paling sering Anda temui:"}, {"poin": ["Hollow: kotak berongga, untuk rangka, pagar, dan kanopi.", "Pipa: bulat berongga, untuk rangka dan saluran.", "Siku: berbentuk L, untuk rangka ringan dan dudukan.", "CNP dan UNP: berbentuk C atau U, untuk gording dan rangka.", "WF dan H Beam: berbentuk I atau H, untuk balok dan kolom.", "Besi beton: batang tulangan di dalam beton.", "Plat: lembaran dengan berbagai ketebalan."]}]}, {"judul": "Istilah di daftar harga", "isi": [{"p": "Beberapa istilah akan selalu muncul saat Anda membaca daftar harga SMS Perkasa."}, {"poin": ["Batang: satuan jual. Besi hollow umumnya sepanjang 6 M per batang.", "Per batang dan per kg: dua cara melihat harga yang sama. Pelajaran di materi Menghitung Berat menjelaskan cara membandingkannya.", "Tanda dalam kurung seperti [STD, NB]: kelas dan merek produk."]}, {"p": "Harga di situs bersifat indikatif. Untuk harga dan ketersediaan terbaru, Hubungi Sales."}]}], "ikon": "/_blob/e6abee53e8bf41b7ef01156914bcc7f2", "foto": "/_blob/915ec74eaee1f9cf750844653d514177", "ikonKisi": "/_blob/00da97e46921388346f5ebed06438e78", "barisKisi": "Mengenal Besi\ndan Baja"}, {"id": "ukuran", "judul": "Membaca Ukuran dan Kode SKU", "topik": "Dasar Baja", "tab": "dasar", "level": "Pemula", "ringkas": "Pahami arti setiap angka dan kode pada nama produk, supaya barang yang Anda minta sama dengan yang Anda butuhkan.", "hasil": ["Membaca ukuran penampang", "Membedakan tebal dan panjang", "Memahami kelas dan merek", "Memakai nomor SKU saat bertanya ke sales"], "pelajaran": [{"judul": "Membaca ukuran penampang", "isi": [{"p": "Dua angka pertama pada nama besi hollow adalah ukuran penampangnya, yaitu lebar dan tinggi sisi luar dalam milimeter."}, {"poin": ["40 × 40 mm: penampang persegi, keempat sisinya sama.", "20 × 40 mm: penampang persegi panjang."]}, {"p": "Ukuran diukur dari sisi luar, jadi ruang di dalamnya lebih kecil dari angka yang tertulis."}]}, {"judul": "Tebal dan panjang", "isi": [{"p": "Angka berikutnya adalah tebal dinding, lalu panjang batang."}, {"contoh": "Besi Hollow 40 × 40 × 2 mm × 6 M berarti penampang 40 × 40 mm, tebal dinding 2 mm, dan panjang 6 meter. Beratnya menurut katalog kami 15,07 kg per batang."}, {"p": "Tebal dinding sangat memengaruhi berat, kekuatan, dan harga. Dua batang dengan penampang sama bisa sangat berbeda kalau tebalnya berbeda."}]}, {"judul": "Kelas dan merek", "isi": [{"p": "Tanda di dalam kurung di akhir nama produk menunjukkan kelas dan merek."}, {"contoh": "[STD, NB] berarti kelas STD dan merek NB."}, {"p": "Saat membandingkan harga, pastikan kelas dan mereknya sama. Dua produk berukuran sama belum tentu setara kalau kelasnya berbeda."}]}, {"judul": "Memakai nomor SKU", "isi": [{"p": "Setiap ukuran punya nomor SKU sendiri, misalnya BHHM-40402C0-6STDNB untuk Besi Hollow Hitam 40 × 40 × 2 mm."}, {"p": "Anda tidak perlu menghafal arti kodenya. Cukup sebutkan nomor itu saat Hubungi Sales, supaya tidak ada salah paham soal ukuran, tebal, atau merek."}]}], "ikon": "/_blob/45626a8acf7bfd6470218032dc466704", "foto": "/_blob/b22e2456c64560354d20de7241b466eb", "ikonKisi": "/_blob/f9a8a0ee1dffa984c13e3d764b4e3593", "barisKisi": "Membaca Ukuran\ndan Kode SKU"}, {"id": "jenis", "judul": "Jenis dan Bentuk Besi", "topik": "Dasar Baja", "tab": "dasar", "level": "Pemula", "ringkas": "Kenali berbagai jenis besi dan bentuknya, dari hollow, pipa, hingga baja ringan.", "hasil": ["Mengenali hollow dan pipa", "Membedakan siku, CNP, dan UNP", "Memahami kegunaan baja ringan", "Mengenali plat, besi beton, dan wiremesh"], "pelajaran": [{"judul": "Hollow dan pipa", "isi": [{"p": "Keduanya sama-sama berongga. Bedanya ada pada bentuk penampangnya."}, {"poin": ["Hollow: penampang persegi atau persegi panjang. Mudah disambung dan rapi untuk rangka, pagar, dan kanopi.", "Pipa: penampang bulat. Banyak dipakai untuk saluran, tiang, dan pegangan tangga."]}, {"p": "Keduanya tersedia dalam versi hitam dan galvanis, sehingga bisa dipilih sesuai lokasi pemakaian."}]}, {"judul": "Siku, CNP, dan UNP", "isi": [{"p": "Ketiganya adalah profil terbuka, yaitu tidak berongga tertutup seperti hollow."}, {"poin": ["Siku: berbentuk L, untuk rangka ringan, dudukan, dan pengaku.", "CNP: berbentuk C dengan bibir kecil, umum dipakai untuk gording.", "UNP: berbentuk U, umumnya lebih tebal dan kaku untuk rangka."]}]}, {"judul": "Baja ringan", "isi": [{"p": "Baja ringan adalah profil dari pelat tipis yang dibentuk dan umumnya sudah berlapis pelindung. Bobotnya ringan, sehingga mudah diangkut dan cepat dipasang."}, {"p": "Material ini banyak dipakai untuk rangka atap dan reng. Karena pelatnya tipis, pemasangannya perlu mengikuti perhitungan dan aturan sistem yang dipakai."}]}, {"judul": "Plat, besi beton, dan wiremesh", "isi": [{"poin": ["Plat: lembaran baja dengan berbagai ketebalan, untuk dudukan, lantai kerja, dan fabrikasi.", "Besi beton: batang tulangan yang bekerja di dalam beton.", "Wiremesh: anyaman kawat baja yang dilas, sering dipakai untuk pelat lantai dan jalan beton."]}, {"p": "Materi berikutnya membahas di mana saja material ini dipakai dalam sebuah proyek."}]}], "ikon": "/_blob/c3f584533079233db96bb3ff4a9948b4", "ikonKisi": "/_blob/ea7dc3c47674f899e8411f3753ff0474", "barisKisi": "Jenis dan Bentuk Besi", "fotoPinjam": "/_blob/d9c98bba6778fa72354a5a8d14cb82f0"}, {"id": "aplikasi", "judul": "Aplikasi Besi dalam Konstruksi", "topik": "Dasar Baja", "tab": "dasar", "level": "Pemula", "ringkas": "Temukan berbagai aplikasi besi dan baja untuk kebutuhan konstruksi dan industri.", "hasil": ["Memahami material untuk atap dan kanopi", "Mengenali material struktur bangunan", "Memilih material untuk pagar dan tangga", "Mengenal kebutuhan gudang dan industri"], "pelajaran": [{"judul": "Rangka atap dan kanopi", "isi": [{"p": "Rangka atap menahan penutup atap dan menyalurkan bebannya ke struktur di bawahnya."}, {"poin": ["Baja ringan: umum untuk rangka atap rumah.", "CNP: sering dipakai sebagai gording.", "Hollow: populer untuk rangka kanopi."]}, {"p": "Jenis penutup atap dan lebar bentang ikut menentukan ukuran yang dibutuhkan."}]}, {"judul": "Struktur bangunan", "isi": [{"p": "Pada bangunan bertingkat atau berbentang lebar, beban utama ditahan oleh struktur."}, {"poin": ["WF dan H Beam: balok dan kolom baja.", "Besi beton: tulangan pada kolom, balok, dan pelat beton.", "Wiremesh dan bondek: membantu pelat lantai."]}, {"p": "Ukuran untuk struktur harus mengikuti perhitungan ahli struktur."}]}, {"judul": "Pagar, pintu, dan tangga", "isi": [{"p": "Pekerjaan ini lebih banyak mementingkan bentuk, kerapian, dan ketahanan cuaca."}, {"poin": ["Hollow: rangka pagar dan pintu.", "Besi nako: pengisi pagar dan teralis.", "Plat bordes: pijakan tangga yang permukaannya tidak licin."]}, {"p": "Untuk pemakaian di luar ruangan, pilih material berlapis atau pastikan pengecatannya baik."}]}, {"judul": "Gudang dan kebutuhan industri", "isi": [{"p": "Gudang dan pabrik umumnya membutuhkan bentang lebar, sehingga rangkanya sering memakai profil WF dengan atap galvalum."}, {"p": "Lingkungan industri tertentu juga punya kebutuhan khusus. Area yang lembap atau korosif, misalnya, bisa membutuhkan material stainless."}, {"p": "Sampaikan jenis kegiatan dan lokasinya saat Hubungi Sales, supaya material yang disarankan sesuai."}]}], "ikon": "/_blob/3e718bc7ab6cda584e48720fc28ee7cd", "ikonKisi": "/_blob/bd1cf9a6caebc7647b3a9c6900e5ff34", "barisKisi": "Aplikasi Besi\ndalam Konstruksi", "fotoPinjam": "/_blob/ae3d706d007e98c3accf276b43964d53"}, {"id": "hollow", "judul": "Besi Hollow: Hitam, Galvanis, Galvalum", "topik": "Pilih Material", "tab": "material", "level": "Pemula", "ringkas": "Tiga jenis besi hollow, kelebihan masing-masing, dan cara memilih yang sesuai dengan lokasi pemakaian.", "hasil": ["Memahami kegunaan besi hollow", "Membedakan hitam, galvanis, dan galvalum", "Memilih sesuai lokasi pemakaian", "Mempertimbangkan tebal dinding"], "pelajaran": [{"judul": "Apa itu besi hollow?", "isi": [{"p": "Besi hollow adalah baja berongga dengan penampang persegi atau persegi panjang. Karena berongga, bobotnya lebih ringan daripada baja pejal seukuran."}, {"p": "Besi hollow banyak dipakai untuk rangka kanopi, pagar, pintu, furnitur, dan rangka plafon. Di katalog kami, Besi Hollow Hitam tersedia dalam 297 varian, Galvanis 30 varian, dan Galvalum 4 varian."}]}, {"judul": "Besi hollow hitam", "isi": [{"p": "Besi hollow hitam tidak memiliki lapisan pelindung, sehingga mudah berkarat bila dibiarkan terbuka."}, {"p": "Sebelum dipakai, bersihkan minyak dan kotoran dari pabrik, lalu lapisi dengan cat dasar dan cat akhir. Dengan perawatan yang benar, ia menjadi pilihan yang fleksibel untuk banyak pekerjaan."}]}, {"judul": "Galvanis dan galvalum", "isi": [{"p": "Keduanya sudah berlapis pelindung sehingga lebih tahan karat daripada besi hitam."}, {"poin": ["Galvanis: dilapisi seng.", "Galvalum: dilapisi campuran aluminium dan seng."]}, {"p": "Lapisan ini bisa rusak di bagian yang dipotong atau dilas. Tutup kembali bagian tersebut dengan cat anti karat agar perlindungannya tetap menyeluruh."}]}, {"judul": "Memilih tebal dinding", "isi": [{"p": "Ukuran kecil dengan dinding tipis umumnya cocok untuk rangka ringan, furnitur, dan dekorasi. Makin berat beban dan makin panjang bentangnya, makin besar penampang dan tebal yang dibutuhkan."}, {"p": "Untuk struktur yang menahan beban utama, jangan menebak. Mintalah perhitungan dari ahli struktur, lalu kirim hasilnya ke sales kami untuk dicocokkan dengan ukuran yang tersedia."}]}], "ikon": "/_blob/343247a0d251eec4595cb018cff9b4da", "foto": "/_blob/d9c98bba6778fa72354a5a8d14cb82f0", "ikonKisi": "/_blob/0cbc9a9bfd4057247c376276ee6dd412", "barisKisi": "Besi Hollow: Hitam,\nGalvanis, Galvalum"}, {"id": "beton", "judul": "Besi Beton untuk Tulangan", "topik": "Pilih Material", "tab": "material", "level": "Menengah", "ringkas": "Kenali besi polos dan ulir, cara membaca mutu, dan cara memeriksa ukuran sebenarnya.", "hasil": ["Membedakan besi polos dan ulir", "Membaca diameter dan mutu", "Memeriksa besi kurang ukuran", "Menyimpan tulangan dengan benar"], "pelajaran": [{"judul": "Polos dan ulir", "isi": [{"p": "Besi beton adalah tulangan yang bekerja bersama beton. Beton kuat menahan tekan, sedangkan baja membantu menahan tarik."}, {"poin": ["Besi polos: permukaannya halus, biasa dipakai untuk sengkang dan pekerjaan yang lebih ringan.", "Besi ulir: permukaannya bersirip, sehingga cengkeramannya pada beton lebih baik."]}, {"p": "Jenis yang dipakai sebaiknya mengikuti gambar kerja."}]}, {"judul": "Membaca diameter dan mutu", "isi": [{"p": "Kode seperti D13 berarti besi ulir berdiameter nominal 13 mm. Mutu ditulis seperti BjTS 420, yaitu baja tulangan sirip dengan kuat leleh minimum 420 MPa. Ketentuan baja tulangan di Indonesia diatur dalam SNI 2052."}, {"contoh": "Berat nominal per meter = 0,006165 × diameter². Hasilnya: D10 sekitar 0,62 kg/m, D13 sekitar 1,04 kg/m, dan D16 sekitar 1,58 kg/m."}]}, {"judul": "Memeriksa besi kurang ukuran", "isi": [{"p": "Besi yang lebih kecil dari ukuran nominalnya sering disebut besi banci. Harganya mungkin lebih murah, tetapi kekuatannya juga lebih rendah dari yang dihitung dalam desain."}, {"poin": ["Ukur diameter dengan jangka sorong.", "Timbang sepotong besi dan bandingkan dengan berat nominalnya.", "Periksa tanda produsen dan ukuran pada batang.", "Minta dokumen mutu untuk pekerjaan struktural."]}]}, {"judul": "Menyimpan tulangan", "isi": [{"p": "Simpan besi di atas ganjal agar tidak menyentuh tanah, pisahkan menurut ukuran, dan lindungi dari hujan bila akan lama disimpan."}, {"p": "Bersihkan kotoran, minyak, dan karat yang mudah terkelupas sebelum pengecoran, karena semuanya bisa mengurangi lekatan pada beton."}]}], "ikon": "/_blob/e7f2127a766f0219cda3dc23cae0a90f", "foto": "/_blob/82f7482c4cf4d4aa16b52058a653c31a", "ikonKisi": "/_blob/283252b5abafd23819edf346e5144627", "barisKisi": "Besi Beton untuk\nTulangan"}, {"id": "profil", "judul": "Profil Struktural: WF, H Beam, CNP, UNP, Siku", "topik": "Pilih Material", "tab": "material", "level": "Menengah", "ringkas": "Bedakan profil baja utama, cara membaca ukurannya, dan data yang perlu disiapkan sebelum memilih.", "hasil": ["Membedakan WF dan H Beam", "Mengenali CNP dan UNP", "Membaca ukuran profil", "Menyiapkan data untuk memilih profil"], "pelajaran": [{"judul": "WF dan H Beam", "isi": [{"p": "Keduanya memiliki bagian badan di tengah dan sayap di atas dan bawah. Pada H Beam, lebar sayap kurang lebih sama dengan tingginya. Pada WF, sayapnya umumnya lebih sempit daripada tingginya."}, {"contoh": "WF 200 × 100 × 5,5 × 8 berarti tinggi 200 mm, lebar sayap 100 mm, tebal badan 5,5 mm, dan tebal sayap 8 mm."}, {"p": "Secara umum, WF sering dipakai sebagai balok dan H Beam sebagai kolom, tetapi pilihan akhirnya mengikuti perhitungan struktur."}]}, {"judul": "CNP dan UNP", "isi": [{"p": "Sekilas keduanya mirip, tetapi cara pembuatannya berbeda."}, {"poin": ["CNP: dibentuk dari pelat tipis, memiliki bibir kecil di ujung sayap, dan umum dipakai untuk gording.", "UNP: berbentuk U, umumnya lebih tebal dan kaku, dan dipakai untuk rangka serta dudukan."]}]}, {"judul": "Besi siku", "isi": [{"p": "Besi siku berbentuk L dan diberi nama menurut panjang kedua sisi dan tebalnya, misalnya 40 × 40 × 4 mm."}, {"p": "Ia sering dipakai untuk rangka ringan, bracket, dudukan tangki, dan pengaku. Mudah disambung dengan las maupun baut."}]}, {"judul": "Sebelum memilih profil", "isi": [{"p": "Sebelum Hubungi Sales, siapkan data berikut agar kami bisa membantu lebih cepat:"}, {"poin": ["Gambar kerja atau daftar material dari perencana.", "Jenis pekerjaan dan lokasi pemakaian.", "Ukuran, panjang, dan jumlah yang dibutuhkan."]}, {"p": "Sales dapat membantu mencocokkan kebutuhan dengan produk yang tersedia. Keputusan struktural tetap perlu dikonfirmasi oleh ahli struktur."}]}], "ikon": "/_blob/d20b7834b40029e6a01d7d9e49a55879", "foto": "/_blob/ae3d706d007e98c3accf276b43964d53", "ikonKisi": "/_blob/8fe34d37e271dfdaa960dfeda972758f", "barisKisi": "Profil Struktural:\nWF, H Beam, CNP, UNP, Siku"}, {"id": "hitung", "judul": "Menghitung Berat dan Kebutuhan Material", "topik": "Proyek", "tab": "proyek", "level": "Menengah", "ringkas": "Rumus sederhana untuk memperkirakan berat, jumlah batang, dan cara membandingkan harga.", "hasil": ["Menghitung berat plat", "Memperkirakan berat profil", "Menghitung jumlah batang", "Membandingkan harga per batang dan per kg"], "pelajaran": [{"judul": "Rumus dasar dan plat", "isi": [{"p": "Berat baja dihitung dari volumenya dikali berat jenis, yaitu sekitar 7.850 kg per meter kubik."}, {"contoh": "Plat 1,2 m × 2,4 m tebal 3 mm: 1,2 × 2,4 × 3 × 7,85 = sekitar 67,8 kg per lembar."}]}, {"judul": "Memperkirakan berat profil", "isi": [{"poin": ["Hollow persegi (kg/m): (A² − (A − 2t)²) × 0,00785", "Pipa bulat (kg/m): (D − t) × t × 0,02466", "Besi beton (kg/m): 0,006165 × d²"]}, {"contoh": "Hollow 40 × 40 × 2 mm: (1.600 − 1.296) × 0,00785 = sekitar 2,39 kg/m. Katalog kami mencatat 15,07 kg per 6 M, atau sekitar 2,51 kg/m."}, {"p": "Rumus hanya memberi perkiraan dan bisa berbeda dari data katalog, seperti pada contoh di atas. Untuk anggaran dan pengiriman, pakai berat di katalog atau tanyakan ke sales."}]}, {"judul": "Menghitung jumlah batang", "isi": [{"p": "Jumlahkan seluruh panjang yang dibutuhkan, bagi dengan panjang per batang, lalu bulatkan ke atas."}, {"contoh": "Total 46 meter dengan batang 6 M: 46 ÷ 6 = 7,67, jadi minimal 8 batang."}, {"p": "Periksa juga pola potongannya, karena sisa potongan yang terlalu pendek tidak selalu bisa dipakai. Anda juga dapat mencoba Kalkulator Material di situs kami."}]}, {"judul": "Harga per batang dan per kg", "isi": [{"p": "Harga per kg membantu membandingkan produk dengan berat yang berbeda. Bagi harga per batang dengan berat per batang."}, {"contoh": "Rp 188.600 per batang ÷ 15,07 kg = sekitar Rp 12.515 per kg."}, {"p": "Harga di situs bersifat indikatif dan contoh ini hanya untuk latihan. Hubungi Sales untuk harga terbaru."}]}], "ikon": "/_blob/6d3373162aceeb585cd97aee2f1f90af", "foto": "/_blob/d4b87b8e99ae33d0d12d8f754a41970d", "ikonKisi": "/_blob/2d45692afa48886b2ccd32333c363042", "barisKisi": "Menghitung Berat\ndan Kebutuhan Material"}, {"id": "rencana", "judul": "Merencanakan Material Proyek", "topik": "Proyek", "tab": ."}]}, {"judul": "Mengenal atap UPVC", "isi": [{"p": "Atap UPVC terbuat dari plastik keras, bukan logam, sehingga tidak berkarat. Banyak jenisnya memiliki rongga di dalam lembaran yang membantu meredam panas dan suara."}, {"p": "Karena itu ia sering dipilih untuk bangunan yang ingin terasa lebih sejuk dan tenang. Di katalog kami, Atap UPVC tersedia dalam 9 varian."}]}, {"judul": "Membandingkan keduanya", "isi": [{"poin": ["Galvalum: kuat dan ringan, tetapi panas dan suara hujan lebih terasa bila tanpa peredam.", "UPVC: lebih tenang dan tidak berkarat, cocok untuk lingkungan lembap atau berkadar garam tinggi."]}, {"p": "Pilihan akhir bergantung pada lokasi, fungsi bangunan, dan rangka yang dipakai."}]}, {"judul": "Sebelum memesan", "isi": [{"p": "Siapkan data berikut sebelum Hubungi Sales:"}, {"poin": ["Luas dan bentuk atap.", "Panjang lembaran dan kemiringan atap.", "Jarak gording pada rangka."]}, {"p": "Ikuti petunjuk pemasangan dari produsen, terutama jarak dudukan dan jenis sekrupnya."}]}], "lengkapSaja": true, "ikonKisi": "", "barisKisi": "Atap: Galvalum dan UPVC"}, {"id": "rangka", "judul": "Rangka Atap Ringan: Kanal C dan Reng", "topik": "Pilih Material", "tab": "material", "level": "Pemula", "foto": "/_blob/92cecc0aea17f5ac59de80429b161ea3", "ringkas": "Dua komponen utama rangka atap baja ringan, fungsinya, dan hal yang perlu diperhatikan saat memasang.", "hasil": ["Memahami fungsi Kanal C", "Memahami fungsi reng", "Menentukan jarak reng", "Memasang dengan aman"], "pelajaran": [{"judul": "Kanal C", "isi": [{"p": "Kanal C adalah baja tipis berlapis galvalum dengan penampang berbentuk huruf C. Pada rangka atap ringan, ia umum dipakai untuk kuda-kuda."}, {"p": "Di katalog kami, Kanal C Galvalum tersedia dalam 10 varian."}]}, {"judul": "Reng", "isi": [{"p": "Reng adalah profil baja ringan yang dipasang melintang di atas kuda-kuda. Fungsinya menjadi dudukan penutup atap."}, {"p": "Di katalog kami, Reng Baja Ringan tersedia dalam 4 varian."}]}, {"judul": "Jarak ren
