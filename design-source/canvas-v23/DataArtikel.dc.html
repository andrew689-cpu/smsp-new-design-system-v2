      isi: {"kabar-0": {"judul": "Rusak Diterjang Galodo, Jembatan Panti di Tanah Datar Sumbar Kini Dibangun Kembali", "tag": "Project", "meta": "Kompas | 3 Nov 2026", "url": "https://regional.kompas.com/read/2026/11/03/053000678/rusak-diterjang-galodo-jembatan-panti-di-tanah-datar-sumbar-kini-dibangun", "nama": "Kompas", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di Kompas", "aria": "Baca berita asli di Kompas, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/8f4c46ee53e5d4ffb380464fa4082850", "alt": "Tulangan besi di lokasi konstruksi"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Pembangunan pengganti Jembatan Panti (P.070) di ruas Batusangkar–Ombilin, Kabupaten Tanah Datar, Sumatera Barat, sudah mencapai 48,77 persen. Jembatan lama rusak diterjang galodo pada 2024, dan penggantinya ditargetkan rampung pada Desember 2026 dengan masa kontrak 173 hari kalender."}, {"t": "p", "x": "Proyek senilai Rp 11,03 miliar ini didanai Transfer ke Daerah (TKD) Tambahan Provinsi Sumatera Barat tahun anggaran 2026. Tujuannya memulihkan salah satu jalur utama antara Kabupaten Tanah Datar dan Kabupaten Solok."}, {"t": "h2", "x": "Tahap pekerjaan"}, {"t": "p", "x": "Edi Andirya, pengawas sekaligus humas kontraktor pelaksana CV Nadha Permata, menyebut pekerjaan kini memasuki persiapan pemasangan rangka baja. Seluruh material rangka sudah tiba di lokasi, dan kepala jembatan (abutment) di kedua sisi sungai sudah selesai."}, {"t": "p", "x": "Kontraktor menunggu beton mencapai kekuatan optimal. Pemasangan rangka diperkirakan dimulai satu hingga dua pekan sesudahnya, lalu dilanjutkan dengan struktur atas jembatan."}, {"t": "h2", "x": "Spesifikasi jembatan"}, {"t": "list", "items": ["Bentang 25 meter dengan lebar badan jalan enam meter", "Trotoar dan dinding jembatan masing-masing selebar satu meter di kedua sisi", "Rangka baja kelas B dengan fondasi beton di kedua pangkal", "Dinding penahan tanah untuk memperkuat area sekitar"]}, {"t": "h2", "x": "Kendala dan dampak bagi warga"}, {"t": "p", "x": "Lokasinya berada di daerah aliran sungai, sehingga banjir sempat terjadi dua hingga tiga kali pada bulan-bulan awal dan menghambat pekerjaan fondasi. Menurut kontraktor, kendala struktur bawah kini sudah teratasi dan pekerjaan masih sesuai jadwal kontrak. Pemisah jalur dipasang, sementara alat berat dan personel disiagakan 24 jam."}, {"t": "p", "x": "Selama pembangunan, kendaraan melewati jembatan darurat dengan sistem buka-tutup. Warga sekitar mengeluhkan kemacetan, jalan becek saat hujan, dan debu saat panas. Pengguna jalan juga menyebut tanah yang melunak di musim hujan kerap membuat truk bermuatan terjerembab dan memicu antrean panjang."}, {"t": "h2", "x": "Pemulihan pascabencana Sumatera"}, {"t": "p", "x": "Menteri Dalam Negeri sekaligus Ketua Satgas Percepatan Rehabilitasi dan Rekonstruksi Pascabencana Sumatera, Muhammad Tito Karnavian, menyatakan sejumlah infrastruktur yang sudah diperbaiki kembali rusak akibat banjir dan longsor susulan. Rehabilitasi disebut berlangsung hingga 2028, dan 29 kementerian serta lembaga penerima anggaran diminta mempercepat pekerjaan. Ribuan kegiatan yang didanai pada 2026 ditargetkan selesai sebelum 31 Desember 2026."}]}, "kabar-1": {"judul": "Pembebasan Lahan Jembatan Kemang Pratama Dikebut, Pemkot Bekasi Targetkan Rampung 2 November", "tag": "Project", "meta": "Disway | 1 Nov 2026", "url": "https://disway.id/read/976786/pembebasan-lahan-jembatan-kemang-pratama-dikebut-pemkot-bekasi-targetkan-rampung-2-november", "nama": "Disway", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di Disway", "aria": "Baca berita asli di Disway, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/22f3a8bb1eb5fb29199f6081e1a46eff", "alt": "Pekerjaan pondasi di lokasi proyek"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Pemerintah Kota Bekasi mempercepat pembebasan lahan untuk penggantian Jembatan Kemang Pratama dan rencana Flyover Bulak Kapal. Wali Kota Bekasi Tri Adhianto menyampaikannya di Bekasi pada Jumat, 30 Oktober 2026."}, {"t": "h2", "x": "Status lahan"}, {"t": "p", "x": "Dari 76 bidang tanah yang dibutuhkan, 40 bidang sudah selesai dan sekitar 36 bidang masih dituntaskan. Sebagian di antaranya milik Perum Jasa Tirta dan Kementerian Sosial, serta lahan fasilitas sosial dan fasilitas umum. Pemkot juga meminta dukungan Menko Infrastruktur dan Pembangunan Kewilayahan Agus Harimurti Yudhoyono untuk koordinasi antarinstansi."}, {"t": "p", "x": "Bidang yang tidak bisa dibayar langsung akan diselesaikan melalui konsinyasi, yaitu penitipan ganti rugi di pengadilan. Pemilik tanah diberi waktu sekitar satu minggu setelah pembayaran untuk membongkar sendiri bangunannya."}, {"t": "h2", "x": "Jadwal"}, {"t": "list", "items": ["2 November 2026: target seluruh pembebasan lahan rampung", "14 November 2026: target kontrak pekerjaan", "15 November 2026: target pekerjaan fisik dimulai"]}, {"t": "h2", "x": "Lalu lintas dan anggaran"}, {"t": "p", "x": "Rekayasa lalu lintas disiapkan bersama Dinas Perhubungan dan perangkat daerah terkait. Jalur alternatif antara lain melalui kawasan Ampera dan Jalan Muhammad Yamin. Pemkot juga menjajaki jalan frontage milik perkeretaapian untuk menghubungkan Rawapanjang, Bulak Kapal, Ampera, dan Jalan Muhammad Yamin."}, {"t": "p", "x": "Pembangunan ini didukung anggaran pemerintah pusat hampir Rp188 miliar, yang menurut Tri akan berat jika ditanggung APBD. Flyover Bulak Kapal diharapkan mengurai kepadatan di perlintasan sebidang kereta api, yang juga direncanakan ditutup demi keselamatan."}]}, "kabar-2": {"judul": "AHY Tinjau Jembatan Kemang Pratama, Desain Baru Hadapi Banjir", "tag": "Project", "meta": "Jawara Berita | 30 Okt 2026", "url": "https://jawaraberita.com/ahy-tinjau-jembatan-kemang-pratama", "nama": "Jawara Berita", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di Jawara Berita", "aria": "Baca berita asli di Jawara Berita, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/543433e6f73f4e809da2a670fbd0133b", "alt": "Petugas memeriksa material di lokasi proyek"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Menko Infrastruktur dan Pembangunan Kewilayahan Agus Harimurti Yudhoyono meninjau Jembatan Kemang Pratama di Kota Bekasi pada Jumat, 30 Oktober 2026. Menurut laporan ini, rekonstruksi jembatan selesai pada 26 Agustus 2026."}, {"t": "h2", "x": "Penyebab kerusakan"}, {"t": "p", "x": "Banjir besar pada Maret 2025 menaikkan debit Sungai Bekasi. Sampah yang terbawa arus tersangkut di pilar tengah jembatan lama, menambah tekanan pada struktur, hingga pilar rusak dan jembatan putus."}, {"t": "h2", "x": "Desain dan anggaran"}, {"t": "list", "items": ["Tanpa pilar di tengah sungai, bentang sekitar 80 meter", "Ketinggian disesuaikan dengan permukaan air tertinggi", "Biaya sekitar Rp60,48 miliar dari program Inpres Jalan Daerah, lebih rendah dari perkiraan awal sekitar Rp63,97 miliar"]}, {"t": "h2", "x": "Pengujian dan musim hujan"}, {"t": "p", "x": "Sebelum dipakai penuh, jembatan diuji memakai kendaraan besar termasuk truk, dengan acuan sekitar satu ton per meter persegi. AHY menyoroti November dan Desember sebagai ujian pertama ketahanannya, karena curah hujan berpotensi naik."}]}, "kabar-3": {"judul": "Kapan Jembatan Lalan Bisa Dilintasi Lagi? Kontraktor Ungkap Target Penyambungan Ditanggal Ini", "tag": "Project", "meta": "Palpres | 30 Okt 2026", "url": "https://palpres.disway.id/musi-banyuasin/read/781478/kapan-jembatan-lalan-bisa-dilintasi-lagi-kontraktor-ungkap-target-penyambungan-ditanggal-ini", "nama": "Palpres", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di Palpres", "aria": "Baca berita asli di Palpres, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/bf22ef1d059222c36c31001fb9609162", "alt": "Bongkar muat material besi di lokasi proyek"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Pemerintah Kabupaten Musi Banyuasin mendesak percepatan revitalisasi Jembatan Lalan, yang ambruk pada 2024 setelah dihantam tugboat yang menarik tongkang batu bara. Rapat percepatannya digelar di Kantor Perwakilan Musi Banyuasin di Palembang pada Kamis, 29 Oktober 2026."}, {"t": "h2", "x": "Target penyambungan"}, {"t": "p", "x": "Kontraktor menargetkan pemasangan rangka baja segmen 10 selesai pada 31 Januari 2027, sehingga Jembatan P6 Lalan tersambung. Keseluruhan pekerjaan dijadwalkan selesai pada April 2027."}, {"t": "h2", "x": "Progres hingga minggu ke-64"}, {"t": "p", "x": "Pada periode 19–25 Oktober 2026, realisasi fisik tercatat 69,98 persen dari rencana 66,89 persen, atau deviasi positif 3,09 persen."}, {"t": "table", "rows": [["Pekerjaan", "Capaian"], ["Engineering", "8,60 persen"], ["Procurement", "50,86 persen"], ["Konstruksi", "7,76 persen"], ["Metode pylon", "2,76 persen"]]}, {"t": "p", "x": "Wakil Bupati Musi Banyuasin Abdur Rohman Husen menekankan koordinasi dan evaluasi menyeluruh agar setiap kendala tertangani secara terukur, dengan tetap menjaga aspek teknis dan kualitas konstruksi."}]}, "kabar-4": {"judul": "Akses Tol dari Bandara Sepinggan ke IKN Ditarget Tuntas 2028", "tag": "Project", "meta": "Bontang Post | 14 Okt 2026", "url": "https://bontangpost.id/akses-tol-dari-bandara-sepinggan-ke-ikn-ditarget-tuntas-2028/", "nama": "Bontang Post", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di Bontang Post", "aria": "Baca berita asli di Bontang Post, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/e5907f6a2d0576cfb96384f890f9e859", "alt": "Pekerja di atas pelat lantai jalan layang"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Jalan Tol Sepinggan Paket 1B menghubungkan Bandara Internasional Sultan Aji Muhammad Sulaiman Sepinggan dengan jaringan Tol Balikpapan–Samarinda. Hingga Oktober 2026, progres fisik proyek yang dikerjakan PT Wijaya Karya (Persero) Tbk mencapai 34,5 persen, dengan target rampung Juli 2028."}, {"t": "p", "x": "Jaringan tol terintegrasi ini ditargetkan memangkas waktu tempuh ke kawasan IKN menjadi sekitar 50 menit, sekaligus mempermudah perjalanan dari Balikpapan dan Samarinda ke wilayah lain, termasuk Kalimantan Selatan."}, {"t": "h2", "x": "Lingkup pekerjaan"}, {"t": "list", "items": ["Jalan utama sepanjang 3.266 meter", "Jalan layang (viaduct) sepanjang 1.545 meter", "Jalur penghubung (ramp) sekitar delapan kilometer", "Empat overpass dengan total panjang 340 meter", "Satu struktur jembatan sepanjang 87 meter"]}, {"t": "h2", "x": "Capaian per bagian"}, {"t": "p", "x": "Dari 15 segmen konstruksi, lima sudah rampung sepenuhnya. Penanganan lereng di awal jalan utama dan pengecoran beton di area Ramp 4 juga sudah selesai. Pekerjaan kini difokuskan pada struktur jembatan Ramp 1, perkerasan beton, dan drainase di simpang susun."}, {"t": "table", "rows": [["Bagian", "Progres"], ["Overpass pertama", "97,6 persen"], ["Ramp 3 dan Ramp 4", "97,1 persen"], ["Ramp 1 dan Ramp 2", "94,9 persen"]]}, {"t": "h2", "x": "Metode tanpa perancah"}, {"t": "p", "x": "Tol Balikpapan–Samarinda masih beroperasi di bawah area proyek. Agar lalu lintas tetap lancar, WIKA memakai metode shoring-less, yaitu membangun jembatan tanpa perancah penyangga dari bawah. Corporate Secretary WIKA Ngatemin menyebut proyek ini bagian dari dukungan perusahaan terhadap infrastruktur menuju IKN."}]}, "kabar-5": {"judul": "Skybridge Supertall Indonesia 1 Seberat Puluhan Ton Segera Diangkat Menembus Ketinggian 117,6 Meter", "tag": "Project", "meta": "Top Konstruksi | 6 Okt 2026", "url": "https://topkonstruksi.com/skybridge-supertall-indonesia-1-seberat-puluhan-ton-segera-diangkat-menembus-ketinggian-1176-meter/", "nama": "Top Konstruksi", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di Top Konstruksi", "aria": "Baca berita asli di Top Konstruksi, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/d9d55768978d94b71a7b932d82625603", "alt": "Rangka baja struktur bangunan"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Dua menara supertall Indonesia 1 milik PT Surya Indonesia Satu Property setinggi 306 meter di kawasan Jalan MH Thamrin, Jakarta Pusat, memasuki salah satu tahap tersulitnya: mengangkat struktur skybridge ke ketinggian lebih dari 100 meter, yang dijadwalkan sekitar akhir Oktober 2026."}, {"t": "h2", "x": "Dua skybridge, dua metode"}, {"t": "p", "x": "Menara ini dihubungkan dua skybridge baja, masing-masing dua lantai. Skybridge pertama di antara Lantai 3 hingga 5 sudah selesai, dirakit di atas perancah yang ditopang dari lantai dasar. Skybridge kedua berada di antara Lantai 21 hingga 23, dengan atap pada elevasi +117,6 meter, sehingga perancah dari tanah tidak lagi layak secara teknis maupun ekonomi."}, {"t": "h2", "x": "High-altitude truss hoisting"}, {"t": "p", "x": "Kontraktor memakai metode high-altitude truss hoisting, yang disebut sebagai penerapan pertama pada gedung bertingkat di Indonesia. Setelah dua bentang kantilever tersambung sementara, rangka seberat puluhan ton ditarik dengan tali baja khusus lewat 12 unit hydraulic heavy strand jack yang bekerja serempak."}, {"t": "p", "x": "Pakar rekayasa struktur Davy Sukamta menjelaskan pengendalian jarak jauh harus sangat presisi agar beban terbagi merata pada kedua menara. Saat berita ini terbit, perakitan rangka masih berlangsung di atas atap skybridge bawah."}, {"t": "h2", "x": "Siapa mengerjakan apa"}, {"t": "p", "x": "Analisis, desain struktur, dan kalkulasi pembebanan disebut sepenuhnya dirancang insinyur Indonesia. Pengangkatannya dilaksanakan China State Construction Engineering Corporation (CSCEC) dengan teknologi dan peralatan dari China."}]}, "kabar-6": {"judul": "Lima Proyek Arsitektur Indonesia Bersaing di ASEAN Steel Architectural Awards 2026", "tag": "Inspiration", "meta": "Koran Jakarta | 18 Okt 2026", "url": "https://koran-jakarta.com/2026-10-18/lima-proyek-arsitektur-indonesia-bersaing-di-asean-steel-architectural-awards-2026", "nama": "Koran Jakarta", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di Koran Jakarta", "aria": "Baca berita asli di Koran Jakarta, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/86929f2b06edc4d1ff8cd7af4d31b399", "alt": "Rangka besi hollow pada interior bangunan"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Lima proyek arsitektur Indonesia terpilih mewakili Tanah Air di ASEAN Steel Architectural Awards 2026, yang berlangsung pada 20 November 2026 di Bangkok, Thailand. Ajang ini diselenggarakan Ikatan Arsitek Indonesia bersama PT NS BlueScope Indonesia."}, {"t": "h2", "x": "Lima proyek"}, {"t": "table", "rows": [["Proyek", "Kategori SAA Indonesia 2026", "Perancang"], ["IC House", "Residential", "Angkasa Architects, Jeffri Angkasa"], ["Euroasiatic Head Quarter", "Industrial", "PT Pandega Desain Weharima, M. Archica Danisworo"], ["Jakarta Premium Outlet", "Commercial", "PT Pandega Desain Weharima, M. Archica Danisworo"], ["Desa Binaan Tampelas", "Public & Institutional", "PT Pandega Desain Weharima, Prasetyoadi"], ["Abadi Klender Center", "Special Recognition", "PT Pavilion Sembilanlima, Cahyo Wilis Candrawan"]]}, {"t": "h2", "x": "Cara baja dipakai"}, {"t": "list", "items": ["IC House: baja pada atap dan struktur untuk fleksibilitas ruang dan karakter hunian, dengan perhatian pada cahaya alami dan kenyamanan penghuni", "Euroasiatic Head Quarter: struktur bentang lebar yang memberi keleluasaan mengatur ruang operasional, ditambah baja lapis sesuai kondisi lingkungan", "Jakarta Premium Outlet: baja lapis yang dipilih mengikuti karakter ruang dan paparan luar ruangan", "Desa Binaan Tampelas: fasilitas publik dengan baja pada atap dan struktur untuk keleluasaan menata ruang"]}, {"t": "h2", "x": "Penghargaan khusus"}, {"t": "p", "x": "Abadi Klender Center menerima Special Recognition untuk ketahanan estetika COLORBOND Steel. Syaratnya memakai material tersebut dan sudah beroperasi penuh minimal lima tahun, dengan penilaian pada kemampuan mempertahankan tampilan dan warna di tengah paparan cuaca. Penghargaan ini bertepatan dengan 60 tahun merek COLORBOND Steel."}]}, "kabar-7": {"judul": "Penyerahan Rumah Tangguh Gempa NTT dan Pengumuman 5 Karya Arsitektur Baja Terbaik", "tag": "Inspiration", "meta": "Benang.id | 9 Okt 2026", "url": "https://benang.id/penyerahan-rumah-tangguh-gempa-ntt-dan-pengumuman-5-karya-arsitektur-baja-terbaik/", "nama": "Benang.id", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di Benang.id", "aria": "Baca berita asli di Benang.id, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/1d4302f59234bbbfd1443eca66f0cc14", "alt": "Tumpukan besi hollow"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "BlueScope Indonesia dan Ikatan Arsitek Indonesia menutup Steel Architectural Awards (SAA) Indonesia 2026 dengan menyerahkan satu unit Rumah Tangguh dan satu fasilitas mandi, cuci, kakus bagi warga terdampak gempa di Nusa Tenggara Timur. Penyerahan simbolisnya dilakukan pada malam penganugerahan di Labuan Bajo, pertengahan September 2026."}, {"t": "h2", "x": "Apa itu Rumah Tangguh"}, {"t": "list", "items": ["Hunian modular berbahan baja prefabrikasi untuk kondisi darurat pascabencana", "Dirakit dalam 2 hingga 5 hari kerja", "Rangka baja ringan LYSAGHT dan baja BlueScope ZACS", "Penutup bangunan profil TRATAS berbahan BlueScope ZACS Natural Black Rokan"]}, {"t": "h2", "x": "Pemenang SAA Indonesia 2026"}, {"t": "p", "x": "Tahun keempat ajang ini mengusung tema Shaping Resilient Futures dan memperingati 60 tahun COLORBOND di dunia arsitektur."}, {"t": "table", "rows": [["Kategori", "Karya", "Perancang"], ["Residential", "IC House", "Angkasa Architects (Jeffri Angkasa)"], ["Industrial", "Euroasiatic Head Quarter", "PT. Pandega Desain Weharima (M. Archica Danisworo)"], ["Commercial", "Jakarta Premium Outlet", "PT. Pandega Desain Weharima (M. Archica Danisworo)"], ["Public & Institutional", "Desa Binaan Ampelas", "PT. Pandega Desain Weharima (Prasetyoadi)"], ["Special Recognition", "Showroom Abadi Klender", "PT. Pavilion Sembilanlima (Cahyo Wilis Candrawan)"]]}, {"t": "h2", "x": "Menuju Bangkok"}, {"t": "p", "x": "Ketua Dewan Juri Firman Setia Herwanto menyebut penilaian melihat juga cara baja dieksplorasi untuk menjawab tantangan lingkungan. Kelima karya mewakili Indonesia pada 20 November 2026 di Bangkok, bersaing dengan karya dari Malaysia, Vietnam, dan Thailand. Pemenang ASEAN berhak mengikuti perjalanan belajar satu minggu ke fasilitas utama BlueScope di Australia."}]}, "kabar-8": {"judul": "Steel Architectural Awards ASEAN 2026 Announces 12 Finalists Advancing Regional Design Excellence", "tag": "Inspiration", "meta": "ArchDaily | 22 Sep 2026", "url": "https://www.archdaily.com/1185350/steel-architectural-awards-asean-2026-announces-12-finalists-advancing-regional-design-excellence", "nama": "ArchDaily", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di ArchDaily", "aria": "Baca berita asli di ArchDaily, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/4f1fe96368319017176ee4f14f4c4b69", "alt": "Tumpukan besi batang"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Steel Architectural Awards ASEAN 2026 yang dipersembahkan BlueScope menetapkan 12 proyek finalis dari Indonesia, Malaysia, Thailand, dan Vietnam. Mereka dipilih lewat program penghargaan di negara masing-masing dan kini menuju penilaian regional oleh juri internasional."}, {"t": "p", "x": "Ini edisi ASEAN yang kedua, dengan tema Shaping Resilient Futures: Timeless Design with Coated Steel. Program ini menilai arsitektur yang unggul dalam desain, inovasi, keberlanjutan, dan pemakaian baja lapis, sekaligus mendorong pertukaran pengetahuan antararsitek di kawasan."}, {"t": "h2", "x": "12 finalis"}, {"t": "table", "rows": [["Kategori", "Negara", "Proyek", "Perancang"], ["Commercial", "Indonesia", "Jakarta Premium Outlet", "Pandega Desain Weharima"], ["Commercial", "Malaysia", "TUAH 1895", "GDP Architects"], ["Commercial", "Thailand", "KiN", "DesireSynthesis"], ["Commercial", "Vietnam", "Can Gio Pavilions", "DE-SO Asia"], ["Industrial", "Indonesia", "Euroasiatic Head Quarter", "PT. Pandega Desain Weharima"], ["Industrial", "Thailand", "Nova Organic Office and Warehouse", "Atelier of Architects"], ["Industrial", "Vietnam", "Pandora Crafting Facility, Binh Duong", "Archetype Vietnam"], ["Residential", "Indonesia", "IC House", "Angkasa Architects"], ["Residential", "Thailand", "Baan Maiyalap", "Physicalist"], ["Institutional, Public & Others", "Indonesia", "Desa Binaan Tampelas", "PT Pandega Desain Weharima"], ["Institutional, Public & Others", "Malaysia", "Pusat Rehabilitasi Perkeso Sultan Nazrin Shah", "RSP Architects"], ["Institutional, Public & Others", "Thailand", "Chiang Mai University Main Stadium", "A49CH"]]}, {"t": "h2", "x": "Cara penilaian"}, {"t": "p", "x": "Penilaian berlangsung pada Oktober 2026, saat perwakilan proyek mempresentasikan karyanya langsung kepada juri. Tiga kriteria yang dipakai adalah keunggulan desain, inovasi, dan keberlanjutan, dengan perhatian pada peran baja lapis terhadap kualitas arsitektur, daya tahan, respons iklim, dan kinerja teknis."}, {"t": "h2", "x": "Dewan juri"}, {"t": "list", "items": ["Geoffrey Croker, Principal fjcstudio (Australia)", "Firman Setia Herwanto, Vice President Ikatan Arsitek Indonesia (Indonesia)", "Dr. Serina Hijjas, Principal Hijjas Kasturi Associates (Malaysia)", "Kulthida Songkittipakdee, Vice President Association of Siamese Architects under Royal Patronage (Thailand)", "Dr. Truong Nguyen Hoang Long, University of Architecture Ho Chi Minh City (Vietnam)"]}, {"t": "h2", "x": "Pengumuman di Bangkok"}, {"t": "p", "x": "Pemenang diumumkan di Bangkok pada 20 November 2026. Malam itu juga ada penghargaan khusus untuk 60 tahun baja COLORBOND. Pemenang tiap kategori diundang mengikuti perjalanan belajar satu minggu ke Australia."}]}, "kabar-9": {"judul": "Utilisasi Industri Baja Masih 50%-60%, Target 85% Tergantung Permintaan", "tag": "Berita Besi", "meta": "Kontan | 28 Okt 2026", "url": "https://industri.kontan.co.id/news/utilisasi-industri-baja-masih-50-60-target-85-tergantung-permintaan", "nama": "Kontan", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di Kontan", "aria": "Baca berita asli di Kontan, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/a99bab86ecca79d21fcfe2eedcfe9f9d", "alt": "Grafik naik di atas produk besi"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Target pemerintah menaikkan utilisasi kapasitas industri nasional ke 80 hingga 85 persen pada akhir 2026 masih menjadi tantangan bagi industri baja, yang saat ini berada di kisaran 50 hingga 60 persen. Angkanya berbeda-beda antarsegmen, dari hulu hingga hilir, menurut Direktur Eksekutif IISIA Harry Warganegara pada Rabu, 28 Oktober 2026."}, {"t": "h2", "x": "Hambatan"}, {"t": "p", "x": "Produsen domestik menghadapi tekanan baja impor yang membatasi ruang menaikkan produksi, ditambah kelebihan kapasitas global, persaingan harga, dan dugaan praktik perdagangan tidak adil. Pencapaian target dinilai bergantung pada pertumbuhan permintaan, daya saing produsen, dan efektivitas kebijakan."}, {"t": "h2", "x": "Yang diminta IISIA"}, {"t": "list", "items": ["Pengawasan impor lebih ketat, termasuk dugaan dumping dan kesesuaian klasifikasi HS, uraian barang, serta dokumen impor", "Penyerapan baja dalam negeri lewat P3DN dan TKDN, terutama di proyek pemerintah dan BUMN", "Akses Harga Gas Bumi Tertentu dan tarif listrik industri yang kompetitif", "Tata kelola impor berbasis Neraca Komoditas dan optimalisasi bahan baku domestik, termasuk scrap", "Penerapan SNI wajib dan instrumen trade remedies seperti antidumping, bea masuk imbalan, dan safeguard", "Insentif fiskal dan pembiayaan untuk modernisasi teknologi, efisiensi, dan baja rendah emisi"]}]}, "kabar-10": {"judul": "Menteri Perindustrian Terima Audiensi IISIA, Dukung Penguatan dan Daya Saing Industri Baja Nasional", "tag": "Berita Besi", "meta": "IISIA | 15 Okt 2026", "url": "https://iisia.or.id/news/menteri-perindustrian-terima-audiensi-iisia-dukung-penguatan-dan-daya-saing-industri-baja-nasional", "nama": "IISIA", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di IISIA", "aria": "Baca berita asli di IISIA, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/7d9319fb9f5df07e952380182faa7ed4", "alt": "Jabat tangan dalam pertemuan"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Menteri Perindustrian Muhammad Sarmuji menerima audiensi The Indonesian Iron & Steel Industry Association (IISIA) di Jakarta pada 14 Oktober 2026. Chairman IISIA Willgo Zainar meminta dukungan karena utilisasi industri baja nasional masih sekitar 43 hingga 57 persen, sehingga kapasitas yang menganggur perlu dimanfaatkan."}, {"t": "h2", "x": "Tekanan impor"}, {"t": "p", "x": "Kelebihan pasokan baja dunia disebut mencapai 640 juta ton, 120 juta ton di antaranya dari Tiongkok. Menurut IISIA, hambatan dagang dari Uni Eropa dan Amerika membuat Indonesia menjadi sasaran ekspor Tiongkok, sehingga diperlukan koordinasi lintas kementerian."}, {"t": "h2", "x": "Angka industri"}, {"t": "list", "items": ["189 anggota produsen baja nasional", "Produksi 18 juta ton per tahun", "Impor 8 juta ton per tahun pada tahun-tahun sebelumnya", "Impor sudah 7 juta ton hingga Agustus 2026, diprediksi terus naik sampai akhir tahun"]}, {"t": "h2", "x": "Kebijakan gas"}, {"t": "p", "x": "IISIA menyoroti Harga Gas Bumi Tertentu. Industri baja mendapat alokasi 60 persen dari kuota gas yang diperoleh, dan dibatasi kuota lainnya, sehingga dukungan energi dinilai belum optimal dan perlu dievaluasi."}]}, "kabar-11": {"judul": "Dunia Banjir Baja 640 Juta Ton, Pengusaha Datangi Menperin Desak Ini", "tag": "Berita Besi", "meta": "CNBC Indonesia | 14 Okt 2026", "url": "https://www.cnbcindonesia.com/news/20261014133718-4-776106/dunia-banjir-baja-640-juta-ton-pengusaha-datangi-menperin-desak-ini/amp", "nama": "CNBC Indonesia", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di CNBC Indonesia", "aria": "Baca berita asli di CNBC Indonesia, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/1b386226b1f495076aebeeefa06f804b", "alt": "Tumpukan besi beton ulir"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "IISIA meminta pemerintah tegas membatasi masuknya besi dan baja impor, serta mengeluhkan pasokan gas yang terbatas. Permintaan itu disampaikan Chairman IISIA Willgo Zainar dan Vice Chairman Ismail Mandry saat bertemu Menteri Perindustrian M Sarmuji di kantor Kemenperin, Jakarta, Rabu, 14 Oktober 2026."}, {"t": "h2", "x": "Laporan pengusaha"}, {"t": "p", "x": "Willgo melaporkan utilisasi 43 hingga 57 persen, dan menyebut gempuran impor tidak hanya dari China. Kelebihan produksi dunia sekitar 640 juta ton, dengan China menyumbang setidaknya 120-an juta ton. Hambatan dagang China dengan Uni Eropa dan Amerika dinilai akan mengalihkan pasokan ke Indonesia."}, {"t": "p", "x": "Ismail menambahkan IISIA memiliki 189 perusahaan anggota dengan produksi 18 juta ton per tahun. Impor tercatat 8 juta ton per tahun pada 2024 dan 2025, dan 7 juta ton hingga Agustus 2026. Ia meminta impor dibatasi, kecuali untuk produk yang memang tidak bisa dibuat di dalam negeri."}, {"t": "h2", "x": "Tanggapan pemerintah"}, {"t": "p", "x": "Dirjen Industri Logam, Mesin, Alat Transportasi, dan Elektronika Kemenperin Setia Diarta mengatakan laporan itu ditampung terlebih dahulu, lalu dicarikan solusi bersama kementerian lain."}]}, "kabar-12": {"judul": "IISIA Memasuki Periode Kepengurusan Baru 2026-2030, Perkuat Soliditas Industri Baja Nasional", "tag": "Berita Besi", "meta": "IISIA | 7 Okt 2026", "url": "https://iisia.or.id/news/iisia-memasuki-periode-kepengurusan-baru-20262030-perkuat-soliditas-industri-baja-nasional", "nama": "IISIA", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di IISIA", "aria": "Baca berita asli di IISIA, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/9970c1558c871042772107d2dc626f01", "alt": "Bidak catur sebagai gambaran kepemimpinan"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "IISIA memasuki kepengurusan periode 2026–2030 melalui Rapat Executive Committee pada Senin, 28 September 2026, di Hotel Mercure Jakarta Gatot Subroto. Dr. Akbar Djohan mengakhiri masa jabatannya sebagai Chairman, digantikan Willgo Zainar."}, {"t": "h2", "x": "Fokus hulu ke hilir"}, {"t": "p", "x": "Prioritasnya memperkuat koordinasi industri hulu, antara, dan hilir, agar kapasitas terpakai optimal, kebutuhan hilir terpenuhi dari dalam negeri, dan ketergantungan impor berkurang bertahap, terutama untuk produk yang sudah bisa dibuat di dalam negeri."}, {"t": "h2", "x": "Instrumen kebijakan"}, {"t": "p", "x": "IISIA akan bekerja sama dengan Kementerian Perindustrian dan kementerian atau lembaga terkait agar kebijakan yang sudah ada berjalan lebih efektif:"}, {"t": "list", "items": ["Trade remedies", "SNI wajib", "TKDN dan P3DN", "Kebijakan investasi dan dukungan fiskal", "Kebijakan energi dan bahan baku"]}, {"t": "h2", "x": "Tantangan dan sasaran"}, {"t": "p", "x": "Peraturan Dirjen ILMATE Nomor 1 Tahun 2026 menempatkan besi dan baja sebagai industri prioritas. Tantangannya meliputi tekanan impor, kebutuhan bahan baku dan energi yang kompetitif, serta pemanfaatan produk nasional yang belum optimal."}, {"t": "p", "x": "Sebagai industri dasar, baja terkait dengan manufaktur, konstruksi, infrastruktur, otomotif, dan energi. Menurut IISIA, utilisasi yang lebih tinggi dapat memperkuat rantai pasok, menciptakan nilai tambah, dan mengurangi kebocoran devisa."}]}, "kabar-13": {"judul": "Tantangan Actual Value dan Default Value dalam Implementasi CBAM bagi Industri Baja Indonesia", "tag": "Berita Besi", "meta": "IISIA | 10 Sep 2026", "url": "https://iisia.or.id/news/tantangan-actual-value-dan-default-value-dalam-implementasi-cbam-bagi-industri-baja-indonesia", "nama": "IISIA", "catatan": "Laporan ini ditulis ulang redaksi SMS Perkasa dari berita aslinya.", "label": "Baca berita asli di IISIA", "aria": "Baca berita asli di IISIA, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/36e0a1e8fad4dbfeb533cca3370a1022", "alt": "Dokumen spesifikasi teknis di atas besi"}, {"t": "ket", "x": "Foto ilustrasi dari SMS Perkasa, bukan foto dari berita ini."}, {"t": "p", "x": "Setelah masa transisi sejak 1 Oktober 2023 hingga Desember 2025, Carbon Border Adjustment Mechanism (CBAM) Uni Eropa memasuki periode definitif pada Januari 2026. Produsen besi dan baja yang mengekspor ke Uni Eropa kini perlu menghitung, mendokumentasikan, dan menyerahkan data emisi tertanam kepada importir."}, {"t": "h2", "x": "Actual value dan default value"}, {"t": "p", "x": "Jika perusahaan punya data emisi aktual yang diverifikasi lembaga yang diakui Uni Eropa, data itu menjadi dasar perhitungan. Jika tidak, Uni Eropa memakai default value, yang untuk baja Indonesia berkisar 1,69 hingga 13,24 tCO2e per ton."}, {"t": "table", "rows": [["Tahun", "Mark-up default value"], ["2026", "10 persen"], ["2027", "20 persen"], ["Mulai 2028", "30 persen"]]}, {"t": "h2", "x": "Mengapa dinilai merugikan"}, {"t": "list", "items": ["Nilai itu mengasumsikan seluruh baja Indonesia dibuat lewat jalur BF-BOF, padahal ada fasilitas EAF yang emisinya jauh lebih rendah", "Intensitas BF-BOF Indonesia sendiri diperkirakan sekitar 2,5 tCO2e per ton, jauh di bawah default value", "Dibanding Korea Selatan, Jepang, Tiongkok, India, dan Vietnam, default value Indonesia termasuk yang tertinggi, tanpa penjelasan yang memadai"]}, {"t": "h2", "x": "Bukan hanya Uni Eropa"}, {"t": "p", "x": "Inggris akan menerapkan UK CBAM mulai 1 Januari 2027 untuk produk termasuk besi dan baja. Australia pada 2026 menyelesaikan Carbon Leakage Review yang merekomendasikan pertimbangan border carbon adjustment untuk komoditas tertentu."}, {"t": "h2", "x": "Yang perlu disiapkan Indonesia"}, {"t": "p", "x": "IISIA menilai Indonesia punya fondasi lewat Nilai Ekonomi Karbon, yang diperbarui melalui Perpres No. 110 Tahun 2025. Sistem pengukuran, pelaporan, dan verifikasi nasional perlu diperkuat agar diterima negara mitra dagang. IISIA menyebut simulasi dampak biayanya akan dibahas di artikel berikutnya."}]}, "menghindari-penolakan-material-kementerian-pupr": {"judul": "Cara Quality Control Menghindari Penolakan Material Kementerian PUPR", "tag": "Market News", "meta": "Sofia | 5 Okt 2026", "url": "https://www.smsperkasa.com/blog/menghindari-penolakan-material-kementerian-pupr", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/4a254e10b1f06660a1911ba3c813977f", "alt": "Cara Quality Control Menghindari Penolakan Material Kementerian PUPR"}, {"t": "p", "x": "Bagi para kontraktor dan Quality Control (QC) Engineer, menghindari penolakan material Kementerian PUPR adalah prioritas mutlak demi mencegah kerugian finansial dan penundaan proyek infrastruktur negara. Salah satu pemicu utama kegagalan audit lapangan adalah ketidakmampuan material dalam memenuhi batas ambang toleransi diameter besi beton yang dikirim oleh supplier. Oleh sebab itu, tim lapangan wajib menguasai cara membaca toleransi diameter besi beton SNI 2052:2017 secara presisi sebelum menerbitkan lembar penerimaan barang (Good Receipt Note)."}, {"t": "p", "x": "Untuk menghindari penolakan material Kementerian PUPR, seluruh pasokan besi beton SNI harus lolos uji verifikasi dimensi fisik berdasarkan aturan SNI 2052:2017. Batas toleransi diameter sirip (ulir) dan polos berkisar antara ±0,3 mm hingga ±0,5 mm tergantung pada ukuran nominalnya. QC wajib menggunakan jangka sorong terkalibrasi dan mengambil sampel acak dari setiap bundel besi beton untuk memastikan bahwa nilai cutting-edge dimensi aktual tidak melanggar batas toleransi legal yang ditetapkan oleh Badan Standardisasi Nasional (BSN)."}, {"t": "h2", "x": "Memahami Batas Hukum Toleransi Besi Beton SNI 2052:2017"}, {"t": "img", "foto": "/_blob/36e0a1e8fad4dbfeb533cca3370a1022", "alt": "Dokumen spesifikasi teknis besi beton SNI 2052:2017 di atas meja kerja berdampingan dengan potongan fisik besi beton polos dan besi beton ulir."}, {"t": "p", "x": "Kementerian PUPR menerapkan standar yang sangat ketat terhadap penyediaan baja tulangan beton. Setiap batang baja yang masuk ke area proyek harus merujuk pada regulasi SNI 2052:2017. Mengapa deviasi ukuran ini sangat krusial? Karena penyimpangan diameter aktual yang melampaui ambang batas legal akan menurunkan luas penampang efektif baja, sehingga mereduksi kapasitas struktur dalam menahan gaya tarik konstruksi."}, {"t": "p", "x": "Berikut adalah tabel acuan resmi untuk membaca toleransi diameter besi beton SNI 2052:2017 guna mendeteksi apakah material Anda termasuk kategori standar atau justru masuk dalam jebakan “besi banci”:"}, {"t": "table", "rows": [["Diameter Nominal (d)", "Toleransi Diameter Polos & Ulir", "Batas Maksimum Penyimpangan Nilai Aktual"], ["6 mm s.d. 10 mm", "±0,3 mm", "Maksimal penyusutan ukuran hanya 0,3 mm"], ["12 mm s.d. 16 mm", "±0,4 mm", "Maksimal penyusutan ukuran hanya 0,4 mm"], ["19 mm s.d. 28 mm", "±0,5 mm", "Maksimal penyusutan ukuran hanya 0,5 mm"], ["≥ 32 mm", "±0,6 mm", "Maksimal penyusutan ukuran hanya 0,6 mm"]]}, {"t": "p", "x": "Catatan Teknis: Untuk menjaga ketatnya kualitas besi beton ulir, tim audit PUPR tidak hanya mengukur diameter luar sirip, melainkan juga menghitung tinggi sirip dan berat per meter material sesuai dengan ketentuan lampiran teknis BSN."}, {"t": "p", "x": "Baca Juga: Apa itu Besi Beton? Mengenal Fungsi, Jenis Polos dan Ulir Standar SNI"}, {"t": "h2", "x": "Protokol Simulasi QC: Langkah Pengukuran yang Diakui Auditor Lapangan"}, {"t": "img", "foto": "/_blob/e111cf300e8e0d27df2b45482bf5bc74", "alt": "Simulasi pemeriksaan diameter inti baja tulangan sirip (ulir) menggunakan jangka sorong digital untuk verifikasi keaslian besi beton SNI untuk Menghindari Penolakan Material Kementerian PUPR"}, {"t": "p", "x": "Anda tidak bisa sekadar mengukur bagian ujung besi secara acak lalu mengeklaim material tersebut aman. Untuk memvalidasi kualitas besi beton ulir dan polos secara sah, pengawas lapangan Kementerian PUPR menggunakan prosedur pengujian sampling yang terstruktur."}, {"t": "p", "x": "Berikut adalah langkah konkrit bagi tim QC internal kontraktor untuk memverifikasi produk sebelum inspeksi resmi PUPR berlangsung:"}, {"t": "list", "items": ["Gunakan Jangka Sorong Terkalibrasi: Pastikan jangka sorong (vernier caliper) digital Anda memiliki sertifikat kalibrasi aktif dari laboratorium yang terakreditasi KAN (Komite Akreditasi Nasional). Auditor PUPR akan menolak hasil ukur jika alat perkakas Anda tidak valid.", "Metode Pengukuran Dua Titik Tegak Lurus: Saat mengukur diameter besi beton polos, ukur penampang besi pada titik yang sama dengan dua posisi jangka sorong yang saling tegak lurus (90 derajat). Cari nilai rata-ratanya.", "Pengukuran Diameter Dalam Besi Ulir: Pada baja tulangan sirip, ukurlah diameter inti (core diameter) di area luar tonjolan sirip, kemudian ukur tinggi siripnya. Pastikan hasil pengurangan diameter luar dan dalam tetap berada dalam batas toleransi ±0,4 mm hingga ±0,5 mm untuk besi ukuran medium seperti D12 atau D16.", "Verifikasi Berat per Meter: Potong sampel sepanjang 1 meter secara presisi, lalu timbang menggunakan timbangan digital. Bandingkan berat aktual tersebut dengan tabel berat resmi standar besi beton SNI. Jika berat aktual menyusut melebihi persentase toleransi berat (biasanya berkisar ±3,5% hingga ±7%), material tersebut berisiko tinggi kena segel merah oleh pengawas."]}, {"t": "p", "x": "Baca Juga: Besi Beton SNI: Memahami Kualifikasi BSN Beserta Fungsinya"}, {"t": "h2", "x": "3 Kesalahan Penyebab Penolakan Material Kementerian PUPR"}, {"t": "p", "x": "Berdasarkan evaluasi lapangan pada proyek-proyek infrastruktur skala nasional, kasus penolakan barang massal biasanya terjadi karena kecerobohan taktis berikut:"}, {"t": "list", "items": ["Menerima Besi Tanpa MTC (Mill Test Certificate): Sertifikat pabrik adalah bukti otentik legalitas heat number baja. Tanpa adanya MTC yang cocok dengan nomor ketukan fisik pada permukaan besi, auditor PUPR berhak langsung menolak material tanpa perlu mengukurnya terlebih dahulu.", "Mengabaikan Toleransi Karat Korosi: Besi yang dibiarkan menumpuk di area terbuka tanpa pelindung terpal akan mengalami degradasi permukaan. Karat berat (pitting) yang mengikis diameter nominal hingga melewati batas toleransi sirip akan langsung memicu surat perintah pembongkaran struktur baja oleh PPK proyek PUPR.", "Tergiur Penawaran Harga di Bawah Pasar: Banyak supplier nakal memanipulasi penawaran dengan menyodorkan spesifikasi “Besi Banci” berkedok toleransi longgar. Memilih distributor non-kredibel hanya demi menghemat anggaran awal akan menghancurkan reputasi perusahaan Anda saat audit forensik struktur berjalan."]}, {"t": "h2", "x": "FAQ"}, {"t": "h3", "x": "Q: Apakah besi beton yang memiliki toleransi diameter ±0,4 mm otomatis lolos audit PUPR?"}, {"t": "p", "x": "A: Tergantung ukurannya. Jika diameter nominal besi tersebut adalah 12 mm atau 16 mm, maka toleransi ±0,4 mm dinyatakan lolos standar SNI 2052:2017. Namun, jika deviasi sebesar 0,4 mm ditemukan pada besi berdiameter nominal 10 mm (yang syarat mutlaknya maksimal ±0,3 mm), maka material tersebut dipastikan tidak lolos dan akan memicu penolakan material Kementerian PUPR."}, {"t": "h3", "x": "Q: Bagaimana cara membedakan besi beton SNI asli dengan besi banci di lapangan secara cepat?"}, {"t": "p", "x": "A: Lihat penandaan timbul (marking) pada badan besi setiap jarak 1 meter. Produk asli wajib mencantumkan inisial produsen, ukuran diameter nominal, serta kelas baja (contoh: XYZ BjTS 420 untuk besi ulir grade 420). Langkah berikutnya adalah mencocokkan nomor bundel dengan dokumen Mill Test Certificate resmi bawaan distributor."}, {"t": "h2", "x": "Kesimpulan"}, {"t": "p", "x": "Menghindari penolakan material Kementerian PUPR memerlukan ketelitian tinggi dari tim Quality Control dalam mengawasi toleransi diameter besi beton agar tetap patuh pada aturan standar SNI 2052:2017. Melakukan simulasi pengukuran secara berkala dengan jangka sorong terkalibrasi serta memastikan kecocokan dokumen Mill Test Certificate (MTC) adalah langkah preventif terbaik agar struktur baja proyek Anda terbebas dari risiko pembongkaran akibat material di bawah standar."}, {"t": "p", "x": "Ingin memastikan seluruh pasokan baja tulangan di lokasi proyek Anda aman dari risiko salah spesifikasi atau kekurangan volume material? Kirimkan daftar kebutuhan proyek Anda mulai dari diameter nominal, jumlah batang atau tonase, hingga lokasi pengiriman agar tim SMS Perkasa dapat membantu memverifikasi opsi material yang paling sesuai dengan dokumen rencana Anda. Hubungi tim sales SMS Perkasa sekarang untuk berkonsultasi dan mendapatkan penawaran harga terbaru yang transparan demi kelancaran proyek Anda."}, {"t": "img", "foto": "/_blob/435a12a87c691a10000a47265778509d", "alt": "besi beton sni"}, {"t": "p", "x": "Baca Juga: Panduan Manajemen Suplai Baja Proyek Jembatan dan Jalan Layang"}]}, "perbedaan-h-beam-dan-wf": {"judul": "Jangan Salah Beli! Ini Perbedaan Mutlak Spesifikasi H Beam vs Baja WF", "tag": "Market News", "meta": "Sofia | 29 Jul 2026", "url": "https://www.smsperkasa.com/blog/perbedaan-h-beam-dan-wf", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/e59baf3f84be4e49c58d026350c8d3ea", "alt": "Jangan Salah Beli! Ini Perbedaan Mutlak Spesifikasi H Beam vs Baja WF"}, {"t": "p", "x": "Mengevaluasi perbedaan H Beam dan WF secara presisi adalah kewajiban mutlak bagi tim pengadaan material konstruksi. Kesalahan membedakan kedua baja profil ini menghasilkan kerugian ganda berupa penolakan material oleh insinyur struktur lapangan dan penundaan jadwal proyek. Secara mekanis, kedua material ini didesain dengan proporsi penampang yang sangat berbeda untuk menahan jenis gaya bangunan yang spesifik."}, {"t": "h2", "x": "Anatomi Penampang: Perbedaan H Beam dan WF Secara Visual"}, {"t": "p", "x": "Perbedaan paling absolut terletak pada rasio antara tinggi badan (web) dengan lebar sayap (flange). Besi H-Beam memiliki rasio penampang 1:1. Tinggi badan dan lebar sayap memiliki ukuran dimensi yang ekuivalen. Struktur dimensi ekuivalen ini membentuk penampang bujur sangkar solid yang menyerupai huruf H kapital."}, {"t": "p", "x": "Sebaliknya, profil baja WF didesain dengan rasio dimensi yang mendekati 2:1. Tinggi penampang web mencapai dua kali lipat lebih panjang daripada ukuran lebar sayapnya. Desain ini meregangkan profil secara vertikal membentuk huruf I kapital. Memahami perbedaan H Beam dan WF dari segi rasio ini membantu kontraktor mendistribusikan material ke titik struktur yang tepat."}, {"t": "h2", "x": "Komparasi Massa: Analisis Berat Baja WF 200 dan H-Beam 200"}, {"t": "p", "x": "Tim pengadaan sering melakukan kesalahan fatal dengan mengasumsikan kode ukuran nominal yang sama mewakili kapasitas struktural yang sama. Untuk membongkar asumsi ini, kita aplikasikan analisis pada ukuran profil 200. Perbedaan ketebalan antara kedua material ini menciptakan selisih tonase ekstrem."}, {"t": "p", "x": "Kita membedah spesifikasi ini berdasarkan data resmi dari tabel wf berstandar Badan Standardisasi Nasional (BSN) [Tautan Keluar: bsn.go.id]. Baja WF ukuran 200 memiliki nomenklatur spesifik IWF 200 x 100 x 5.5 x 8. Tinggi badan mencapai 200 mm, sedangkan lebar sayap hanya 100 mm. Berat wf 200 tercatat presisi di angka 21.3 kg/m. Satu batang standar 12 meter memiliki bobot total sekitar 256 kilogram."}, {"t": "p", "x": "Bandingkan angka tersebut dengan besi H-Beam 200. Nomenklatur resminya adalah H 200 x 200 x 8 x 12. Lebar sayap material ini mencapai 200 mm, dua kali lipat lebih lebar dari baja WF. Ketebalan badannya 8 mm dan sayapnya 12 mm. Berat aktual H-Beam 200 menembus angka 49.9 kg/m."}, {"t": "p", "x": "Detail Teknis: Berat baja wf yang hanya separuh dari bobot H-Beam membuktikan bahwa profil memanjang ini tidak memiliki luasan massa penampang yang cukup untuk berdiri sebagai kolom penyangga utama penahan gaya gravitasi."}, {"t": "p", "x": "Baca Juga: Beda Kekuatan H Beam vs WF untuk Kolom Gedung"}, {"t": "h2", "x": "Mengapa Substitusi H Beam dengan Baja Wide Flange Menjadi Bencana"}, {"t": "p", "x": "Logika pemotongan biaya departemen pengadaan sering kali membentur realitas fisika struktural di lapangan. Departemen logistik melakukan pelanggaran konstruksi berat apabila mereka mengganti spesifikasi tiang H-Beam menjadi baja wide flange hanya karena alasan harga, tanpa meminta persetujuan tertulis dari konsultan perencana."}, {"t": "p", "x": "Mode Kegagalan Kolom (Kolaps Aksial): Besi H-Beam mendistribusikan momen inersia yang kuat di kedua sumbu (Ix dan Iy) berkat rasio 1:1 dan ukuran flange yang lebar. Insinyur struktur mengandalkan profil ini secara spesifik untuk menahan beban aksial (tekan), menjadikannya material absolut untuk kolom utama penyangga gedung."}, {"t": "p", "x": "Jika kontraktor memaksa penggantian material ini, sayap pendek pada baja WF otomatis gagal memberikan stabilitas lateral yang memadai. Saat menahan beban vertikal ekstrem dari lantai atas bangunan, struktur baja WF langsung kehilangan keseimbangan dan melengkung ke arah samping pada sumbu lemahnya. Fenomena tekuk (buckling) ini memicu runtuhnya seluruh kerangka struktur bangunan tanpa memberikan peringatan mekanis sama sekali. Insinyur menetapkan baja WF secara eksklusif sebagai spesifikasi wajib untuk balok horizontal yang bertugas menahan kelendutan lantai."}, {"t": "h2", "x": "Kerangka Keputusan Pengadaan Material Baja untuk Purchasing"}, {"t": "p", "x": "Untuk menjamin kelancaran logistik, pastikan Anda mencocokkan fungsi dengan daftar kebutuhan material. Apabila material ditanam memanjang melintasi ruangan sebagai balok atap penyangga lantai, spesifikasi tersebut dipastikan merujuk pada baja WF. Jika material berdiri tegak lurus menahan lantai di atasnya, itu adalah H-Beam."}, {"t": "p", "x": "Selalu konfirmasi ulang kebutuhan tonase aktual menggunakan data dari Tabel Baja WF SNI Lengkap Dan Terbaru sebelum menerbitkan formulir pesanan. Jika tim logistik Anda ingin memperdalam identifikasi komponen material secara detail, panduan pelengkap tersedia pada artikel Perbedaan Besi WF dan H Beam | Wajib Diketahui"}]}, "konstruksi-pelat-lantai-jalan-layang": {"judul": "Percepatan Konstruksi Pelat Lantai Jalan Layang: Kombinasi Efisien Bondek Galvanis dan Wiremesh", "tag": "Market News", "meta": "Sofia | 14 Jul 2026", "url": "https://www.smsperkasa.com/blog/konstruksi-pelat-lantai-jalan-layang", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/e5907f6a2d0576cfb96384f890f9e859", "alt": "Percepatan Konstruksi Pelat Lantai Jalan Layang: Kombinasi Efisien Bondek Galvanis dan Wiremesh"}, {"t": "p", "x": "Konstruksi pelat lantai jalan layang modern menuntut efisiensi tinggi, akurasi struktur, dan manajemen waktu yang ketat untuk meminimalkan kemacetan lalu lintas di area sekitar proyek. Metode pengecoran konvensional yang mengandalkan bekisting kayu dan perancah (scaffolding) tradisional sering kali memperlambat timeline kerja akibat panjangnya waktu pemasangan dan pembongkaran. Sebagai solusinya, kombinasi antara plat decking galvanis (bondek) sebagai bekisting permanen monolit dan sistem kawat penulangan wiremesh untuk lantai jembatan terbukti mampu memangkas waktu pengerjaan struktur hingga 40% sekaligus menghemat kebutuhan volume beton cor."}, {"t": "p", "x": "Kombinasi plat decking galvanis dan wiremesh untuk lantai jembatan mempercepat konstruksi pelat lantai jalan layang dengan mengeliminasi kebutuhan perancah sementara (shoring) dan perakitan manual besi tulangan di lapangan. Bondek berfungsi ganda sebagai formwork permanen yang aman dan tulangan positif searah, sedangkan wiremesh pracetak mempercepat proses pembesian. Penerapan metode modern ini secara langsung mereduksi waste waktu (TIMWOOD) dan memangkas biaya tenaga kerja terpasang secara signifikan."}, {"t": "h2", "x": "Mengapa Metode Konvensional Menghambat Konstruksi Pelat Lantai Jalan Layang?"}, {"t": "p", "x": "Pada proyek jalan layang (flyover) atau struktur jembatan bentang panjang, setiap keterlambatan operasional akan berdampak pada pembengkakan biaya overhead kontraktor dan kerugian sosial akibat penutupan jalur transportasi. Metode konvensional memiliki beberapa kelemahan kritis:"}, {"t": "list", "items": ["Waktu Perakitan Tulangan yang Lama: Pekerja konstruksi harus merakit besi beton batangan secara manual satu per satu di atas perancah yang tinggi, meningkatkan risiko kecelakaan kerja.", "Ketergantungan pada Scaffolding: Bekisting kayu membutuhkan tiang-tiang penyangga sementara dalam jumlah masif. Hal ini menutup ruang di bawah jalan layang dan menghambat akses logistik material proyek.", "Penambahan Waste Material (TIMWOOD): Pemotongan besi beton yang tidak presisi di lapangan menghasilkan sisa potongan (scrap) dalam jumlah besar yang mempertinggi biaya produksi."]}, {"t": "h2", "x": "Keunggulan Plat Decking Galvanis Sebagai Bekisting Permanen Monolit"}, {"t": "p", "x": "Plat decking galvanis atau yang populer dengan sebutan bondek mengubah cara kontraktor membangun lantai jembatan modern. Material baja bertegangan tarik tinggi (high-tensile steel) ini berlapis seng (galvanis) untuk melindungi struktur dari korosi akibat cuaca ekstrem."}, {"t": "p", "x": "Saat pekerja memasang lembaran bondek di atas balok girder (baik beton pracetak maupun baja), lembaran tersebut langsung berfungsi sebagai platform kerja yang aman bagi para pekerja. Keunggulan utamanya terletak pada desain gelombang monolitnya yang mengunci campuran beton cor saat mengeras, sehingga bondek berperan aktif sebagai tulangan positif bagian bawah pelat lantai."}, {"t": "h3", "x": "Efisiensi Biaya dan Pengaruh Harga Bondek Cor Surabaya di Pasar B2B"}, {"t": "p", "x": "Bagi purchasing manager dan kontraktor di wilayah Jawa Timur dan Indonesia Timur, kalkulasi komponen biaya logistik sangat menentukan profitabilitas proyek. Memantau pergerakan harga bondek cor menjadi langkah strategis sebelum mengajukan penawaran tender atau membuat Purchase Order (PO)."}, {"t": "p", "x": "Namun, kontraktor tidak boleh hanya tergiur oleh harga murah tanpa memeriksa ketebalan base metal, ketebalan lapisan proteksi galvanis, serta kesesuaian spesifikasi produk dengan dokumen rancangan struktur jembatan."}, {"t": "p", "x": "Baca Juga: Panduan Manajemen Suplai Baja Proyek Jembatan dan Jalan Layang"}, {"t": "h2", "x": "Peran Sistem Kawat Penulangan Wiremesh untuk Lantai Jembatan dan Flyover"}, {"t": "p", "x": "Untuk mengimbangi kecepatan pemasangan bondek, penggunaan wiremesh untuk lantai jembatan menjadi opsi mutlak di atas area kerja pelat lantai. Wiremesh merupakan jaringan kawat baja las pracetak yang diproduksi secara otomatis di pabrik menggunakan mesin las resistensi listrik. Hal ini menjamin jarak antar-kawat (spacing) tetap konsisten dan memiliki kekuatan geser sambungan las yang tinggi sesuai standar Badan Standardisasi Nasional (BSN)."}, {"t": "p", "x": "[Tulangan Atas: Wiremesh Minimal M10 / M12 Logam SNI] ──────────────────────────────────────────────────────── [Beton Ready Mix - Mutu Tinggi (misal: K-350 / Fc 30)] ──────────────────────────────────────────────────────── [Bekisting Permanen: Plat Decking Galvanis (Bondek)] ──────────────────────────────────────────────────────── [Balok Girder Struktur Jembatan]"}, {"t": "p", "x": "Menggunakan wiremesh lembaran (sheet) berdiameter besar (biasanya M10 atau M12 untuk beban infrastruktur berat) membantu kontraktor menghemat waktu pengikatan kawat bendrat secara drastis jika dibandingkan dengan metode konvensional. Lembaran wiremesh cukup digelar di atas concrete spacer (tahu beton) yang berada di atas permukaan bondek, kemudian diikat minimal pada beberapa titik pertemuan utama. Langkah ini meminimalkan kesalahan manusia (human error) dalam penentuan jarak tulangan yang sering memicu kegagalan inspeksi tim Quality Control (QC) pemilik proyek."}, {"t": "h2", "x": "Panduan Teknis Kombinasi Bondek dan Wiremesh pada Struktur Jalan Layang"}, {"t": "p", "x": "Untuk memastikan performa struktural maksimum pada konstruksi pelat lantai jalan layang, ikuti tahapan instalasi teknis berikut yang umum diterapkan oleh para profesional di lapangan:"}, {"t": "list", "items": ["Pemasangan Lembaran Bondek: Letakkan plat decking galvanis di atas balok girder dengan arah gelombang tegak lurus terhadap arah balok pendukung. Pastikan panjang penumpuan minimal memenuhi syarat teknis spesifikasi Bina Marga (Kementerian PUPR).", "Pengencangan Pengikat (Fastening): Kunci lembaran bondek ke balok pendukung menggunakan stud welder (connector geser) atau sekrup khusus (paku tembak) untuk mencegah pergeseran saat beton cair dituang.", "Penggelaran Wiremesh: Letakkan jaringan wiremesh untuk lantai jembatan di atas dudukan beton penyangga agar posisi baja tulangan tetap berada di zona tarik atas beton setelah pengecoran. Atur overlap antarlemberan wiremesh minimal sejauh satu setengah kotak atau sesuai rekomendasi engineer proyek.", "Pembersihan Area Kerja: Bersihkan seluruh kotoran, sisa kawat, dan genangan air di atas permukaan bondek sebelum truk mixer beton memulai proses pouring."]}, {"t": "table", "rows": [["Komponen Evaluasi Lapangan", "Metode Konvensional (Kayu + Rebar)", "Metode Modern (Bondek + Wiremesh)", "Dampak Efisiensi Kontraktor"], ["Kecepatan Pasang", "10 – 14 Hari per Span", "3 – 5 Hari per Span", "Memotong durasi waktu kerja > 50%"], ["Kebutuhan Perancah", "Sangat Padat & Masif", "Sangat Minim / Tanpa Perancah", "Membuka akses lalu lintas di bawah proyek"], ["Waste Material", "Tinggi (Sisa kayu & potongan rebar)", "Sangat Rendah (Pemesanan custom panjang)", "Mereduksi biaya buang sampah & efisiensi material"], ["Ketahanan Korosi", "Tergantung selimut beton", "Ganda (Selimut beton + Lapisan Galvanis)", "Meningkatkan umur pakai infrastruktur"]]}, {"t": "h2", "x": "Kesalahan Kritis Pemasangan yang Harus Dihindari Kontraktor"}, {"t": "list", "items": ["Mengabaikan Ketebalan Toleransi Bondek: Membeli material berdasarkan harga per meter tanpa memverifikasi ketebalan aktual (real thickness) menggunakan mikrometer dapat menyebabkan tekuk (buckling) saat beban beton basah bekerja.", "Jarak Overlap Wiremesh Terlalu Pendek: Mengurangi panjang sambungan lewatan (overlap) demi menghemat material secara ilegal berisiko menurunkan kemampuan distribusi beban retak pada lantai jembatan.", "Penggunaan Shear Connector yang Kurang: Kekurangan jumlah pasak penghubung geser (shear connector) mengakibatkan pelat lantai beton tidak menyatu secara monolit dengan balok girder di bawahnya."]}, {"t": "h2", "x": "Kesimpulan & Checklist Sebelum Proses Pengecoran"}, {"t": "p", "x": "Mempercepat durasi konstruksi pelat lantai jalan layang bukan berarti mengorbankan aspek keselamatan dan kualitas jangka panjang. Integrasi antara kekuatan struktural plat decking galvanis sebagai formwork permanen dan efisiensi pemasangan wiremesh untuk lantai jembatan menghadirkan solusi konkret bagi kontraktor Indonesia untuk menuntaskan proyek secara tepat waktu, aman, dan hemat biaya operasional."}, {"t": "p", "x": "Sebelum memberikan instruksi pengecoran (casting order) kepada penyedia beton ready-mix, pastikan tim logistik dan pengawas lapangan Anda telah melakukan verifikasi akhir terhadap seluruh aspek teknis dan komersial material baja konstruksi yang digunakan di proyek."}, {"t": "p", "x": "Untuk mendukung kelancaran rantai pasok proyek infrastruktur Anda, pastikan Anda bermitra dengan distributor baja terpercaya yang mampu menjamin validitas spesifikasi produk."}, {"t": "p", "x": "Sebelum menerbitkan Purchase Order (PO), silakan kirimkan daftar kebutuhan material atau dokumen BOQ Anda yang mencakup spesifikasi plat decking galvanis, diameter wiremesh untuk lantai jembatan, volume, serta lokasi detail proyek. Tim kami akan segera mengecek ketersediaan stok terupdate dan memberikan penawaran harga terbaik."}, {"t": "img", "foto": "/_blob/f1584ce86ac633e91f0b86f0e2d711b5", "alt": "besi wiremesh"}, {"t": "p", "x": "Baca Juga: Underpass vs Flyover: Perbandingan Kebutuhan Baja Struktural Jembatan"}]}, "memahami-pergerakan-harga-besi-baja": {"judul": "Harga Besi Baja: Tren dan Cara Menyiasati Proyek", "tag": "Market News", "meta": "Sofia | 11 Jul 2026", "url": "https://www.smsperkasa.com/blog/memahami-pergerakan-harga-besi-baja", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/a99bab86ecca79d21fcfe2eedcfe9f9d", "alt": "Harga Besi Baja: Tren dan Cara Menyiasati Proyek"}, {"t": "p", "x": "Memenangkan tender proyek pemerintah adalah target utama kontraktor. Namun, pergerakan harga besi baja nasional kerap mengancam margin keuntungan. Proyek jangka panjang sangat rentan terhadap perubahan harga material dasar. Hal ini dapat mengacaukan Rencana Anggaran Biaya (RAB) yang sudah tim Anda setujui."}, {"t": "p", "x": "Tim purchasing wajib memahami cara mengantisipasi lonjakan harga material di pasar. Tujuannya agar proyek tetap berjalan lancar tanpa mengorbankan kualitas material dan konstruksi. Artikel ini membahas faktor makro yang memengaruhi pasar, cara membaca tren, serta langkah praktis untuk mengamankan anggaran material Anda."}, {"t": "h2", "x": "Faktor Pemicu Fluktuasi harga besi baja Nasional"}, {"t": "p", "x": "Kontraktor sering kali terkejut ketika harga material tiba-tiba naik sesaat sebelum proses Purchase Order (PO) turun. Padahal, fluktuasi harga besi baja terjadi akibat beberapa faktor makro berikut:"}, {"t": "list", "items": ["Harga Bahan Baku Global: Produsen sangat bergantung pada harga bijih besi dan batu bara internasional. Lonjakan harga bahan baku ini otomatis menaikkan biaya produksi pabrik, dinamika yang dipantau oleh Kementerian Perindustrian.", "Nilai Tukar Rupiah (Kurs): Industri baja Indonesia masih menggunakan banyak komponen impor. Akibatnya, pelemahan Rupiah terhadap Dolar AS langsung memicu kenaikan harga baja lokal.", "Kebijakan Pemerintah: Penerapan tarif impor, kuota, atau aturan wajib SNI sangat memengaruhi suplai domestik dan pergerakan harga di tingkat distributor."]}, {"t": "h2", "x": "Membaca Tren harga besi baja Struktural"}, {"t": "p", "x": "Besi beton, WF, dan H Beam merupakan komponen penyerap anggaran terbesar dalam proyek. Memantau tren harga besi baja struktural sangat penting untuk menentukan momentum pembelian yang tepat."}, {"t": "p", "x": "Biasanya, harga cenderung naik pada awal tahun. Hal ini terjadi karena banyak proyek infrastruktur baru mulai berjalan sehingga permintaan melonjak. Gangguan rantai pasok global juga sering memicu fluktuasi mendadak. Tim purchasing yang cermat akan rutin meminta pembaruan harga dari supplier sebelum membuat keputusan final."}, {"t": "h2", "x": "Tips Purchasing Proyek: Cara Mengamankan Anggaran"}, {"t": "p", "x": "Risiko kenaikan material harus segera Anda mitigasi setelah menang tender. Berikut adalah beberapa tips purchasing B2B yang sangat efektif:"}, {"t": "h3", "x": "1. Terapkan Sistem Lock Price"}, {"t": "p", "x": "Jangan biarkan fluktuasi merusak anggaran Anda. Bicarakan skema penguncian harga dengan distributor resmi. Berikan Bill of Quantities (BOQ) yang spesifik kepada distributor. Beberapa rekanan bersedia mengunci harga untuk periode tertentu dengan syarat komitmen volume pembelian."}, {"t": "h3", "x": "2. Atur Jadwal Pengiriman Bertahap"}, {"t": "p", "x": "Membeli semua material di awal memang aman dari kenaikan harga. Namun, cara ini memunculkan masalah ruang penyimpanan gudang proyek. Solusinya, gunakan sistem kontrak payung. Lalu, mintalah jadwal pengiriman secara bertahap sesuai progres lapangan."}, {"t": "h3", "x": "3. Validasi Ulang Spesifikasi Sebelum Pesan"}, {"t": "p", "x": "Kesalahan spesifikasi mengharuskan Anda membeli ulang material dengan harga baru yang mungkin sudah naik. Pastikan ukuran, berat, dan toleransi SNI sudah tepat. Minta persetujuan final dari engineer proyek sebelum Anda merilis dokumen PO."}, {"t": "h2", "x": "Kesimpulan: Amankan Margin Proyek Sejak Awal"}, {"t": "p", "x": "Menghadapi pasar baja yang dinamis membutuhkan perencanaan sangat matang. Pastikan Anda selalu bermitra dengan distributor tepercaya yang transparan mengenai perubahan pasar."}, {"t": "p", "x": "Butuh suplai baja untuk proyek? Kirimkan spesifikasi material, jumlah, lokasi proyek, dan target pengiriman agar tim kami dapat mengecek ketersediaan serta penawaran terbaru. Segera telusuri katalog produk baja atau hubungi tim sales kami hari ini."}, {"t": "img", "foto": "/_blob/54db562155c9cb2a9b83fba39295ffa5", "alt": "harga-besi"}, {"t": "p", "x": "Baca Juga: Kebutuhan Besi Baja untuk Membangun Konstruksi Cold Storage Skala Industri"}]}, "prediksi-harga-besi-2024-industri-konstruksi-dan-investasi-wajib-tau": {"judul": "Prediksi Harga Besi 2024: Industri Konstruksi Wajib Tau!", "tag": "Market News", "meta": "Sofia | 2 Jul 2026", "url": "https://www.smsperkasa.com/blog/prediksi-harga-besi-2024-industri-konstruksi-dan-investasi-wajib-tau", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/cc872e39be6f6e13f79dc4c7b6618ee8", "alt": "Prediksi Harga Besi 2024: Industri Konstruksi Wajib Tau!"}, {"t": "p", "x": "Besi merupakan salah satu komoditas terpenting di dunia, terutama dalam industri konstruksi. Kestabilan dan perkembangan sektor ini sangat bergantung pada harga besi, yang dipengaruhi oleh berbagai faktor global. Dalam artikel ini, kita akan menggali lebih dalam tentang bagaimana faktor-faktor ini membentuk harga besi, dengan fokus khusus pada prediksi untuk tahun 2024. Artikel ini bertujuan memberikan wawasan mendalam untuk kontraktor, investor, dan pemangku kepentingan lainnya di industri ini, membantu mereka membuat keputusan yang lebih informasi dan strategis."}, {"t": "h2", "x": "Kondisi Pasar Besi Saat Ini"}, {"t": "p", "x": "Sektor besi telah mengalami fluktuasi yang signifikan dalam beberapa tahun terakhir. Dengan perubahan iklim global dan pandemi COVID-19, sektor ini menghadapi tantangan yang belum pernah terjadi sebelumnya. Tahun 2023 melihat kenaikan harga besi yang signifikan, yang diakibatkan oleh berbagai faktor, termasuk peningkatan permintaan global dan pembatasan ekspor dari negara-negara penghasil besi utama. Kondisi ini menimbulkan pertanyaan penting: apakah tren ini akan terus berlanjut ke tahun 2024?"}, {"t": "h2", "x": "Faktor-Faktor yang Mempengaruhi Harga Besi"}, {"t": "p", "x": "Harga besi dipengaruhi oleh berbagai faktor. Secara global, kondisi ekonomi seperti pertumbuhan GDP, konflik geopolitik, dan kebijakan perdagangan berperan penting dalam menentukan harga. Misalnya, sanksi perdagangan atau perubahan kebijakan impor oleh negara besar seperti Amerika Serikat atau China dapat menyebabkan perubahan harga secara drastis. Di tingkat mikro, faktor seperti biaya produksi, ketersediaan bahan baku, dan perkembangan teknologi juga mempengaruhi harga besi."}, {"t": "h2", "x": "Prediksi Harga Besi untuk 2024"}, {"t": "p", "x": "Melihat ke tahun 2024, ada beberapa faktor yang dapat mempengaruhi harga besi. Peningkatan permintaan dari negara berkembang, terutama di Asia dan Afrika, diharapkan akan mendorong harga. Di sisi lain, peningkatan produksi besi dari negara-negara baru seperti India dan Brazil dapat menyebabkan penurunan harga. Selain itu, faktor lingkungan dan tekanan untuk produksi yang lebih berkelanjutan juga dapat mempengaruhi harga besi, baik melalui biaya produksi yang lebih tinggi maupun melalui permintaan untuk alternatif yang lebih ramah lingkungan."}, {"t": "p", "x": "Baca Juga: Analisis Pasar: Harga besi melemah pertengahan Oktober"}, {"t": "h2", "x": "Strategi untuk Kontraktor dan Investor"}, {"t": "p", "x": "Dalam menghadapi fluktuasi harga besi, kontraktor dan investor perlu strategi yang fleksibel. Kontraktor dapat mengurangi risiko dengan cara memasukkan klausul penyesuaian harga dalam kontrak mereka. Ini memungkinkan penyesuaian harga berdasarkan fluktuasi pasar, mengurangi risiko keuangan. Bagi investor, penting untuk memantau tren pasar dan menganalisis faktor-faktor yang mempengaruhi harga besi. Investasi diversifikasi, tidak hanya di besi tetapi juga di logam lain atau bahkan di perusahaan teknologi yang menyediakan solusi inovatif untuk industri, bisa menjadi pendekatan yang bijak."}, {"t": "h2", "x": "Peluang dan Risiko"}, {"t": "p", "x": "Peluang di pasar besi muncul bagi mereka yang dapat menavigasi volatilitas dengan bijak. Kontraktor yang dapat menyesuaikan dengan cepat terhadap perubahan harga dan menemukan cara untuk mengurangi biaya produksi dapat memanfaatkan kondisi pasar. Risiko utama adalah volatilitas harga itu sendiri, yang dapat mengganggu perencanaan dan eksekusi proyek. Oleh karena itu, penting bagi kontraktor dan investor untuk memiliki strategi manajemen risiko yang efektif."}, {"t": "h2", "x": "Pentingnya Inovasi dan Teknologi"}, {"t": "p", "x": "Teknologi canggih dan inovasi dapat membantu mengurangi biaya produksi dan meningkatkan efisiensi. Misalnya, penggunaan teknologi hijau dalam ekstraksi dan pemrosesan besi tidak hanya mengurangi dampak lingkungan, tetapi juga dapat mengurangi biaya jangka panjang. Selain itu, pengadopsian teknologi digital dalam rantai pasokan, seperti penggunaan Internet of Things (IoT) dan kecerdasan buatan (AI), dapat meningkatkan efisiensi dan transparansi."}, {"t": "p", "x": "Baca Juga: Harga Flat Product Masih Terus Bergerak Naik"}, {"t": "h2", "x": "Kesimpulan"}, {"t": "p", "x": "Menghadapi tahun 2024, industri besi menghadapi banyak tantangan namun juga peluang. Salah satu aspek kunci adalah memahami dinamika harga spesifik produk seperti CNP 150 dan harga besi beton per kg, yang merupakan indikator penting dalam pasar. Dengan memahami faktor-faktor yang mempengaruhi harga besi dan mengadopsi strategi yang fleksibel dan proaktif, kontraktor dan investor dapat menavigasi pasar ini dengan sukses. Inovasi dan teknologi akan menjadi kunci untuk bertahan dan berkembang di pasar yang kompetitif ini. Oleh karena itu, sangat penting bagi semua pemangku kepentingan untuk terus mengikuti perkembangan terkini dan adaptif terhadap perubahan kondisi pasar. Ayo beli besi Anda sekarang sebelum harga semakin naik dan untuk informasi lebih lanjut mengenai harga besi pastikan untuk mengikuti update terbaru dari SMS Perkasa sebagai distributor besi terpercaya."}, {"t": "img", "foto": "/_blob/aaaeb6d9f1e637d96d1ae53bb3f2bd98", "alt": ""}, {"t": "p", "x": "Baca Juga: Prediksi Harga Besi di Tahun 2023"}]}, "tantangan-dan-peluang-penggunaan-artificial-intelligence-ai-dalam-fabrikasi-baja": {"judul": "Penggunaan Artificial Intelligence (AI) dalam Fabrikasi Baja", "tag": "Market News", "meta": "Sofia | 9 Okt 2026", "url": "https://www.smsperkasa.com/blog/tantangan-dan-peluang-penggunaan-artificial-intelligence-ai-dalam-fabrikasi-baja", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/ebacf14138b3291bfebf9cf6bd58abe7", "alt": "Penggunaan Artificial Intelligence (AI) dalam Fabrikasi Baja"}, {"t": "p", "x": "Penggunaan Artificial Intelligence (AI) dalam fabrikasi baja berfokus pada pemanfaatan machine learning dan analisis prediktif untuk memodernisasi seluruh rantai produksi mulai dari prediksi sifat mekanis baja berbasis komposisi kimia, efisiensi jadwal operasional, hingga presisi estimasi berat material. Meski integrasi teknologi ini menawarkan akurasi quality control dan ketepatan proyeksi harga per kg, industri masih dihadapkan pada hambatan krusial seperti kelangkaan data berkualitas, kompleksitas integrasi sistem, dan keamanan privasi data. Artikel ini membedah secara rinci bentuk penerapannya di lapangan, analisis tantangan teknis, serta peluang strategis AI dalam mentransformasi efisiensi fabrikasi baja."}, {"t": "h2", "x": "Penerapan Artificial Intelligence dalam Fabrikasi Baja"}, {"t": "p", "x": "AI telah diterapkan dalam berbagai aspek fabrikasi baja, mulai dari proses produksi hingga perencanaan dan manajemen rantai pasokan. Misalnya, AI dapat digunakan untuk memprediksi sifat mekanis baja berdasarkan komposisi kimianya, atau untuk mengoptimalkan jadwal produksi berdasarkan permintaan dan ketersediaan sumber daya."}, {"t": "p", "x": "Artificial intelligence juga berperan dalam memprediksi berat besi 13 ulir pada proses fabrikasi baja, dengan analisis prediktif, AI dapat memastikan akurasi dalam estimasi berat, meningkatkan efisiensi dan mengurangi pemborosan material."}, {"t": "h2", "x": "Tantangan dalam Penggunaan Artificial Intelligence dalam Fabrikasi Baja"}, {"t": "p", "x": "Meski ada banyak peluang, penerapan AI dalam fabrikasi baja juga memunculkan beberapa tantangan:"}, {"t": "h3", "x": "Kurangnya Data yang Tepat"}, {"t": "p", "x": "AI membutuhkan data dalam jumlah besar untuk belajar dan membuat prediksi yang akurat. Namun, mengumpulkan dan mengelola data dalam jumlah besar bisa menjadi tantangan."}, {"t": "h3", "x": "Kesulitan dalam Integrasi"}, {"t": "p", "x": "Mengintegrasikan artificial intelligence ke dalam sistem fabrikasi baja yang ada bisa menjadi tantangan, membutuhkan perubahan infrastruktur dan pelatihan karyawan."}, {"t": "h3", "x": "Isu Keamanan dan Privasi"}, {"t": "p", "x": "Dengan peningkatan penggunaan artificial intelligence dan data, isu keamanan dan privasi juga menjadi perhatian. Perusahaan perlu memastikan bahwa data mereka aman dan digunakan secara etis."}, {"t": "h2", "x": "Peluang dalam Penggunaan Artificial Intelligence dalam Fabrikasi Baja"}, {"t": "p", "x": "Meskipun tantangan tersebut ada, peluang yang ditawarkan oleh artificial intelligence (AI) dalam fabrikasi baja sangat menjanjikan:"}, {"t": "h3", "x": "Efisiensi dan Produktivitas"}, {"t": "p", "x": "Dengan kemampuan untuk membuat keputusan yang cerdas dan belajar dari data, AI dapat membantu meningkatkan efisiensi dan produktivitas dalam fabrikasi baja."}, {"t": "h3", "x": "Peningkatan Kualitas Produk"}, {"t": "p", "x": "AI dapat digunakan untuk memantau proses produksi dan mendeteksi cacat produk, memungkinkan perbaikan segera dan peningkatan kualitas produk secara keseluruhan."}, {"t": "h3", "x": "Pengambilan Keputusan yang Lebih Baik"}, {"t": "p", "x": "Dengan analisis prediktif, AI dapat membantu dalam pengambilan keputusan bisnis, seperti perencanaan produksi dan manajemen rantai pasokan. Contoh yang bagus adalah bagaimana AI dapat membantu memperkirakan harga besi per kg, membantu perusahaan dalam menetapkan harga yang kompetitif dan menguntungkan."}, {"t": "p", "x": "Kecerdasan buatan memiliki potensi untuk mengubah industri fabrikasi baja, membawa sejumlah peluang besar seperti peningkatan efisiensi dan kualitas. Namun, ada juga tantangan yang harus diatasi, termasuk isu-isu seputar data dan integrasi. Dengan pendekatan yang tepat, AI bisa menjadi bagian penting dari masa depan fabrikasi baja."}, {"t": "img", "foto": "/_blob/342287a488d0f1a2e98fe1aca3650404", "alt": ""}]}, "pondasi-cakar-ayam-solusi-stabilitas-konstruksi-bangunan": {"judul": "Pondasi Cakar Ayam | Solusi Stabilitas Konstruksi Bangunan", "tag": "Market News", "meta": "Sofia | 7 Okt 2026", "url": "https://www.smsperkasa.com/blog/pondasi-cakar-ayam-solusi-stabilitas-konstruksi-bangunan", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/ad7dc9b9d4424d5a5bd2a607d35bc176", "alt": "Pondasi Cakar Ayam | Solusi Stabilitas Konstruksi Bangunan"}, {"t": "p", "x": "Pondasi cakar ayam merupakan salah satu jenis pondasi yang inovatif dan sangat efektif digunakan pada berbagai jenis bangunan. Diciptakan oleh Prof. Dr. Ir. Sedijatmo pada tahun 1961, pondasi ini dirancang untuk memberikan stabilitas yang luar biasa pada bangunan, terutama di tanah yang lunak atau berair. Dalam artikel ini, kita akan membahas secara mendalam tentang pondasi cakar ayam, termasuk pengertiannya, cara kerjanya, serta kelebihan yang ditawarkannya dalam konstruksi bangunan."}, {"t": "h2", "x": "Sejarah"}, {"t": "p", "x": "Pondasi cakar ayam pertama kali ditemukan oleh Prof. Dr. Ir. Sedijatmo, seorang insinyur Indonesia yang bekerja untuk Perusahaan Listrik Negara (PLN) pada tahun 1961. Ide awal muncul ketika Sedijatmo menghadapi masalah konstruksi di daerah berawa-rawa di Pantai Utara Jawa, di mana pondasi konvensional tidak dapat memberikan stabilitas yang cukup. Untuk mengatasi masalah ini, Sedijatmo mengembangkan sistem pondasi yang terdiri dari pelat beton yang didukung oleh pipa-pipa beton yang tertanam dalam tanah, mirip dengan cakar ayam yang mencengkeram tanah. Inovasi ini terbukti sangat efektif dan segera diadopsi secara luas dalam berbagai proyek konstruksi di Indonesia dan dunia. Keberhasilan pondasi cakar ayam dalam menangani permasalahan tanah lunak menjadikannya solusi yang dicari untuk proyek-proyek di berbagai wilayah dengan kondisi tanah yang serupa."}, {"t": "h2", "x": "Apa Itu Pondasi Cakar Ayam?"}, {"t": "img", "foto": "/_blob/8f4c46ee53e5d4ffb380464fa4082850", "alt": "Pondasi cakar ayam"}, {"t": "p", "x": "Pondasi cakar ayam adalah sistem pondasi yang terdiri dari pelat beton yang dipasang di atas permukaan tanah dan dihubungkan dengan besi beton yang tertanam dalam tanah. Nama “cakar ayam” diambil dari bentuk pipa-pipa beton tersebut yang menyerupai cakar ayam yang mencengkeram tanah. Sistem ini dirancang untuk menyebarkan beban bangunan secara merata ke seluruh permukaan tanah, sehingga memberikan stabilitas yang lebih baik dibandingkan dengan jenis pondasi lainnya. Pondasi ini bekerja dengan prinsip memperluas area penopang beban, sehingga tekanan pada setiap titik tanah berkurang dan distribusi beban menjadi lebih merata."}, {"t": "p", "x": "Baca Juga: Bekisting: Jenis, Fungsi, dan Pentingnya dalam Konstruksi"}, {"t": "h2", "x": "Fungsi Pondasi"}, {"t": "img", "foto": "/_blob/01d0f8b3ce7f293440d7a48d0a5fabdb", "alt": "Tulangan pada Pondasi Cakar Ayam"}, {"t": "p", "x": "Fungsi utama pondasi cakar ayam adalah untuk memberikan dukungan dan stabilitas pada bangunan. Fungsi ini mencakup:"}, {"t": "list", "items": ["Distribusi Beban: Menyebarkan beban bangunan secara merata ke seluruh permukaan tanah melalui pelat beton dan pipa-pipa beton. Hal ini sangat penting untuk mencegah penurunan tanah yang tidak merata yang bisa mengakibatkan keretakan atau kerusakan struktur bangunan.", "Mengurangi Penurunan Tanah: Mencegah penurunan tanah yang tidak merata dengan mencengkeram tanah secara kuat. Pondasi ini memberikan cengkeraman yang kuat pada tanah sehingga mengurangi risiko penurunan yang bisa mengakibatkan ketidakstabilan struktur.", "Stabilitas Struktur: Memberikan stabilitas tambahan pada bangunan yang dibangun di atas tanah lunak atau berair. Dengan pondasi yang kuat, bangunan akan lebih tahan terhadap gempa dan getaran, serta perubahan kondisi tanah."]}, {"t": "h2", "x": "Keunggulan Pondasi Cakar Ayam"}, {"t": "img", "foto": "/_blob/d1d4b2360a30f66f3757fe02cb33670b", "alt": "Bentuk pondasi"}, {"t": "p", "x": "Membangun di tanah rawa menuntut ritme kerja yang ketat karena risiko galian yang mudah longsor atau tergenang air. Oleh karena itu, ketepatan waktu suplai material menjadi harga mati. Pastikan besi tulangan dikirim secara bertahap sesuai progres harian di lapangan, sehingga jadwal pengecoran tidak tertunda oleh keterlambatan logistik."}, {"t": "list", "items": ["Stabilitas yang Tinggi: Pondasi cakar ayam memberikan stabilitas yang luar biasa pada bangunan. Sistem ini mampu menahan beban vertikal dan horizontal, serta mengurangi risiko penurunan tanah yang tidak merata. Pondasi ini sangat efektif untuk bangunan tinggi yang membutuhkan fondasi yang kokoh dan stabil.", "Efektif pada Tanah Lunak: Pondasi ini sangat efektif digunakan pada tanah yang lunak atau berair. Dengan cengkeraman yang kuat, pondasi ini mampu menahan bangunan agar tetap kokoh dan tidak mudah bergeser. Sistem ini ideal untuk bangunan yang berada di wilayah dekat sungai, danau, atau kawasan dengan kondisi tanah yang kurang stabil.", "Mengurangi Biaya Perawatan: Karena stabilitasnya yang tinggi, pondasi ini dapat mengurangi biaya perawatan bangunan dalam jangka panjang. Bangunan dengan pondasi ini lebih tahan terhadap kerusakan akibat pergeseran tanah. Stabilitas yang baik juga berarti bahwa bangunan tidak memerlukan perbaikan yang sering, menghemat biaya pemeliharaan.", "Cepat dalam Proses Pemasangan: Proses pemasangan pondasi ini relatif cepat dibandingkan dengan pondasi konvensional lainnya. Hal ini dapat menghemat waktu dan biaya konstruksi. Dengan waktu pemasangan yang lebih singkat, proyek konstruksi dapat diselesaikan lebih cepat, mengurangi waktu penyelesaian dan biaya tenaga kerja."]}, {"t": "p", "x": "Baca Juga: Penerapan Besi Beton dalam Konstruksi Gedung Tinggi"}, {"t": "h2", "x": "Kekurangan Pondasi Cakar Ayam"}, {"t": "list", "items": ["Biaya Awal yang Tinggi: Meskipun biaya perawatan jangka panjang lebih rendah, biaya awal untuk pemasangan pondasi cakar ayam bisa lebih tinggi dibandingkan dengan pondasi konvensional. Hal ini terutama disebabkan oleh material dan teknik khusus yang digunakan. Investasi awal yang tinggi sering kali menjadi pertimbangan bagi para pengembang.", "Keterbatasan Aplikasi: Pondasi ini mungkin tidak selalu cocok untuk semua jenis tanah atau proyek. Analisis geoteknik yang mendalam diperlukan untuk memastikan bahwa sistem ini sesuai untuk kondisi tanah di lokasi proyek. Tanah dengan kandungan batuan yang tinggi atau sangat keras mungkin tidak cocok untuk pondasi ini.", "Kompleksitas Desain dan Pemasangan: Desain dan pemasangan pondasi ini memerlukan keahlian khusus dan perencanaan yang cermat. Kesalahan dalam desain atau pemasangan dapat mengurangi efektivitas sistem ini. Memerlukan tenaga ahli yang terlatih untuk memastikan pemasangan yang tepat dan efektif."]}, {"t": "h2", "x": "Cara Kerja Pondasi Cakar Ayam"}, {"t": "img", "foto": "/_blob/f0ce753b274441a05af19ec915b78ad3", "alt": "Cara kerja pondasi cakar ayam"}, {"t": "p", "x": "Pondasi cakar ayam bekerja dengan cara menyebarkan beban bangunan ke seluruh permukaan t
