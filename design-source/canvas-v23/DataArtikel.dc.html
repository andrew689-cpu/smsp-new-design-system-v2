wab sosial terhadap karyawan dan komunitas, serta realitas ekonomi, merupakan inti dari tantangan etika lingkungan di sektor ini."}, {"t": "h3", "x": "Prioritas Utama: Keselamatan dan Kesehatan Kerja (K3) di Lingkungan Berisiko Tinggi"}, {"t": "p", "x": "Lingkungan kerja di pabrik besi dan baja secara inheren penuh dengan risiko. Pekerja berhadapan langsung dengan suhu ekstrem dari logam cair, mesin-mesin berat dan besar, material berbahaya, tingkat kebisingan tinggi, serta paparan debu dan asap. Risiko kecelakaan kerja mulai dari luka bakar, patah tulang, terjepit, tertimpa benda berat, hingga fatalitas sangatlah nyata. Selain itu, terdapat pula risiko penyakit akibat kerja jangka panjang seperti Infeksi Saluran Pernapasan Akut (ISPA), dehidrasi akibat panas, gangguan muskuloskeletal (MSDs) akibat posisi kerja tidak ergonomis atau paparan debu gerinda, gangguan penglihatan akibat cahaya las, hingga sakit punggung bawah (low back pain). Risiko ini dapat muncul di berbagai tahapan proses, mulai dari pencetakan cetakan, peleburan, pencetakan logam, pembersihan hasil cetak, penggerindaan, hingga pengelasan."}, {"t": "p", "x": "Oleh karena itu, memastikan Keselamatan dan Kesehatan Kerja (K3) bukan hanya kewajiban hukum, tetapi merupakan tanggung jawab etis fundamental perusahaan terhadap karyawannya. Ini menuntut implementasi Sistem Manajemen K3 (SMK3) yang komprehensif , penyediaan Alat Pelindung Diri (APD) yang sesuai standar dan memastikan penggunaannya , pelaksanaan pelatihan K3 secara berkala, identifikasi bahaya dan penilaian risiko (seperti metode HIRADC – Hazard Identification Risk Assessment and Determining Control), serta penanaman budaya yang mengutamakan keselamatan (safety-first culture) di seluruh lini organisasi. Investasi dan komitmen nyata terhadap K3 merupakan cerminan langsung dari nilai etis yang dianut perusahaan terkait penghargaan terhadap kehidupan dan kesejahteraan manusia."}, {"t": "h3", "x": "Integritas Rantai Pasok: Dari Bahan Baku Hingga Produk Jadi"}, {"t": "p", "x": "Industri baja Indonesia, dalam beberapa kasus, masih bergantung pada impor bahan baku seperti bijih besi, scrap, atau pellet. Ketergantungan ini memunculkan pertanyaan etis terkait praktik penambangan atau pengumpulan bahan baku di negara asal. Perusahaan memiliki tanggung jawab etis untuk melakukan uji tuntas (due diligence) guna memastikan bahwa pemasok mereka juga menerapkan standar etika yang dapat diterima, termasuk dalam hal praktik ketenagakerjaan, pengelolaan lingkungan, dan penghormatan hak asasi manusia. Selain itu, hubungan dengan pemasok itu sendiri harus didasarkan pada prinsip keadilan dan kejujuran, seperti pembayaran tepat waktu dan transparansi dalam kontrak, sebagaimana diatur dalam pedoman etika perusahaan."}, {"t": "h3", "x": "Dampak Komunitas: Peran Industri dalam Pembangunan Lokal"}, {"t": "p", "x": "Keberadaan pabrik baja membawa dampak signifikan bagi komunitas lokal. Di satu sisi, ia menciptakan lapangan kerja dan mendorong aktivitas ekonomi. Namun, di sisi lain, operasinya dapat menimbulkan dampak negatif seperti polusi udara dan air, kebisingan, peningkatan lalu lintas alat berat, serta potensi risiko kesehatan bagi masyarakat sekitar. Tanggung jawab etis perusahaan adalah bertindak sebagai “warga korporat yang baik” (good corporate citizen). Ini melibatkan dialog terbuka dengan komunitas, upaya serius untuk meminimalkan dampak negatif operasional, berkontribusi pada pembangunan sosial dan ekonomi lokal (misalnya melalui program CSR), serta beroperasi secara transparan."}, {"t": "h3", "x": "Menavigasi Persaingan Pasar yang Ketat Secara Etis"}, {"t": "p", "x": "Industri baja nasional menghadapi persaingan yang sangat ketat, terutama akibat kelebihan kapasitas global dan serbuan produk impor, khususnya dari China, yang terkadang ditawarkan dengan harga sangat rendah (potensi predatory pricing). Tekanan ekonomi yang hebat ini dapat menggoda perusahaan untuk mengambil jalan pintas atau melakukan praktik persaingan yang tidak sehat. Namun, etika bisnis menuntut perusahaan untuk tetap bersaing secara sehat dan adil, mengandalkan keunggulan produk dan layanan, serta menghindari tindakan yang mendiskreditkan atau merugikan pesaing secara tidak etis. Terdapat pula dimensi etis yang lebih luas terkait kebijakan perdagangan nasional apakah diperlukan langkah proteksi untuk melindungi industri domestik dari persaingan yang dianggap tidak adil, dan bagaimana menyeimbangkannya dengan prinsip perdagangan bebas dan hubungan internasional."}, {"t": "h3", "x": "Mewujudkan Praktik Etika Unggul di Industri Besi Baja"}, {"t": "p", "x": "Menghadapi berbagai tantangan tersebut, perusahaan di industri besi dan baja perlu secara proaktif menerapkan strategi untuk mewujudkan praktik etika yang unggul. Ini bukan hanya tentang meminimalkan risiko, tetapi juga tentang membangun keunggulan kompetitif jangka panjang."}, {"t": "p", "x": "Langkah fundamental adalah mengembangkan, mengimplementasikan, dan menegakkan Kode Etik (Code of Conduct) yang jelas dan komprehensif, yang mencakup semua aspek hubungan dengan stakeholder. Transparansi menjadi kunci; perusahaan perlu secara terbuka melaporkan kinerjanya, terutama terkait isu-isu krusial seperti dampak lingkungan (misalnya melalui sistem pemantauan emisi berkelanjutan seperti CEMS) dan K3."}, {"t": "p", "x": "Investasi berkelanjutan pada teknologi yang lebih bersih dan efisien serta program K3 yang solid adalah manifestasi nyata dari komitmen etis. Lebih dari itu, perhatian terhadap kesejahteraan karyawan harus melampaui standar keselamatan minimum, mencakup upah yang adil, kesempatan pengembangan, dan lingkungan kerja yang saling menghargai."}, {"t": "p", "x": "Komitmen etis juga tercermin dalam kualitas produk yang dihasilkan. Memastikan produk memenuhi standar keamanan dan keandalan yang ditetapkan merupakan tanggung jawab etis terhadap pelanggan dan pengguna akhir. Sebagai contoh, penggunaan besi beton sni dalam konstruksi menunjukkan komitmen perusahaan terhadap standar keselamatan bangunan yang diakui secara nasional, melindungi nyawa dan properti pengguna akhir yang merupakan stakeholder hilir."}, {"t": "img", "foto": "/_blob/947fded0caf8f908f39e7a4e481701e0", "alt": "besi beton sni"}, {"t": "p", "x": "Selain itu, membangun kemitraan yang etis dengan pemasok, berdasarkan prinsip keadilan, transparansi, dan nilai-nilai bersama, sangatlah penting. Memastikan bahwa material penting untuk proyek infrastruktur, seperti pipa galvanis berkualitas, tidak hanya memenuhi spesifikasi teknis tetapi juga berasal dari rantai pasok yang bertanggung jawab, menunjukkan integritas perusahaan di seluruh mata rantai nilainya."}, {"t": "h2", "x": "Jadi Bagaimana Membangun Masa Depan Industri Besi Baja yang Etis dan Berkelanjutan?"}, {"t": "p", "x": "Etika bisnis dan hubungan stakeholder yang kuat bukanlah sekadar pelengkap, melainkan elemen esensial yang menentukan keberhasilan jangka panjang, ketahanan (resilience), dan penerimaan sosial (social license to operate) bagi industri besi dan baja Indonesia. Di tengah kompleksitas tantangan operasional dan tekanan pasar, komitmen terhadap prinsip-prinsip etika menjadi semakin vital."}, {"t": "p", "x": "Tantangan etika spesifik yang dihadapi sektor ini mulai dari dampak lingkungan yang signifikan, risiko K3 yang tinggi, integritas rantai pasok, dinamika persaingan pasar , hingga hubungan dengan komunitas menuntut perhatian serius dan manajemen yang proaktif. Mengatasi tantangan ini melalui kerangka kerja etis yang kuat, investasi pada teknologi dan praktik yang bertanggung jawab, serta keterlibatan aktif dengan seluruh stakeholder adalah kunci untuk menavigasi masa depan industri ini."}, {"t": "p", "x": "Dengan menanamkan pertimbangan etis ke dalam inti strategi bisnis, perusahaan-perusahaan di sektor besi dan baja tidak hanya dapat memitigasi risiko dan membangun reputasi yang kokoh, tetapi juga berkontribusi pada terciptanya industri yang lebih kuat, lebih bertanggung jawab, dan berkelanjutan bagi kemajuan bangsa dan kesejahteraan seluruh pemangku kepentingannya."}, {"t": "img", "foto": "/_blob/a9cc646ed658e7d94e17ae87467aecd1", "alt": "besi"}, {"t": "p", "x": "Baca Juga: 7 Inspirasi Desain Coffee Shop Industrial"}]}, "inspirasi-dari-buku-the-magic-of-thinking-big-david-j-schwartz": {"judul": "Inspirasi Buku The Magic of Thinking Big | David J. Schwartz", "tag": "Company", "meta": "Sofia | 22 Apr 2026", "url": "https://www.smsperkasa.com/blog/inspirasi-dari-buku-the-magic-of-thinking-big-david-j-schwartz", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/9970c1558c871042772107d2dc626f01", "alt": "Inspirasi Buku The Magic of Thinking Big | David J. Schwartz"}, {"t": "p", "x": "Inspirasi buku kali ini, tidak peduli apakah tujuan hidup Anda sangat besar dan menakutkan atau cukup kecil dan dapat dicapai, kemungkinan Anda telah berpikir “Di mana saya memulai?”. Penulis buku ini menyarankan Anda memulai dengan menciptakan pola pikir di mana Anda merasa 100% mampu mencapai apa pun yang Anda inginkan. Kenapa ini bisa berfungsi? Karena begitu Anda mulai cukup percaya diri, otak Anda akan memicu kreativitas yang diperlukan untuk mencapai tujuan Anda."}, {"t": "p", "x": "Ide-ide ini bisa menjadi akar dari apa yang kemudian menjadi psikologi positif. Satu studi McKinsey yang dikutip dalam buku ini menyatakan bahwa apa yang paling dicari oleh para pemimpin manajemen dan masyarakat saat bekerja dengan tim, adalah dorongan untuk bergerak maju. Orang-orang mencari sikap ini, karena memastikan Anda bertahan dalam menghadapi kegagalan dan kesulitan, bukannya melarikan diri di rintangan pertama. Sekarang David menyajikan kepada kami beberapa strategi untuk meningkatkan kepercayaan diri dan kepercayaan diri Anda."}, {"t": "h3", "x": "Terus bekerja pada kemampuan berpikir kreatif Anda."}, {"t": "p", "x": "Berbeda dengan hanya menghafal fakta, yang hanya akan membantu Anda dalam situasi tertentu. Pemikiran kreatif akan membantu Anda menyelesaikan masalah apa pun yang akan Anda hadapi. Otak Anda dapat menilai dan beradaptasi dengan situasi apa pun, karena itu tetap fleksibel. Dalam inspirasi buku ini David menyarankan 3 hal:"}, {"t": "list", "items": ["Selalu terbuka untuk ide-ide baru.", "Pelajari sesuatu yang baru kapan pun Anda bisa.", "Tanyakan pada diri Anda “Bagaimana saya bisa melakukan pekerjaan yang lebih baik hari ini?” Setiap hari."]}, {"t": "h3", "x": "Mematikan suara negatif di kepala Anda."}, {"t": "p", "x": "Dengan berita yang kebanyakan melaporkan peristiwa mengerikan dan semua orang di sekitar Anda hanya mengeluh, berpikir negatif adalah hal yang lumrah. Namun, Anda akan menemukan tidak ada jawaban hampir selalu tidak berhasil atau hanya rata-rata. Anda dapat melakukan ini dengan menuliskan obrolan ringan yang berbunyi seperti iklan di mana Anda mencoba untuk menjual diri Anda kepada diri sendiri. Berfokuslah pada apa yang membuat Anda berbeda, misalnya bahwa Anda lucu dan membuat orang tertawa di tempat kerja sepanjang waktu. Bacalah dengan keras sekali sehari dan dalam keadaan tenang setiap kali Anda merasa sedikit kecewa."}, {"t": "h3", "x": "Anda tidak akan menjadi sukses sendirian"}, {"t": "p", "x": "Peluangnya adalah Anda tidak akan menjadi sukses sendirian – ada orang-orang disekitar Anda yang memiliki peran penting. Itulah mengapa Anda harus memperlakukan semua orang yang Anda temui dengan hormat. Bahkan jika mereka bertindak gila, mereka mungkin saja mengalami hari yang buruk. Tetapi seperti Anda ingin diperlakukan seperti orang penting, begitu juga mereka. Nasihat berikutnya tentang rekan-rekan Anda. Anda mungkin pernah mendengar pepatah “Anda adalah rata-rata dari lima orang yang ada di sekitar Anda”. Sementara Anda dapat mengubah orang-orang yang anda pilih untuk berada di sekitar Anda. Jadi, mencari untuk menciptakan lingkungan dengan orang-orang yang berkualitas tinggi untuk diri Anda sendiri dan hanya menerima saran dari orang-orang yang telah pergi ke mana Anda ingin pergi. Jeff Bezos dari Amazon tidak memiliki banyak teman yang sukses, jadi dia hanya mengurung diri dengan buku. Dengan membaca biografi orang-orang sukses, dia ingin berkenalan dengan mereka."}, {"t": "p", "x": "Inspirasi buku yang menjadi Faktor penting lainnya adalah sikap Anda, yang akan tercermin dalam cara Anda berjalan, berbicara, dan berperilaku. Sikap adalah cermin pikiran dan orang selalu mengetahui apa yang sedang terjadi. Bagaimanapun, membaca bahasa tubuh adalah bagaimana kita bertahan selama ribuan tahun. Dua hal yang dapat Anda lakukan untuk meningkatkan sikap Anda termasuk selalu melakukan apa yang menurut Anda benar secara moral dan selalu berpakaian dengan baik."}, {"t": "p", "x": "Yang pertama sangat kuat dari dalam, karena Anda percaya pada pekerjaan Anda akan memastikan Anda bangga. Yang terakhir ini kuat dari luar, karena itu membuat Anda dan orang lain merasa penting. Tidak ada yang terlahir percaya diri, namun semua orang bisa mempelajarinya. “Palsulah sampai Anda berhasil” adalah benar dalam hal ini, karena Anda dapat mengendalikan emosi Anda dengan berperilaku seperti yang Anda inginkan. Jadi duduk di baris pertama, buat kontak mata dengan orang-orang dan berjalan lebih cepat daripada yang lain. Sama seperti berpakaian dengan baik itu akan membuat Anda terlihat penting di luar, yang pada gilirannya akan membuat Anda merasa percaya diri dari dalam."}, {"t": "h3", "x": "Pemenang menemukan solusi, pecundang mencari alasan"}, {"t": "p", "x": "Anda mungkin pernah mendengar pepatah “Pemenang menemukan solusi, pecundang mencari alasan.” Dan itu benar. Di sinilah buku ini penuh lingkaran, karena percaya pada diri sendiri adalah apa yang menciptakan perbedaan antara mencoba menemukan seseorang untuk disalahkan ketika ada yang salah, dan mencari cara untuk mencoba lagi dan menjadi lebih baik. Jadi bagaimana Anda mengubah semua ini menjadi tindakan?"}, {"t": "p", "x": "Ambil pendekatan 2 langkah: Merencanakan dan mengeksekusi. Tulis rencana detail langkah demi langkah dengan petunjuk bagaimana Anda melakukan setiap langkah dan gambaran kasar tentang kapan Anda akan menyelesaikannya. Kemudian, mulai bekerja dan pelajari kemunduran Anda. Jangan sia-siakan energi apa pun untuk menyalahkan diri sendiri, cobalah untuk belajar dari apa yang salah dan ambil langkah berikutnya. Argumen terakhir dari buku ini adalah bahwa satu-satunya perbedaan antara orang sukses dan orang normal terletak pada kepercayaan diri dan keyakinan mereka. Hal inilah yang menyebabkan mereka bertahan cukup lama bagi mereka untuk mencapai kesuksesan."}, {"t": "p", "x": "Materi ini disampaikan oleh salah satu anggota team SMS Perkasa dalam kegiatan rutin yang diadakan dalam tema “Kaizen Day”. Materi menarik lainnya yang dapat menjadi bahan bacaan dan inspirasi buku bagi Anda adalah 3 Kunci Utama dari One Minute Manager."}]}, "kegiatan-csr-pt-sms-perkasa-di-panti-asuhan-bhakti-luhur-malang": {"judul": "Kegiatan CSR SMS Perkasa di Panti Asuhan Bhakti Luhur Malang", "tag": "Company", "meta": "Sofia | 6 Apr 2026", "url": "https://www.smsperkasa.com/blog/kegiatan-csr-pt-sms-perkasa-di-panti-asuhan-bhakti-luhur-malang", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/a016150dad6b16d26bfa00a087e0e559", "alt": "Kegiatan CSR SMS Perkasa di Panti Asuhan Bhakti Luhur Malang"}, {"t": "p", "x": "Sebagai bagian dari agenda tahunan, PT SMS Perkasa kembali melaksanakan kegiatan Corporate Social Responsibility (CSR) dengan mengunjungi Panti Asuhan Yayasan Bhakti Luhur di Jl. Dempo No 14, Oro-oro Dowo, Malang pada tanggal 27 Agustus 2023. Kegiatan ini mencerminkan komitmen berkelanjutan perusahaan untuk berkontribusi kepada masyarakat."}, {"t": "img", "foto": "/_blob/e05ccb6d66b0127f6942f319c2122e86", "alt": "Sambutan Suster Helena"}, {"t": "p", "x": "Suster Helena, mewakili panti asuhan, menyambut tim PT SMS Perkasa dengan hangat. Dalam sambutannya, beliau mengapresiasi konsistensi PT SMS Perkasa yang setiap tahunnya selalu menyempatkan diri untuk berkunjung dan memberikan dukungan."}, {"t": "p", "x": "Bapak Gunawan Koesdianto, Direktur PT SMS Perkasa, menegaskan bahwa agenda tahunan ini bukan hanya sekedar tradisi, melainkan bentuk nyata dari tanggung jawab sosial perusahaan. Beliau berharap bahwa kunjungan rutin ini dapat terus memberikan dampak positif bagi anak-anak di panti asuhan."}, {"t": "h2", "x": "Kegiatan CSR"}, {"t": "p", "x": "Dalam rangkaian kegiatan, anak-anak diajak untuk berpartisipasi dalam beberapa permainan sederhana yang diselenggarakan oleh tim PT SMS Perkasa. Meskipun sederhana, permainan tersebut berhasil menghadirkan suasana ceria di tengah-tengah mereka."}, {"t": "h3", "x": "1. Estafet Sarung"}, {"t": "img", "foto": "/_blob/4b4de61f6b5a53d94b1897e7534ecb1d", "alt": "Permainan estafet sarung"}, {"t": "p", "x": "Permainan estafet sarung menjadi salah satu sorotan utama dalam kegiatan yang diselenggarakan oleh PT SMS Perkasa di Panti Asuhan Yayasan Bhakti Luhur. Peserta, yang terdiri dari anak-anak panti asuhan dan karyawan PT SMS Perkasa, ditantang untuk mengenakan sarung secepat mungkin secara bergantian kepada rekan tim mereka. Walaupun tampak sederhana, permainan ini memerlukan kerjasama tim dan kelincahan dalam memakai sarung. Tawa dan semangat juang anak-anak memenuhi udara saat mereka berusaha menyelesaikan estafet dengan cepat. Selain sebagai hiburan, permainan ini juga menjadi sarana edukasi bagi anak-anak untuk mengenal dan menghargai salah satu elemen budaya tradisional Indonesia, yaitu sarung."}, {"t": "h3", "x": "2. Pin Ball Keliling Indonesia"}, {"t": "img", "foto": "/_blob/e7f0597ef37ff1a9a1c4e88bfb0b5258", "alt": "Permainan pin ball keliling Indonesia"}, {"t": "p", "x": "Dalam permainan ini, papan pin ball raksasa diatur dengan desain peta Indonesia, dan setiap provinsi diwakili oleh lubang atau target tertentu. Anak-anak diberi kesempatan untuk menembakkan bola ke lubang target, mewakili masing-masing provinsi, sambil belajar tentang geografi negara. Tim yang paling cepat memasukkan bola ke target provinsi, maka akan mendapatkan poin. Ini bukan hanya permainan yang menyenangkan, tetapi juga sarana edukatif yang memperkenalkan anak-anak pada kekayaan dan keragaman budaya Indonesia. Atmosfer penuh semangat dan keingintahuan mewarnai kegiatan ini, membuatnya menjadi salah satu momen yang paling diingat oleh semua yang hadir."}, {"t": "p", "x": "Baca Juga: Yuk Intip!! 5 Hal Menarik Lingkungan Kerja di SMS Perkasa"}, {"t": "h3", "x": "3. Tebak Gaya"}, {"t": "img", "foto": "/_blob/8d1bcb920b1465b8ee1fc4ebb14ea435", "alt": "Permainan tebak gaya"}, {"t": "p", "x": "Dalam permainan ini, seorang peserta ditugaskan untuk menirukan gaya atau aksi tertentu, sementara teman-temannya berusaha menebak apa gaya yang ditirukan. Keunikan permainan ini terletak pada kreativitas dan improvisasi peserta dalam menirukan, sering kali mengundang tawa dari penonton. Para anak-anak, dengan semangat dan antusiasme, berlomba-lomba untuk menjadi peniru terbaik dan paling kreatif,"}, {"t": "p", "x": "Sebagai penutup, beberapa anak panti asuhan bersama pengasuh mereka memberikan penampilan singkat yang menambah kemeriahan acara. Penampilan tersebut menjadi pengingat bahwa dukungan yang konsisten dapat memberikan semangat dan motivasi bagi mereka."}, {"t": "p", "x": "Dengan kegiatan CSR ini, PT SMS Perkasa berharap untuk terus menjadi bagian dari pertumbuhan dan perkembangan anak-anak di Panti Asuhan Yayasan Bhakti Luhur. Ini adalah bentuk nyata dari komitmen perusahaan dalam membangun hubungan yang baik dengan masyarakat sekitar."}]}, "yuk-intip-5-hal-menarik-di-sms-perkasa": {"judul": "Yuk Intip!! 5 Hal Menarik Lingkungan Kerja di SMS Perkasa", "tag": "Company", "meta": "Sofia | 31 Mar 2026", "url": "https://www.smsperkasa.com/blog/yuk-intip-5-hal-menarik-di-sms-perkasa", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/80c11fe02943972958454adb0f427512", "alt": "Yuk Intip!! 5 Hal Menarik Lingkungan Kerja di SMS Perkasa"}, {"t": "p", "x": "Hai Perkasa Partners! Salah satu faktor yang membuat seseorang merasa nyaman dengan tempat kerjanya adalah lingkungan kerja. Selain membuat nyaman, lingkungan kerja juga bisa menjadi pertimbangan besar seseorang untuk bertahan atau pergi dari satu tempat kerja. Beberapa orang dengan gaji tinggi kesulitan untuk bertahan jika lingkungan kerjanya tidak mendukungnya untuk bekerja secara efektif, tidak memberi kesempatan berkembang, atau membuat merasa tidak dihargai. Sehingga, intensi untuk melakukan turnover akan lebih tinggi. Dan sebaliknya, ada berbagai cerita orang yang memiliki gaji biasa saja memiliki loyalitas tinggi dengan tempat kerjanya karena merasa nyaman dan sulit menemukan lingkungan yang serupa jika pindah ke tempat lain."}, {"t": "p", "x": "Lingkungan kerja meliputi lingkungan fisik dan juga lingkungan sosial. Lingkungan fisik bisa meliputi lokasi, properti, penataan ruangan, dan jarak antar karyawan. Sedangkan lingkungan sosial bisa meliputi budaya kerja, interaksi antar karyawan, kondusivitas kerja, dan gaya kepemimpinan atasan."}, {"t": "p", "x": "Lingkungan fisik yang bermasalah seperti ruangan yang kurang kondusif, seperti space kerja yang sempit, tempat duduk tidak nyaman, lampu remang, ruangan panas, tidak ada tempat untuk beribadah, teknologi terbatas, dan penataan kacau, mungkin membuat kita tidak bisa memiliki semangat kerja yang tinggi karena terganggu dengan situasi fisik ini. Begitupun dengan lingkungan sosial. Jika antar karyawan sulit berkomunikasi, budaya kerja tidak mendukung diri, suasana karyawan gaduh, tidak memberi kesempatan untuk izin kerja, supervisor atau pimpinan otoriter dan tidak memberi kebebasan sama sekali, maka, bisa jadi kinerja kita juga terganggu, produktivitas kerja kita rendah, dan intensi kita untuk keluar dari pekerjaan tersebut pun tinggi."}, {"t": "p", "x": "Bagaimana lingkungan kerja di SMS Perkasa? Nah, berikut adalah 5 hal yang tampak di lingkungan kerja (fisik dan sosial) SMS Perkasa! Apakah sama dengan yang ada di tempat kerjamu? Check this out!"}, {"t": "h2", "x": "1. Penataan ruangan SMS Perkasa memudahkan bersosialisasi dan berkoordinasi dengan rekan kerja"}, {"t": "p", "x": "SMS Perkasa memiliki lingkungan yang supportif untuk bekerja dan bersosialisasi lho! Supportif untuk bekerja karena setiap karyawan memiliki meja dan komputernya masing-masing, fasilitas kantor tersedia untuk setiap keperluan kerja, ruangan nyaman dan tidak gerah, serta pencahayaan cukup. Supportif untuk bersosialisasi karena saat tengok kanan ada rekan kerja, tengok belakang ada rekan kerja. Jadi, untuk berkordinasi, sekedar ngobrol ringan, atau berbagi musik bersama bukanlah hal yang sulit dilakukan. Untuk berkomunikasi antar departemen juga bisa menggunakan telpon per line, sehingga jika memerlukan koordinasi singkat tidak harus berdiri dari kursi dan menghampiri rekan kerja lainnya. Hal ini membuat kerja lebih efektif dan efisien, karena kita tidak memerlukan waktu untuk sekedar berdiri dan menghampiri atau mengganggu fokus pekerjaan. Tapi, kemudahan bersosialisasi ini tidak lantas menjadi kesempatan untuk gosip bebas saat jam kerja lho ya! Setiap karyawan memiliki tanggung jawab sendiri untuk menyelesaikan pekerjaannya tepat waktu dan bekerja profesional"}, {"t": "h2", "x": "2.Budaya perusahaan SMS Perkasa dinamis dan kooperatif"}, {"t": "p", "x": "Seperti artikel sebelumnya tentang “Shaping The Future with Steel”, telah dibahas bahwa usia karyawan yang ada di SMS Perkasa masih muda. Sehingga, budaya yang dibawa pun budaya yang dinamis, seperti fleksibel, mendukung adanya pengembangan diri pada karyawan, pembelajar, dan aktif. Interaksi antar karyawannya pun santai, sehingga, jika ada yang memerlukan bantuan atau tidak memahami sesuatu, karyawan tersebut bisa bertanya kepada rekan kerjanya dengan mudah."}, {"t": "p", "x": "Selain itu, sebagai karyawan yang memiliki peran di keluarga, karyawan memiliki hak untuk menggunakan cuti nya agar bisa mengurus urusan di luar pekerjaannya. Tentu saja izin untuk tidak masuk harus mendapatkan persetujuan dari Managing Director, namun, jika alasan yang disampaikan untuk absen tersebut memang mendesak, karyawan diperbolehkan absen dengan catatan harus menyelesaikan tanggung jawabnya sebelum absen. Setiap karyawan sepakat dengan aturan ini."}, {"t": "h2", "x": "3. Toleransi, dan aspek penilaian di SMS Perkasa berdasarkan kinerja"}, {"t": "p", "x": "Jika ada pernyataan “Kalau kamu anak atau kerabat Raja, maka, hidupmu lebih istimewa”, Entitlement! Hal itu tidak berlaku lho di SMS Perkasa. Tidak ada perlakuan spesial untuk golongan tertentu, karena setiap karyawan dinilai berdasarkan kinerjanya. Kinerja akan menentukan gaji dan kenaikan jabatan yang akan diterima tiap anggota tim SMS Perkasa."}, {"t": "h2", "x": "4. Pemimpin SMS Perkasa berkarisma"}, {"t": "p", "x": "Kepemimpinan juga menjadi salah satu faktor lingkungan sosial yang turut memengaruhi kinerja karyawannya. Supervisor dan pimpinan yang terlalu otoriter tidak memberi kesempatan kepada karyawan untuk bekerja dengan caranya akan membuat karyawan merasa terkekang. Di SMS Perkasa, pemimpin akan membebaskan karyawannya untuk bekerja dengan cara masing-masing. Pemimpin hanya melakukan supervisi, mengarahkan, dan memotivasi agar setiap karyawan bisa bekerja maksimal mencapai target masing-masing. Ingat! Tugas itu bisa didelegasikan, tapi… tanggung jawab tidak! Sepakat kan?"}, {"t": "h2", "x": "5. SMS Perkasa melibatkan karyawan untuk perencanaan perusahaan"}, {"t": "p", "x": "Banyak perusahaan yang merencanakan pengembangan hanya berdasarkan opini dan pemikiran pimpinannya. Kadang kala, pimpinan perusahaan pun bisa bertindak tidak profesional dan merugikan perusahaan dan karyawan. Namun, di SMS Perkasa, pimpinan selalu melibatkan setiap karyawan untuk membahas perencanaan pengembangan perusahaan. Empowerment! Tiap anggota akan bergerak seiring dengan visi dan misi perusahaan. Sehingga, point of view yang terkumpul untuk menyusun rencana strategis pun berasal dari dua pihak, pimpinan dan karyawan. Itulah mengapa, SMS Perkasa berkembang pesat dan masif bersama karyawannya."}, {"t": "p", "x": "Gimana Perkasa Partners?! Begitulah sekilas gambaran dari keseruan lingkungan kerja di SMS Perkasa. Yuk, kita semua bekerja sama dan terus menerus berkarya memberi sumbangsih lebih bagi bangsa Indonesia!"}, {"t": "p", "x": "Semangat!"}, {"t": "p", "x": "Buat kalian yang ingin terus mendapat informasi berita terkini terkait besi dari SMS Perkasa, kalian dapat masukkan alamat email dan subscribe Newsletter kami di samping kanan, atau kunjungi official site kami di www.smsperkasa.com."}, {"t": "p", "x": "Cheers!"}]}, "yuk-sadari-pentingnya-menghargai-keragaman-di-dunia-kerja": {"judul": "Yuk Sadari Pentingnya Menghargai Keragaman di Dunia Kerja!", "tag": "Company", "meta": "Sofia | 31 Mar 2026", "url": "https://www.smsperkasa.com/blog/yuk-sadari-pentingnya-menghargai-keragaman-di-dunia-kerja", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/31cc20bb39e8a704df5c146eb683f08f", "alt": "Yuk Sadari Pentingnya Menghargai Keragaman di Dunia Kerja!"}, {"t": "p", "x": "Sebagai makhluk sosial, tentu saja kita selalu dihadapkan dengan beragam jenis karakter kepribadian, latar belakang budaya, cara bergaul sampai pada pola pikir yang bervariasi. Tentu saja keragaman ini juga akan kita temui di dunia kerja. Tidak sedikit konflik yang dapat timbul jika kita kurang menyadari pentingnya saling menghargai berbagai perbedaan yang ada di lingkungan kerja. Namun sebaliknya, jika setiap individu menyadari pentingnya perbedaan tersebut, maka hal ini justru menjadi kekuatan yang saling melengkapi dan mampu menciptakan situasi yang harmonis di lingkungan kerja kita lho! Lalu apa sih sebenarnya yang perlu kita pahami untuk dapat saling menghargai perbedaan tersebut? Perkasa Partner, yuk simak beberapa poin di bawah ini!"}, {"t": "h2", "x": "Demografis"}, {"t": "p", "x": "Hal yang mendasar dalam pebedaan karakteristik biasanya dikaitkan dengan keragaman demografis, antara lain gender, usia, ras, etnis dan kemampuan fisik. Menurut Schermerhorn, Hunt, dan Osborn (2004), gender tidak menentukan perbedaan yang konsisten dalam beberapa kemampuan seperti pemecahan masalah, analisa, motivasi, kemampuan belajar, sosialisasi dan masih banyak lagi. Sementara, jika dibandingkan dengan laki-laki, biasanya perempuan dikaitkan dengan tidak terlalu mengejar jenjang karir dan kepatuhan yang lebih tinggi, tetapi laki-laki biasanya cenderung memiliki tingkat kehadiran tinggi di kantor, serta penghasilan yang lebih banyak. Terkait usia, terdapat stereotype bahwa semakin tua usia, maka semakin berpengalaman dan cenderung lebih loyal pada perusahaan. Ras dan etnis dapat berpengaruh pada gaya komunikasi maupun karakter diri seseorang. Kemudian, terkait dengan kemampuan fisik, saat ini telah banyak perusahaan yang terbuka dan memberi kesempatan bagi para individu dengan kebutuhan khusus untuk bekerja dan berkarya sesuai dengan kemampuan diri dan kesesuaian jenis pekerjaan."}, {"t": "h2", "x": "Bakat dan Kemampuan"}, {"t": "p", "x": "Setiap individu memiliki kapasitas yang beragam untuk melakukan berbagai tugas yang diperlukan untuk pekerjaan tertentu. Maka dari itu, biasanya perusahaan akan melakukan seleksi, salah satunya adalah untuk mengetahui bakat dan kemampuan calon pegawai untuk memenuhi kualifikasi pekerjaan yang dibutuhkan."}, {"t": "h2", "x": "Kepribadian"}, {"t": "p", "x": "Kepribadian adalah kombinasi karakteristik yang meliputi sifat unik seseorang ketika orang itu bereaksi dan berinteraksi dengan orang lain. Kepribadian menggabungkan sejumlah karakteristik fisik dan mental yang mencerminkan penampilan seseorang, cara berpikir, bertindak, dan merasa. Banyak hal yang dapat memengaruhi kepribadian seseorang, diantaranya ialah, nilai dan norma budaya, serta faktor situasional di lingkungan."}, {"t": "h3", "x": "Gaya Pemecahan Masalah/Problem Solving Style"}, {"t": "p", "x": "Gaya pemecahan masalah seseorang seringkali dipengaruhi oleh cara individu tersebut menangkap, mengumpulkan dan mengelola informasi. Maka dari itu, gaya pemecahan masalah dapat dibedakan menjadi, pemecahan masalah menggunakan sensasi, intuisi, perasaan dan pemikiran."}, {"t": "p", "x": "Nah, dari uraian di atas, keragaman tenaga kerja dapat diartikan sebagai kehadiran karakteristik individu yang membuat orang berbeda satu sama lain. Tantangan dari keragaman ini ialah cara untuk menghormati perspektif dan kontribusi individu dalam mencapai visi dan identitas organisasi bersama. Kami sendiri di SMS Perkasa, menjunjung tinggi keragaman di lingkungan kerja. Segenap tim SMS Perkasa berusaha menerapkan keragaman tersebut terbentuk menjadi karakter dasar individu dan perusahaan, dan menjadikan arahan bersama untuk kami senantiasa mencapai visi dan misi perusahaan. Brave, Responsible, Agile, Virtuous, dan Cutting-Edge, yang kemudian dikenal dengan BRAVE. Selalu junjung tinggi sikap saling menghargai keragaman di sekitar kita ya Perkasa Partner ! Like wisdom people always said, In diversity there is beauty and strength."}, {"t": "h3", "x": "Reference:Schermerhorn, Hunt, and Osborn (2004). Published by John Wiley & Sons, Inc."}]}, "mengenali-kepemimpinan-efektif": {"judul": "Mengenali Kepemimpinan Efektif", "tag": "Company", "meta": "Sofia | 11 Feb 2026", "url": "https://www.smsperkasa.com/blog/mengenali-kepemimpinan-efektif", "nama": "smsperkasa.com", "catatan": "Artikel asli SMS Perkasa.", "label": "Lihat Detail smsperkasa.com", "aria": "Lihat detail artikel ini di smsperkasa.com, membuka tab baru", "blok": [{"t": "img", "foto": "/_blob/28c17c04c9687d30b3ac4f7f81c6b815", "alt": "Mengenali Kepemimpinan Efektif"}, {"t": "p", "x": "Perkasa Partner, kali ini kami akan mengulas tentang kepempimpinan. Salah satu kutipan menarik dari Rosalynn Carter, “seorang pemimpin biasa membawa orang lain ke tempat yang ingin mereka tuju”. Seorang pemimpin yang luar biasa membawa para pendukung ke tempat yang mungkin tidak ingin mereka tuju, tetapi yang harus mereka tuju. Seorang pemimpin yang efektif adalah yang tidak hanya bekerja sendiri tanpa melibatkan siapapun, melainkan mampu memanfaatkan berbagai potensi yang mengelilinginya. Kepemimpinan efektif bukan sekedar pusat kedudukan atau kekuatan akan tetapi merupakan interaksi aktif antar komponen yang efektif. Yuk simak tipe-tipe kepemimpinan yang efektif."}, {"t": "h2", "x": "Tipe & Gaya Kepemimpinan"}, {"t": "p", "x": "Pemimpin adalah seorang pribadi yang memiliki kecakapan dan kelebihan, khususnya kecakapan dan kelebihan disatu bidang. Sehingga dia mampu mempengaruhi orang-orang lain untuk bersama-sama melakukan aktivitas-aktivitas tertentu, demi pencapaian satu atau beberapa tujuan. Dibawah ini beberapa tipe dan gaya kepemimpinan."}, {"t": "p", "x": "Kharismatik. Tipe ini mempunyai daya tarik dan pembawaan yg luar biasa, sehingga mereka mempunyai pengikut yang jumlahnya besar. Kesetiaan dan kepatuhan pengikutnya timbul dari kepercayaan terhadap pemimpin itu. Pemimpin dianggap mempunyai kemampuan yang diperoleh dari kekuatan Yang Maha Kuasa."}, {"t": "p", "x": "Paternalistik, memiliki sifat–sifat antara lain:"}, {"t": "list", "items": ["Menganggap bawahannya belum dewasa", "Bersikap terlalu melindungi", "Jarang memberi kesempatan bawahan untuk mengambil keputusan", "Selalu bersikap maha tau dan maha benar"]}, {"t": "p", "x": "Otoriter, mempunyai sifat sebagai berikut:"}, {"t": "list", "items": ["Pemimpin bertindak sebagai diktator", "Cara menggerakan bawahan dengan paksaan dan ancaman"]}, {"t": "p", "x": "Militeristik, mempunyai sifat sebagai berikut:"}, {"t": "list", "items": ["Menuntut kedisiplinan yg keras dan kaku", "Lebih banyak menggunakan system perintah", "Formalitas yg berlebih-lebihan", "Tidak menerima saran dan kritik dari bawahan", "Sifat komunikasi hanya sepihak"]}, {"t": "p", "x": "Demokrasi. Tipe ini mengutamakan masalah kerja sama sehingga terdapat koordinasi pekerjaan dari semua bawahan. Kepemimpinan demokrasi menghadapi potensi sikap individu, mau mendengarkan saran dan kritik yang sifatnya membangun. Jadi pemimpin menitik beratkan pada aktivitas setiap anggota kelompok, sehingga semua unsur organisasi dilibatkan dalam aktivitas, yang dimulai penetuan tujuan, pembuatan rencana keputusan dan disiplin."}, {"t": "h2", "x": "Pentingnya Kepemimpinan Yang Efektif"}, {"t": "p", "x": "Pemimpin dalam menjalankan perannya sebagai secara pribadi, dituntut untuk memiliki mentalitas yang bagus dan kematangan emosi yang mantap. Hal tersebut diperlukan karena dalam menjalankan peran sebagai pemimpin akan berhadapan dengan manusia dan antar manusia serta dengan berbagai macam latar belakang baik tingkat pendidikan atau ilmu pengetahuan, kepribadian, tingkat emosi yang berbeda-beda. Dalam kepemimpinan banyak teknik yang dapat dikembangkan, tetapi sesuai dengan tingkat perkembangan masyarakat kita dewasa ini, yang masih berorientasi ke atas, maka teknik kepemimpinan dengan pemberian suri tauladan merupakan teknik yang sangat cocok. Lain daripada itu perlu juga dikembangkan gaya kepemimpinan motivasi yang positif dengan memberikan penghargaan kepada yang berhasil, bersamaan dengan gaya partisipasif atau gaya demokratis dengan memberikan kesempatan kepada anak buah untuk berprakarsa dan berparisipasi dalam pengambilan keputusan, dan gaya pengawasan yang berorientasi kepada faktor yang dapat mengembangkan orang-orang disekitarnnya."}, {"t": "h3", "x": "Sifat Kepemimpinan yang Efektif"}, {"t": "p", "x": "Sifat kepemimpinan yang efektif menurut Keith Davis adalah:"}, {"t": "list", "items": ["Intelegensi yang tinggi (Intellegence)", "Kematangan jiwa social (Social Maturity)", "Motivasi terhadap diri dan hasil (Inner Motivation and Achievement Drives)", "Menjalin hubungan kerja manusiawi (Human Relation Attitudes)"]}, {"t": "p", "x": "Menurut Ki Hajar Dewantara, sifat kepemimpinan meliputi 3 hal yaitu:"}, {"t": "list", "items": ["Ing Ngarso Sung Tulodho (pemimpin dimuka harus memberi teladan)", "Ing Madyo Mangun Karso (pemimpin ditengah harus membangun prakarsa)", "Tut Wuri Handayani (pemimpin mengikuti mendorong dari belakang)"]}, {"t": "h3", "x": "Fungsi Kepemimpinan yang Efektif"}, {"t": "list", "items": ["Membantu mencapai sasaran organisasi", "Menggerakan anggota menuju sasaran tersebut", "Mewujudkan interaksi dan keterikatan antar individu", "Memelihara kekuatan dan kohesi anggota"]}, {"t": "p", "x": "Baca Juga: Cara Membuat Rencana dan Action Plan yang Efektif"}, {"t": "h3", "x": "Tantangan yang dihadapi"}, {"t": "p", "x": "Dalam prosesnya berbagai tantangan harus dihadapi, salah satunya adalah krisis kepemimpinan. Krisis kepemimpinan ini disebabkan karena makin langkanya kepedulian pada kepentingan orang banyak. Sekurang-kurangnya terlihat ada tiga masalah mendasar yang menandai kekurangan ini. Pertama adanya krisis komitmen. Kebanyakan orang tidak merasa mempunyai tugas dan tanggung jawab untuk memikirkan dan mencari pemecahan masalah bersama, masalah harmoni dalam kehidupan dan masalah kemajuan dalam kebersamaan. Kedua, adanya krisis kredibilitas. Sangat sulit mencari pemimpin atau kader pemimpin yang mampu menegakkan kredibilitas tanggung jawab. Kredibilitas itu dapat diukur misalnya dengan kemampuan untuk menegakkan ketika memikul amanah, setia pada kesepakatan dan janji, bersikap teguh dalam pendirian, jujur dalam memikul tugas dan tanggung jawab yang dibebankan padanya, kuat iman dalam menolak godaan dan peluang untuk menyimpang. Ketiga, masalah kebangsaan dan kehidupan bermasyarakat dan bernegara. Saat ini tantangannya semakin kompleks dan rumit. Kepimpinan sekarang tidak cukup lagi hanya mengandalkan pada bakat atau keturunan. Kelihaian dalam memadukan beberapa gaya dan tipe kepemimpinan menjadi perlu untuk disesuaikan dengan situasi dan siapa yang dipimpin."}, {"t": "h3", "x": "Cara Menumbuhkan Pemimpin yang Efektif"}, {"t": "p", "x": "Perlu proses dalam menumbuhkan pemimpin yang efektif, dapat diibaratkan dengan bercocok tanam. Delapan prinsip pengembangan yang efektif antara lain:"}, {"t": "list", "items": ["Pilihlah benih yang bagus. ”pilihlah orang dengan potensi alamiah untuk bisa memainkan peran pemimpin”", "Siapkan tanahnya. “periksa kultur perusahaan anda apakah kultur ini menumbuhkan atau memandulkan tumbuhnya kepemimpinan” kejujuran, keadilan, dan ketidakcurangan.", "Perkaya tanahnya dengan pupuk dan air.”pastikan matahari yang membawa nilai-nilai baik: integritas”", "Rotasikan tanaman. “berikan kepada pemimpin beragam tantangan dan kesempatan”", "Biarkan ladang tanpa tanaman: tidak semua pohon dapat berbuah setiap tahun. “berikan waktu kepada para pemimpin untuk berpikir, merenung dan menyelesaikan masalah mereka”", "Lihat baik-baik dimana pohon akan tumbuh subur. “seorang pemimpin yang sanggup berjuang dalam satu bidang atau sektor mungkin juga dapat sukses dalam bidang atau sektor lain ”", "Buanglah bagian-bagian pohon yang mati. Sederhanakan pohon hingga tersisa batang saja. “buanglah praktek-praktek dan ide-ide yang tidak memberikan hasil”", "Biarkan akarnya tumbuh jauh kedalam tanah. ”air inspirasi terletak jauh dibawah tanah” prinsip paling penting dalam pengembangan kepemimpinan adalah jangan pernah mengangkat seseorang yang tidak mempunyai pelatihan atau persiapan yang sesuai."]}, {"t": "p", "x": "Baca Juga: Leadership Dalam Industri Baja dan Konstruksi"}, {"t": "h2", "x": "Kepemimpinan yang Didasarkan Pada Kerendahan Hati"}, {"t": "p", "x": "Dari sekian banyak teori dan ulasan tentang kepemimpinan diatas, pada akhirnya kepemimpinan adalah sebuah keputusan dan lebih merupakan hasil dari proses perubahan karakter atau tranformasi internal dalam diri seseorang. Kepemimpinan bukanlah jabatan atau gelar, melainkan sebuah kelahiran dari proses panjang perubahan dalam diri seseorang. Ketika seseorang menemukan visi dan misi hidupnya, ketika terjadi kedamaian dalam diri (inner peace) dan membentuk bangunan karakter yang kokoh, ketika setiap ucapan dan tindakannya mulai memberikan pengaruh kepada lingkungannya, dan ketika keberadaannya mendorong perubahan dalam organisasinya, pada saat itulah seseorang lahir menjadi pemimpin sejati. Jadi pemimpin bukan sekedar gelar atau jabatan yang diberikan dari luar melainkan sesuatu yang tumbuh dan berkembang dari dalam diri seseorang. Kepemimpinan lahir dari proses internal (leadership from the inside out)."}, {"t": "p", "x": "Sering kali seorang pemimpin sejati tidak diketahui keberadaannya oleh mereka yang dipimpinnya. Bahkan ketika misi atau tugas terselesaikan, maka seluruh anggota tim akan mengatakan bahwa merekalah yang melakukannya sendiri. Pemimpin sejati adalah seorang pemberi semangat (encourager), motivator, inspirator, dan maximizer. Konsep pemikiran seperti ini adalah sesuatu yang baru dan mungkin tidak bisa diterima oleh para pemimpin konvensional yang justru mengharapkan penghormatan dan pujian (honor & praise) dari mereka yang dipimpinnya. Kepemimpinan sejati adalah kepemimpinan yang didasarkan pada kerendahan hati."}, {"t": "p", "x": "Materi ini dibawakan oleh Sales Departement dari SMS Perkasa saat Kaizen Day lho! Semoga ulasan diatas dapat Anda pahami untuk lebih mengenal diri dan maupun orang-orang disekitar. Semoga Bermanfaat!"}, {"t": "p", "x": "Baca juga: Kenali Personality Plus: 4 Tipe Kepribadian Manusia"}]}}
    };
  }
