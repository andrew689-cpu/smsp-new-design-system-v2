<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Scrim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<button type="button" data-scrim="{{ dataScrim }}" onClick="{{ onPress }}" aria-label="{{ ariaLabel }}" style="{{ gaya }}"></button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lapisan":{"editor":"int","default":10001},"animasi":{"editor":"boolean","default":true},"onPress":{"editor":null},"ariaLabel":{"editor":null,"default":"Tutup"},"$preview":{"width":240,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      dataScrim: (this.props.animasi ?? true) ? '1' : undefined,
      onPress: this.props.onPress,
      ariaLabel: this.props.ariaLabel ?? 'Tutup',
      gaya: 'position: fixed; inset: 0; width: 100%; height: 100%; z-index: ' + (this.props.lapisan ?? 10001) + '; background: transparent; border: 0; padding: 0'
    };
  }
}
</script>
</body>
</html>
