      cariMateriTampil: hasilCari.length > 0 || hasilBaca.length === 0,
      cariBacaanTampil: hasilBaca.length > 0,
      cariBacaanJudul: hasilBaca.length + ' artikel cocok dengan \u201c' + q + '\u201d',
      cariBacaanTingkat: hasilCari.length > 0 ? 2 : 1,
      cariBacaan: hasilBaca.map(barisBaca),
      gayaCariBacaan: hasilCari.length > 0 ? 'margin-top: 4.8rem' : 'margin-top: 2.4rem',
      cariSaran: p.cariSaran ?? 'Coba kata lain, misalnya hollow, beton, atau karat.',
      warnaKosong: ikon ? 'var(--ink)' : 'var(--ink-2)',
      cariHasil: hasilCari.map(kartu),
      gayaCari: ikon ? 'margin-top: 0.8rem; box-sizing: border-box; padding: 2rem 1.6rem; border-radius: var(--sheet); background: var(--surface)' : 'margin-top: 2.4rem',
      dataRv: rv ? '1' : ikon ? '2' : undefined,
      gayaLembar: ikon ? lembarIkon : '',
      kursusTampil: !qq && !!aktif && !les,
      lesTampil: !qq && !!les,
      kursus: {},
      les: {},
      kakiAtas: rv ? '0' : (s.kakiAtas || 'var(--jarak-y-antar)'),
      q: s.q,
      ketik: (v) => this.setState({ q: v }),
      cariBuka: s.cari,
      cariAlih: () => this.setState({ cari: !s.cari, q: s.cari ? '' : s.q, bantuan: false }),
      bantuanBuka: s.bantuan,
      bantuanAlih: () => this.setState({ bantuan: !s.bantuan }),
      bantuanTutup: () => this.setState({ bantuan: false }),
      gulir: s.gulir,
      keAtasKlik: () => this._keAtas()
    };
    if (aktif) {
      const sudah = aktif.pelajaran.filter((l, i) => selesai[aktif.id + ':' + i]).length;
      const lanjut = aktif.pelajaran.findIndex((l, i) => !selesai[aktif.id + ':' + i]);
      vals.kursus = {
        gambarMerah: rv ? (p.gambar || '/_blob/0431e3e9af59f92d750099354ff0126e') : '', rupa, judul: aktif.judul, ringkas: aktif.ringkas, foto: aktif.foto, level: aktif.level,
        meta: aktif.pelajaran.length + ' pelajaran', menit: menitKur(aktif) + ' menit baca', hasil: aktif.hasil,
        labelMulai: sudah === 0 ? 'Mulai Belajar' : (sudah === aktif.pelajaran.length ? 'Baca Lagi' : 'Lanjutkan Belajar'),
        progres: sudah > 0 ? sudah + ' dari ' + aktif.pelajaran.length + ' pelajaran selesai' : '',
        onKembali: () => { this.setState({ kKursus: null, kPelajaran: null }); this._keAtas(); },
        onMulai: () => { this.setState({ kPelajaran: lanjut === -1 ? 0 : lanjut }); this._keAtas(); },
        daftar: aktif.pelajaran.map((l, i) => {
          const beres = !!selesai[aktif.id + ':' + i];
          return { nomor: i + 1, judul: l.judul, menit: menitLes(l) + ' menit', selesai: beres, ariaLabel: 'Pelajaran ' + (i + 1) + ', ' + l.judul + (beres ? ', selesai' : ''), onPilih: () => { this.setState({ kPelajaran: i }); this._keAtas(); } };
        })
      };
    }
    if (les) {
      const no = s.kPelajaran;
      const terakhir = no === aktif.pelajaran.length - 1;
      vals.les = {
        rupa, materi: aktif.judul, foto: aktif.foto, nomor: no, jumlah: aktif.pelajaran.length, menit: menitLes(les) + ' menit baca', judul: les.judul, blok: les.isi,
        onKembali: () => { this.setState({ kPelajaran: null }); this._keAtas(); },
        onSebelum: () => { this.setState({ kPelajaran: no - 1 }); this._keAtas(); },
        onBerikut: () => {
          const baru = { ...selesai, [aktif.id + ':' + no]: true };
          try { window.localStorage.setItem('smsp-kursus-selesai', JSON.stringify(baru)); } catch (e) {}
          this.setState({ selesai: baru, kPelajaran: terakhir ? null : no + 1 });
          this._keAtas();
        }
      };
    }
    return vals;
  }
}
</script>
