<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>CourseTabs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<div role="tablist" aria-label="{{ ariaLabel }}" data-gulir-kartu="1" style="display: flex; column-gap: 1.6rem; overflow-x: auto; box-shadow: inset 0 -0.1rem 0 var(--line-kuat)">
  <sc-for list="{{ tab }}" as="t" hint-placeholder-count="4">
    <dc-import name="Pressable" onPress="{{ t.pilih }}" ariaPressed="{{ t.kini }}" gaya="{{ t.gaya }}" hint-size="7rem,4.4rem">{{ t.nama }}</dc-import>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ariaLabel":{"editor":"text","default":"Topik materi","section":"Aksesibilitas"},"butir":{"editor":null,"section":"Data","tsType":"Array<{nama:string,kini:boolean,pilih:Function}>"},"$preview":{"width":330,"height":44}}'>
class Component extends DCLogic {
renderVals() {
    const p = this.props;
    return {
      ariaLabel: p.ariaLabel ?? 'Topik materi',
      tab: (p.butir ?? [{ nama: 'Semua', kini: true }, { nama: 'Dasar Baja' }, { nama: 'Pilih Material' }, { nama: 'Proyek' }]).map((t) => ({
        nama: t.nama,
        kini: t.kini ? 'true' : 'false',
        pilih: t.pilih,
        gaya: (t.kini ? 'color: var(--ink); box-shadow: inset 0 -0.2rem 0 var(--ink)' : 'color: var(--ink-2)') + '; flex-shrink: 0; box-sizing: border-box; min-height: 4.4rem; padding: 0; border: 0; background: transparent; font-size: var(--teks-body); line-height: var(--tinggi-rapat); font-weight: var(--bobot-bold)'
      }))
    };
  }
}
</script>
</body>
</html>
