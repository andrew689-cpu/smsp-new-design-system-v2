<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>HelpCentre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<sc-if value="{{ terbuka }}" hint-placeholder-val="{{ true }}">
  <div data-bantu="{{ dataBantu }}" role="dialog" aria-label="{{ labelDialog }}" style="{{ gaya }}">
    <sc-if value="{{ bilah }}" hint-placeholder-val="{{ false }}">
      <dc-import name="HelpTitleBar" online="{{ online }}" onTutup="{{ tutup }}" hint-size="100%,7.2rem"></dc-import>
    </sc-if>
    <sc-if value="{{ isMenu }}" hint-placeholder-val="{{ false }}">
      <dc-import name="HelpMenu" dc-props="{{ menu }}" hint-size="100%,40rem"></dc-import>
    </sc-if>
    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <dc-import name="HelpContactForm" dc-props="{{ form }}" hint-size="100%,72rem"></dc-import>
    </sc-if>
    <sc-if value="{{ isWa }}" hint-placeholder-val="{{ false }}">
      <dc-import name="WhatsAppPanel" dc-props="{{ wa }}" hint-size="100%,26rem"></dc-import>
    </sc-if>
    <sc-if value="{{ isChat }}" hint-placeholder-val="{{ false }}">
      <dc-import name="LiveChatPanel" dc-props="{{ chat }}" hint-size="100%,60rem"></dc-import>
    </sc-if>
    <sc-if value="{{ isKalk }}" hint-placeholder-val="{{ false }}">
      <dc-import name="HelpRowsPanel" dc-props="{{ kalk }}" hint-size="100%,26rem"></dc-import>
    </sc-if>
    <sc-if value="{{ isGudang }}" hint-placeholder-val="{{ false }}">
      <dc-import name="HelpRowsPanel" dc-props="{{ gudang }}" hint-size="100%,44rem"></dc-import>
    </sc-if>
  </div>
</sc-if>
</x-dc>

</script>
