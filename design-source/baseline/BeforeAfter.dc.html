    </div>
  </div>
  <div style="margin-top: var(--rapat); min-height: {{ tinggiPita }}; display: flex; align-items: flex-start">
    <sc-if value="{{ pitaKiri }}" hint-placeholder-val="{{ false }}">
      <img src="{{ fotoTeksDengan }}" alt="Keuntungan Dengan Sms Perkasa — geser ke kanan" loading="lazy" style="width: 75rem; max-width: 100%; height: auto; display: block; margin-right: auto">

<script type="text/x-dc" data-dc-script data-props='{"jenis":{"editor":"enum","options":["foto","panel"],"default":"foto","section":"Resep"},"tinggiPanel":{"editor":"text","default":"77.5rem","section":"Tata letak"},"labelTanpa":{"editor":"text","default":"Tanpa SMS Perkasa","section":"Isi"},"labelBersama":{"editor":"text","default":"SMS Perkasa","section":"Isi"},"papan":{"editor":"boolean","default":true,"section":"Resep"},"gambarBersama":{"editor":"enum","options":["pensil","warna"],"default":"pensil","section":"Gambar"},"panel":{"editor":null,"section":"Data","tsType":"Array<{tanpaJudul:string,tanpaImg:string,tanpaAlt:string,bersamaJudul:string,bersamaImg:string,bersamaAlt:string}>"},"tata":{"editor":"enum","options":["ponsel","desktop"],"default":"ponsel","section":"Resep"},"awal":{"editor":"range","min":0,"max":100,"step":1,"default":4,"section":"Resep"},"fotoDengan":{"editor":"text","default":"/_blob/f330fd9f78bf3b8358307b31bc216896","section":"Gambar"},"fotoTanpa":{"editor":"text","default":"/_blob/28578451a6236e2355e3b299c8beaa84","section":"Gambar"},"fotoTeksDengan":{"editor":"text","default":"/_blob/7fa392efb230dc1ae906da597c3a89e2","section":"Gambar"},"fotoTeksTanpa":{"editor":"text","default":"/_blob/1fd3f7db432b36e551160527221f4122","section":"Gambar"},"altDengan":{"editor":"text","default":"Dengan SMS Perkasa: informasi produk lengkap dan akurat; respon cepat, pasti dibalas kurang dari 10 menit; pengiriman tepat waktu sesuai schedule; harga kompetitif tanpa mengorbankan kualitas","section":"Aksesibilitas"},"altTanpa":{"editor":"text","default":"Tanpa SMS Perkasa: spesifikasi produk tidak jelas dan kurang akurat; respon lama, tidak ada jaminan dibalas; pengiriman terlambat tidak tepat waktu; harga produk tidak sesuai dengan kualitas","section":"Aksesibilitas"},"$preview":{"width":330,"height":240}}'>
class Component extends DCLogic {
  state = {};
  renderVals() {
    const desktop = this.props.tata === 'desktop';
    const awal = this.props.awal ?? (desktop ? 96 : 4);
    const AMBANG_KIRI = 4;
    const AMBANG_KANAN = 96;
    const pos = Math.min(Math.max(Number(this.state.banding == null ? awal : this.state.banding) || 0, 0), 100);
    const fotoDengan = this.props.fotoDengan ?? '/_blob/f330fd9f78bf3b8358307b31bc216896';
    const fotoTanpa = this.props.fotoTanpa ?? '/_blob/28578451a6236e2355e3b299c8beaa84';
    const WARNA = ["/_blob/51ea8eabd64ea070cca30a953c197a24", "/_blob/e1e129d61c59195fbb8a219545ff7399", "/_blob/b6e9b943e1888b001cc2d072b78b8ead"];
    const PANEL = [{"tanpaJudul": "Spesifikasi Tidak Jelas", "tanpaImg": "/_blob/004225b99225d68ab1020af4f17722a3", "tanpaAlt": "Pekerja bingung di depan tumpukan besi hollow: ukuran salah? bukan besi SNI?", "bersamaJudul": "On Spec", "bersamaImg": "/_blob/bc955f06eae0f21ccfa663375689b7c9", "bersamaAlt": "Pekerja mengukur besi dengan jangka sorong: QA passed, SNI, toleransi ketat, presisi sesuai spesifikasi"}, {"tanpaJudul": "Pengiriman Terlambat", "tanpaImg": "/_blob/100c23ad840215a1c202a3c5831dfc53", "tanpaAlt": "Truk tua berasap di jalan dan pekerja menunggu: keterlambatan proyek", "bersamaJudul": "On Time", "bersamaImg": "/_blob/a7235fc9a890a80b1dc1f70f729f549f", "bersamaAlt": "Truk melaju menuju proyek: pengiriman terjadwal dan cepat ke lokasi proyek"}, {"tanpaJudul": "Biaya Over Budget", "tanpaImg": "/_blob/a8f3c472338a1effa000b68989bc4a47", "tanpaAlt": "Orang memegang kepala di depan tumpukan kertas dan grafik turun: RAB membengkak", "bersamaJudul": "On Budget", "bersamaImg": "/_blob/ef88b95bfa5f418a99c1ba7efc7809f1", "bersamaAlt": "Tangan menghitung RAB dengan kalkulator di samping besi hollow: sesuai anggaran, harga transparan, tanpa biaya tambahan"}];
    const isPanel = this.props.jenis === 'panel';
    return {
      isPanel,
      isFoto: !isPanel,
      papanTampil: this.props.papan ?? true,
      labelPolosTampil: !(this.props.papan ?? true),
      labelPolosBersama: 'Bersama ' + (this.props.labelBersama ?? 'SMS Perkasa'),
      tinggiPanel: this.props.tinggiPanel ?? ((this.props.papan ?? true) ? '77.5rem' : '72rem'),
      labelTanpa: this.props.labelTanpa ?? 'Tanpa SMS Perkasa',
      labelBersama: this.props.labelBersama ?? 'SMS Perkasa',
      panel: this.props.panel ?? (this.props.gambarBersama === 'warna' ? PANEL.map((x, i) => ({ ...x, bersamaImg: WARNA[i] })) : PANEL),
      gayaPanelFoto: 'flex: 1 1 0; min-height: 0; width: 100%; object-fit: contain; display: block; -webkit-mask-image: var(--pudar-x), var(--pudar-y); -webkit-mask-composite: source-in; mask-image: var(--pudar-x), var(--pudar-y); mask-composite: intersect',
      gulir: desktop ? '' : 'overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch',
      sudut: desktop ? 'var(--card)' : 'var(--tile)',
      bawah: desktop ? 'var(--dalam)' : 'var(--rapat)',
      tinggiPita: desktop ? '12.9rem' : '5.8rem',
      fotoDengan,
      fotoTanpa,
      adaDengan: !!fotoDengan,
      adaTanpa: !!fotoTanpa,
      takDengan: desktop && !fotoDengan,
      takTanpa: desktop && !fotoTanpa,
      altDengan: this.props.altDengan ?? 'Dengan SMS Perkasa: informasi produk lengkap dan akurat; respon cepat, pasti dibalas kurang dari 10 menit; pengiriman tepat waktu sesuai schedule; harga kompetitif tanpa mengorbankan kualitas',
      altTanpa: this.props.altTanpa ?? 'Tanpa SMS Perkasa: spesifikasi produk tidak jelas dan kurang akurat; respon lama, tidak ada jaminan dibalas; pengiriman terlambat tidak tepat waktu; harga produk tidak sesuai dengan kualitas',
      fotoTeksDengan: this.props.fotoTeksDengan ?? '/_blob/7fa392efb230dc1ae906da597c3a89e2',

  }

</script>
