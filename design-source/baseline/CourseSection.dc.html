<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>CourseSection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<section id="{{ id }}" aria-label="{{ ariaLabel }}" style="scroll-margin-top: 1.6rem; box-sizing: border-box; padding: {{ pad }}; background: var(--surface); display: flex; flex-direction: column; row-gap: 1.2rem">
  <dc-import name="Heading" level="{{ 2 }}" varian="polos" font="var(--font-rv-judul)" kapital="{{ kapital }}" ukuran="var(--teks-page)" tinggi="var(--tinggi-artikel)" bobot="var(--bobot-bold)" renggang="0" rata="center" warna="var(--ink)" baris="{{ judul }}" hint-size="100%,7rem"></dc-import>
  <p style="margin: 0; font-size: var(--teks-seksi); line-height: var(--tinggi-baca); text-align: center; color: var(--ink-2)">{{ teks }}</p>
  <div style="margin-top: {{ atasRail }}"><dc-import name="CourseRail" jenis="{{ jenisRail }}" susun="{{ susun }}" pad="{{ padRail }}" ujung="{{ ujung }}" labelUjung="{{ labelUjung }}" onUjung="{{ onUjung }}" butir="{{ butir }}" hint-size="100%,44rem"></dc-import></div>
  <sc-if value="{{ adaSemua }}" hint-placeholder-val="{{ false }}"><dc-import name="Button" variant="teks-panah" gayaTambah="margin-top: 0.8rem" href="" label="{{ labelSemua }}" ikon="panah-pil" ikonUkuran="{{ 16 }}" ikonGaris="{{ 2.4 }}" ikonPosisi="akhir" onPress="{{ onUjung }}" hint-size="12rem,4.4rem"></dc-import></sc-if>
  <sc-if value="{{ adaTutup }}" hint-placeholder-val="{{ false }}"><dc-import name="Button" variant="lebar-garis" sudut="var(--pill)" href="" label="{{ labelTutup }}" onPress="{{ onTutup }}" hint-size="100%,4.8rem"></dc-import></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"id":{"editor":"text","default":"","section":"Tautan"},"ariaLabel":{"editor":"text","default":"Materi","section":"Aksesibilitas"},"pad":{"editor":"text","default":"4rem var(--talang) 3.2rem var(--talang)","section":"Tata letak"},"judulAwal":{"editor":"text","default":"Bedah Detail","section":"Isi"},"judulMerah":{"editor":"text","default":"Spesifikasi Material","section":"Isi"},"teks":{"editor":"text","default":"Pahami baja dari awal, lalu kenali kelebihan setiap material.","section":"Isi"},"terbuka":{"editor":"boolean","default":false,"section":"Resep"},"katalog":{"editor":"boolean","default":false,"section":"Resep"},"produk":{"editor":"boolean","default":false,"section":"Resep"},"judulBaris":{"editor":"boolean","default":false,"section":"Resep"},"labelSemua":{"editor":"text","default":"Lihat Semua","section":"Isi"},"labelUjung":{"editor":"text","default":"Lihat Semua","section":"Isi"},"labelTutup":{"editor":"text","default":"Tampilkan lebih sedikit","section":"Isi"},"onUjung":{"editor":null,"section":"Aksi"},"onTutup":{"editor":null,"section":"Aksi"},"butir":{"editor":null,"section":"Data","tsType":"Array<CourseCard props>"},"$preview":{"width":360,"height":620}}'>
class Component extends DCLogic {
renderVals() {
    const p = this.props;
    const produk = !!p.produk;
    const katalog = !!p.katalog;
    const buka = !!p.terbuka && !katalog && !produk;
    return {
      id: p.id || undefined,
      ariaLabel: p.ariaLabel ?? 'Materi',
      pad: p.pad ?? '4rem var(--talang) 3.2rem var(--talang)',
      kapital: p.judulBaris ? 'tidak' : 'ya',
      judul: [{ teks: p.judulAwal ?? 'Bedah Detail', sebaris: !p.judulBaris }, { teks: p.judulMerah ?? 'Spesifikasi Material', sebaris: !p.judulBaris, warna: 'var(--brand)' }],
      teks: p.teks ?? 'Pahami baja dari awal, lalu kenali kelebihan setiap material.',
      susun: produk ? 'produk' : katalog ? 'katalog' : buka ? 'kolom' : 'geser',
      jenisRail: produk ? 'produk' : katalog ? 'baris' : 'rv',
      atasRail: katalog ? '0.5rem' : '1.2rem',
      adaSemua: !!p.onUjung && produk,
      labelSemua: p.labelSemua ?? 'Lihat Semua',
      padRail: (katalog || produk) ? undefined : buka ? '0.4rem 0 1.6rem 0' : '0.4rem var(--talang) 1.6rem var(--talang)',
      ujung: !buka && !katalog && !produk,
      labelUjung: p.labelUjung ?? 'Lihat Semua',
      onUjung: p.onUjung,
      adaTutup: buka,
      labelTutup: p.labelTutup ?? 'Tampilkan lebih sedikit',
      onTutup: p.onTutup,
      butir: p.butir
    };
  }
}
</script>
</body>
</html>
