<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Detail SKU — Besi Hollow Hitam 40 × 40 × 2 mm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap">
<link rel="stylesheet" href="tokens.css">
</helmet>
<div style="width: 36rem; max-width: 100%; margin: 0 auto; box-sizing: border-box; min-height: 100vh; position: relative; background: var(--surface)">
  <div>
    <dc-import name="SiteHeader" tata="ponsel" logoTengah="{{ true }}" sisiPonsel="1.6rem" hint-size="100%,5.6rem"></dc-import>
    <div id="s-ringkas">
      <dc-import name="ProductSummary" tata="ponsel" halaman="sku" varian="lama" hint-size="100%,60rem"></dc-import>
      <dc-import name="ProductInfo" varian="lama" hint-size="100%,100rem"></dc-import>
    </div>
    <div id="s-lain" style="scroll-margin-top: 9.2rem; margin-top: 3.6rem; padding: 0 0 0 1.6rem">
      <dc-import name="Heading" level="{{ 2 }}" varian="lama" tata="ponsel" teks="Ukuran lainnya" hint-size="100%,2.7rem"></dc-import>
      <dc-import name="Rail" koleksi="lain-lama" panah="ponsel" lebar="52%" gutter="0.6rem" pad="1.6rem 1.6rem 0.2rem 0" hint-size="100%,26rem"></dc-import>
    </div>
    <div id="s-faq" style="scroll-margin-top: 9.2rem; margin-top: 3.6rem; padding: 0 1.6rem">
      <dc-import name="FaqList" tata="ponsel" halaman="sku" varian="lama" hint-size="100%,42rem"></dc-import>
    </div>
    <div id="s-ulasan" style="scroll-margin-top: 9.2rem; position: relative; margin-top: 3.6rem; padding: 0 1.6rem 0 1.6rem">
      <dc-import name="Heading" level="{{ 2 }}" varian="lama" tata="ponsel" teks="Ulasan pelanggan" href="UlasanM3.dc.html" ariaLabel="Ulasan pelanggan, buka semua ulasan" hint-size="100%,4.4rem"></dc-import>
      <div style="margin-top: 1.2rem">
        <dc-import name="ReviewCarousel" koleksi="produk" tata="ponsel" lebarTitik="4.4rem" hint-size="100%,28rem"></dc-import>
      </div>
    </div>
    <div style="margin-top: 3.6rem">
      <dc-import name="Footer" tata="ponsel" jenis="ringkas" padAtas="2.8rem" sisiPonsel="1.6rem" jarakTautan="2.2rem" jarakBaris="- - - 2.4rem" hint-size="100%,36rem"></dc-import>
    </div>
  </div>
  <dc-import name="ProductChrome" jenis="sku-lama" hint-size="0,0"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
