<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>SearchRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<button type="button" onClick="{{ onPress }}" style="display: flex; align-items: center; row-gap: var(--rapat); column-gap: 0; width: 100%; min-height: 5.6rem; box-sizing: border-box; padding: 0.6rem 0; text-align: left">
  <sc-if value="{{ adaGambar }}" hint-placeholder-val="{{ true }}">
    <img src="{{ gambar }}" alt="" style="width: 4.4rem; height: 4.4rem; border-radius: {{ sudut }}; object-fit: cover; background: var(--line); flex-shrink: 0; margin-right: calc(var(--rapat) / 2)">
  </sc-if>
  <sc-if value="{{ tanpaGambar }}" hint-placeholder-val="{{ false }}">
    <span style="width: 4.4rem; height: 4.4rem; border-radius: {{ sudut }}; background: var(--line); display: grid; place-items: center; flex-shrink: 0; margin-right: calc(var(--rapat) / 2)"><dc-import name="Icon" ikon="kartu-bayar" hint-size="1.9rem,1.9rem"></dc-import></span>
  </sc-if>
  <span style="min-width: 0; flex-grow: 1; margin-left: calc(var(--rapat) / 2); margin-right: calc(var(--rapat) / 2)">
    <span style="{{ judulGaya }}">{{ judul }}</span>
    <span style="display: block; font-size: var(--teks-meta); color: var(--ink-2)">{{ sub }}</span>
  </span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"judul":{"editor":null},"sub":{"editor":null},"gambar":{"editor":null},"warnaJudul":{"editor":null},"barisRapat":{"editor":"boolean","default":false},"onPress":{"editor":null},"sudut":{"editor":null},"$preview":{"width":328,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const gambar = this.props.gambar ?? (this.props.judul === undefined ? '/_blob/928b84bafaf16246170e60dc1a770fc0' : '');
    const warna = this.props.warnaJudul ?? (this.props.judul === undefined ? 'var(--produk-nama)' : undefined);
    return {
      judul: this.props.judul ?? 'Besi Hollow Hitam',
      sub: this.props.sub ?? '297 SKU',
      gambar,
      adaGambar: !!gambar,
      tanpaGambar: !gambar,
      onPress: this.props.onPress,
      sudut: this.props.sudut ?? 'var(--tile)',
      judulGaya: 'display: block; font-size: var(--teks-body); font-weight: var(--bobot-semibold)' + (this.props.barisRapat ? '; line-height: var(--tinggi-tengah)' : '') + (warna ? '; color: ' + warna : '')
    };
  }
}
</script>
</body>
</html>
