<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>CategoryNav</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<div style="position: sticky; top: 7.2rem; z-index: 35; box-sizing: border-box; min-height: 5.2rem; padding: 0 12rem; background: var(--surface); box-shadow: inset 0 -0.1rem 0 var(--line); display: flex; align-items: center; row-gap: 2.4rem; column-gap: 0">
  <nav aria-label="{{ ariaLabel }}" style="min-width: 0; flex-grow: 1; display: flex; align-items: center; row-gap: 1.6rem; column-gap: 0; margin-right: 1.2rem">
    <span style="display: flex; flex-shrink: 0; margin-right: 0.8rem"><dc-import name="Button" dc-props="{{ produkProps }}" hint-size="10rem,4.4rem"></dc-import></span>
    <span aria-hidden="true" style="flex-shrink: 0; width: 0.1rem; height: 2rem; background: var(--line); margin-left: 0.8rem; margin-right: 0.8rem"></span>
    <sc-for list="{{ tautan }}" as="t" hint-placeholder-count="7">
      <span style="display: flex; flex-shrink: 0; margin-left: 0.8rem; margin-right: 0.8rem"><dc-import name="Button" dc-props="{{ t }}" hint-size="9rem,4.4rem"></dc-import></span>
    </sc-for>
  </nav>
  <sc-if value="{{ teleponTampil }}" hint-placeholder-val="{{ false }}">
    <div style="flex-shrink: 0; display: flex; align-items: center; row-gap: 1rem; column-gap: 0; margin-left: 1.2rem; margin-right: 1.2rem">
      <span style="font-size: var(--teks-meta); color: var(--ink-2); white-space: nowrap; margin-right: 0.5rem">{{ teleponLabel }}</span>
      <span style="display: flex; margin-left: 0.5rem; margin-right: 0.5rem"><dc-import name="Button" variant="nav-telepon" ikon="telepon-garis" label="{{ telepon }}" href="{{ teleponHref }}" hint-size="16rem,4.4rem"></dc-import></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ariaLabel":{"editor":null},"produk":{"editor":null},"tautan":{"editor":null},"teleponTampil":{"editor":"boolean","default":false},"teleponLabel":{"editor":null},"telepon":{"editor":null},"$preview":{"width":1440,"height":52}}'>
class Component extends DCLogic {
  renderVals() {
    const produk = this.props.produk ?? { label: 'Semua Produk', href: '#', ikon: 'kotak' };
    const tautan = this.props.tautan ?? ['Besi Hollow Hitam', 'Besi H Beam', 'Besi WF', 'Besi Beton', 'Pipa Galvanis', 'Besi Siku', 'Plat Besi Hitam'].map((label) => ({ label, href: '#' }));
    const telepon = this.props.telepon ?? '+628112689889';
    return {
      ariaLabel: this.props.ariaLabel ?? 'Kategori produk',
      produkProps: { variant: 'nav-produk', label: produk.label, href: produk.href ?? '#', ikon: produk.ikon },
      tautan: tautan.map((t) => ({ variant: 'nav-teks', label: t.label, href: t.href ?? '#' })),
      teleponTampil: !!this.props.teleponTampil,
      teleponLabel: this.props.teleponLabel ?? 'Hubungi Sekarang!',
      telepon,
      teleponHref: 'tel:' + telepon
    };
  }
}
</script>
</body>
</html>
