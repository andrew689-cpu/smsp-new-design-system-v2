<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>SiteHeader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<sc-if value="{{ isPonsel }}" hint-placeholder-val="{{ true }}">
  <header style="display: flex; align-items: center; justify-content: space-between; row-gap: var(--rapat); column-gap: 0; height: 5.6rem; box-sizing: border-box; padding: 0 {{ sisiPonsel }}; background: {{ dasar }}">
    <span style="display: flex; margin-right: calc(var(--rapat) / 2)"><dc-import name="Logo" tata="ponsel" tengah="{{ logoTengah }}" warna="{{ warnaLogo }}" href="{{ hrefLogo }}" hint-size="10.2rem,4.4rem"></dc-import></span>
    <div style="flex-shrink: 0; display: flex; align-items: center; margin-left: calc(var(--rapat) / 2); margin-right: calc(var(--rapat) / 2)">
      <sc-if value="{{ teleponTampil }}" hint-placeholder-val="{{ false }}">
        <a href="{{ teleponHref }}" aria-label="{{ teleponAria }}" style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; color: var(--ink)">
          <sc-if value="{{ labelTeleponTampil }}" hint-placeholder-val="{{ false }}">
            <span style="font-size: var(--teks-micro); line-height: var(--tinggi-rapat); font-weight: var(--bobot-bold); color: var(--ink-2); white-space: nowrap">{{ teleponLabel }}</span>
          </sc-if>
          <span style="display: flex; align-items: center; row-gap: 0.5rem; column-gap: 0">
            <span style="display: flex; flex-shrink: 0; margin-right: 0.25rem"><dc-import name="Icon" ikon="telepon" hint-size="1.6rem,1.6rem"></dc-import></span>
            <span style="margin-top: 0.2rem; font-size: var(--teks-chip); font-weight: var(--bobot-bold); white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--brand); margin-left: 0.25rem; margin-right: 0.25rem">{{ telepon }}</span>
          </span>
        </a>
      </sc-if>
      <span style="display: flex; flex-shrink: 0; margin-right: -1.3rem"><dc-import name="IconButton" ikon="menu" ukuran="{{ 44 }}" ikonWarna="{{ warnaMenu }}" ariaLabel="Opsi lainnya" onPress="{{ onMenu }}" hint-size="4.4rem,4.4rem"></dc-import></span>
    </div>
  </header>
</sc-if>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
  <header style="position: sticky; top: 0; z-index: 40; box-sizing: border-box; height: 7.2rem; padding: 0 12rem; background: var(--surface); display: flex; align-items: center; row-gap: 2.4rem; column-gap: 0">
    <span style="display: flex; flex-shrink: 0; margin-right: 1.2rem"><dc-import name="Logo" tata="desktop" href="{{ hrefLogo }}" hint-size="15rem,4.4rem"></dc-import></span>
    <button type="button" aria-label="Buka kategori produk" onClick="{{ onKategori }}" style="flex-shrink: 0; display: inline-flex; align-items: center; row-gap: 1rem; column-gap: 0.5rem; min-height: 4.4rem; padding: 0; font-size: var(--teks-body); font-weight: var(--bobot-semibold); color: var(--ink); margin-left: 1.2rem; margin-right: 1.2rem">
      <span aria-hidden="true" style="width: 3.6rem; height: 3.6rem; flex-shrink: 0; display: grid; place-items: center; margin-right: 0.5rem"><dc-import name="Icon" ikon="kategori" hint-size="2rem,2rem"></dc-import></span>
      Kategori
    </button>
    <span style="flex-grow: 1; min-width: 0; display: flex; margin-left: 1.2rem; margin-right: 1.2rem"><dc-import name="SearchField" dc-props="{{ cariProps }}" hint-size="100%,4.6rem"></dc-import></span>
    <sc-if value="{{ menuTampil }}" hint-placeholder-val="{{ false }}">
      <button type="button" aria-label="Buka menu" onClick="{{ onMenu }}" style="flex-shrink: 0; width: 4.4rem; height: 4.4rem; border-radius: var(--tile); display: grid; place-items: center; margin-left: 1.2rem; margin-right: 1.2rem">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display: block"><path fill="var(--ink)" fill-rule="evenodd" clip-rule="evenodd" d="M20.75 7a.75.75 0 01-.75.75H4a.75.75 0 010-1.5h16a.75.75 0 01.75.75zM20.75 12a.75.75 0 01-.75.75H4a.75.75 0 010-1.5h16a.75.75 0 01.75.75zM20.75 17a.75.75 0 01-.75.75H4a.75.75 0 010-1.5h16a.75.75 0 01.75.75z"></path></svg>
      </button>
    </sc-if>
  </header>
  <sc-if value="{{ navTampil }}" hint-placeholder-val="{{ true }}">
    <dc-import name="CategoryNav" dc-props="{{ navProps }}" hint-size="100%,5.2rem"></dc-import>
  </sc-if>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tata":{"editor":"enum","options":["ponsel","desktop"],"default":"ponsel"},"nada":{"editor":"enum","options":["surface","merah"],"default":"surface"},"menuTampil":{"editor":"boolean","default":false},"navTampil":{"editor":"boolean","default":true},"teleponTampil":{"editor":"boolean","default":false},"labelTeleponTampil":{"editor":"boolean","default":false},"hrefLogo":{"editor":null},"sisiPonsel":{"editor":null},"nilai":{"editor":null},"placeholder":{"editor":null},"telepon":{"editor":null},"teleponLabel":{"editor":null},"navAria":{"editor":null},"navProduk":{"editor":null},"navTautan":{"editor":null},"onMenu":{"editor":null},"onKategori":{"editor":null},"onUbah":{"editor":null},"onCari":{"editor":null},"logoTengah":{"editor":"boolean","default":false},"$preview":{"width":360,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const tata = this.props.tata ?? 'ponsel';
    const merah = this.props.nada === 'merah';
    const telepon = this.props.telepon ?? '+628112689889';
    const teleponTampil = !!this.props.teleponTampil;
    const cariProps = { tata: 'header', placeholder: this.props.placeholder ?? 'Cari produk, ukuran, atau info', onUbah: this.props.onUbah, onCari: this.props.onCari };
    if (this.props.nilai !== undefined) cariProps.nilai = this.props.nilai;
    return {
      isPonsel: tata !== 'desktop',
      logoTengah: !!this.props.logoTengah,
      sisiPonsel: this.props.sisiPonsel ?? 'var(--sisi)',
      isDesktop: tata === 'desktop',
      dasar: merah ? 'var(--merah-artikel)' : 'var(--surface)',
      warnaLogo: merah ? 'var(--surface)' : 'var(--brand-hero)',
      warnaMenu: merah ? 'var(--surface)' : 'var(--ink)',
      hrefLogo: this.props.hrefLogo ?? '#',
      menuTampil: !!this.props.menuTampil,
      navTampil: this.props.navTampil ?? true,
      teleponTampil,
      labelTeleponTampil: !!this.props.labelTeleponTampil,
      telepon,
      teleponHref: 'tel:' + telepon,
      teleponAria: 'Telepon +62 811-2689-889',
      teleponLabel: this.props.teleponLabel ?? 'Hubungi Sekarang!',
      cariProps,
      navProps: { ariaLabel: this.props.navAria, produk: this.props.navProduk, tautan: this.props.navTautan, teleponTampil, telepon, teleponLabel: this.props.teleponLabel },
      onMenu: this.props.onMenu,
      onKategori: this.props.onKategori
    };
  }
}
</script>
</body>
</html>
