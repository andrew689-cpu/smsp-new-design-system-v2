<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>FilterPanel</title>
<script src="./support.js"></script>
</head>

<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>

        </div>
      </sc-if>

          <sc-for list="{{ ubinTebalM }}" as="c" hint-placeholder-count="8">

        </div>
      </sc-if>

      </sc-if>
    </div>
    <div>
      <p style="margin: 0 0 0.2rem 0; font-size: var(--teks-subhead); font-weight: var(--bobot-bold)">Tebal dinding (t)</p>

        <p style="margin: 0; font-size: var(--teks-meta); color: var(--ink-2)">mm</p>
      </sc-if>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 0; column-gap: 0; margin-top: 1rem">
        <sc-for list="{{ ubinTebalD }}" as="t" hint-placeholder-count="8">

      </sc-if>
    </div>
    <sc-if value="{{ urutTampil }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SortMenu" jenis="inline" tata="desktop" urut="{{ urut }}" onPilih="{{ onUrut }}" hint-size="100%,20rem"></dc-import>
    </sc-if>
  </aside>
</sc-if>
</x-dc>

      };
    });
    const chipD = ukuran.map((v) => ({ label: v + ' mm', aria: 'Hapus filter ukuran ' + v, buang: () => setTerpasang(ukuran.filter((x) => x !== v), tebal) }))
      .concat(tebal.map((v) => ({ label: 'Tebal ' + v + ' mm', aria: 'Hapus filter tebal ' + v, buang: () => setTerpasang(ukuran, tebal.filter((x) => x !== v)) })))
      .map((c, i) => Object.assign(c, { gaya: 'display: flex; margin-right: 0.4rem' + (i === 0 ? '' : '; margin-left: 0.4rem') }));
    const tutupDialog = () => {
      if (this.props.terbuka === undefined) this.setState({ terbuka: false });
      this.setState({ drafU: ukuran, drafT: tebal });
      if (this.props.onTutup) this.props.onTutup();
    };
    return {
      dialogTampil: !d && terbuka,
      isDesktop: d,
      judul: this.props.judul ?? 'Filter Besi Hollow Hitam',
      tutup: tutupDialog,
      labelSeg: s.seg === 'tebal' ? 'Tebal dinding' : 'Ukuran penampang',
      isUkuran: s.seg === 'ukuran',
      isTebal: s.seg === 'tebal',
      ubinUkuranM: d ? [] : ubinM(UK, 'uk', 3),
      ubinTebalM: d ? [] : ubinM(TB, 'tb', 4),
      adaDraf,
      chipM,
      seg: [{ id: 'ukuran', label: 'Ukuran', n: uD.length }, { id: 'tebal', label: 'Tebal', n: tD.length }],
      segKini: s.seg,
      pilihSeg: (id) => this.setState({ seg: id }),
      bersih: !adaDraf && !adaUrut,
      reset: () => {
        this.setState({ drafU: [], drafT: [] });
        if (this.props.onReset) this.props.onReset();
      },
      labelTerap: nDraf === 0 ? 'Tidak ada SKU yang cocok' : 'Terapkan',
      nol: nDraf === 0,
      terap: () => {
        if (nDraf === 0) return;
        if (this.props.ukuran === undefined) this.setState({ ukuran: uD, tebal: tD });
        if (this.props.terbuka === undefined) this.setState({ terbuka: false });
        if (this.props.onTerap) this.props.onTerap({ ukuran: uD, tebal: tD });
      },
      adaFilter: !!(ukuran.length || tebal.length),
      chipD,
      hapusSemua: () => setTerpasang([], []),
      satuan: !!this.props.satuanTampil,
      ubinUkuranD: d ? ubinD(ukTutup ? UK.slice(0, FOLD) : UK, 'uk') : [],
      ukuranLagi: UK.length > FOLD,
      ukuranExp: ukTutup ? 'false' : 'true',
      ukuranTerbuka: !ukTutup,
      ukuranLabel: ukTutup ? 'Lihat ' + (UK.length - FOLD) + ' ukuran lainnya' : 'Lebih Sedikit',
      ukuranLagi2: this.props.lagiKecil ? 'var(--teks-meta)' : undefined,
      ukuranTogel: () => this.setState({ ukuranBuka: !s.ukuranBuka }),
      ubinTebalD: d ? ubinD(tbTutup ? TB.slice(0, FOLD) : TB, 'tb') : [],
      tebalLagi: TB.length > FOLD,
      tebalExp: tbTutup ? 'false' : 'true',
      tebalTerbuka: !tbTutup,
      tebalLabel: tbTutup ? 'Lihat ' + (TB.length - FOLD) + ' tebal lainnya' : 'Lebih Sedikit',
      tebalTogel: () => this.setState({ tebalBuka: !s.tebalBuka }),
      urutTampil: !!this.props.urutTampil,
      urut: this.props.urut ?? 'populer',
      onUrut: this.props.onUrut
    };
  }
}
</script>
</body>
</html>
