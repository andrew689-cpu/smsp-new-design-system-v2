<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Segmented</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<sc-if value="{{ isIkon }}" hint-placeholder-val="{{ true }}">
  <div role="group" aria-label="{{ ariaLabel }}" style="{{ wadahIkon }}">
    <span data-seg-thumb="1" aria-hidden="true" style="{{ jempol }}"></span>
    <sc-for list="{{ opsi }}" as="o" hint-placeholder-count="2">
      <button type="button" onClick="{{ o.pilih }}" aria-pressed="{{ o.tekan }}" aria-label="{{ o.label }}" style="{{ o.gaya }}"><dc-import name="Icon" dc-props="{{ o.ikonProps }}" hint-size="2.4rem,2.4rem"></dc-import></button>
    </sc-for>
  </div>
</sc-if>
<sc-if value="{{ isTeks }}" hint-placeholder-val="{{ false }}">
  <div role="tablist" aria-label="{{ ariaLabel }}" style="position: relative; overflow: hidden; flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; padding: 0.3rem; box-sizing: border-box; background: var(--surface); box-shadow: var(--seg-lekuk); border-radius: var(--action)">
    <span data-seg-thumb="1" aria-hidden="true" style="{{ jempol }}"></span>
    <sc-for list="{{ opsi }}" as="o" hint-placeholder-count="2">
      <button type="button" role="tab" aria-selected="{{ o.tekan }}" onClick="{{ o.pilih }}" style="{{ o.gaya }}">
        {{ o.label }}
        <sc-if value="{{ o.adaN }}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-shrink: 0; margin: 0 0.25rem"><dc-import name="Tag" jenis="lencana" teks="{{ o.n }}" hint-size="1.8rem,1.8rem"></dc-import></span></sc-if>
      </button>
    </sc-for>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"jenis":{"editor":"enum","options":["ikon","teks"],"default":"ikon"},"tata":{"editor":"enum","options":["ponsel","desktop"],"default":"ponsel"},"opsi":{"editor":null},"nilai":{"editor":null},"onPilih":{"editor":null},"ariaLabel":{"editor":null,"default":"Tampilan daftar harga"},"$preview":{"width":200,"height":44}}'>
class Component extends DCLogic {
  state = {};
  renderVals() {
    const jenis = this.props.jenis ?? 'ikon';
    const desktop = this.props.tata === 'desktop';
    const bawaan = jenis === 'ikon'
      ? [{ id: 'tabel', ikon: 'tabel', label: 'Tampilan daftar' }, { id: 'kartu', ikon: 'kartu', label: 'Tampilan kartu' }]
      : [{ id: 'ukuran', label: 'Ukuran', n: 0 }, { id: 'tebal', label: 'Tebal', n: 0 }];
    const daftar = this.props.opsi ?? bawaan;
    const kini = this.props.nilai ?? this.state.pilih ?? daftar[0].id;
    const ke = daftar.findIndex((o) => o.id === kini) === 1;
    const opsi = daftar.map((o, i) => {
      const on = o.id === kini;
      const warnaOn = desktop ? 'var(--nav-aktif)' : 'var(--ink)';
      const gaya = jenis === 'ikon'
        ? 'background: transparent; color: ' + (on ? warnaOn : 'var(--ink-2)') + '; position: relative; z-index: 1; width: 3.4rem; height: 3.4rem; border: 0; border-radius: var(--action); display: grid; place-items: center; margin-left: 0.1rem; margin-right: 0.1rem'
        : 'background: transparent; color: ' + (on ? 'var(--ink)' : 'var(--ink-2)') + '; font-weight: ' + (on ? 'var(--bobot-bold)' : 'var(--bobot-semibold)') + '; font-size: ' + (on ? 'var(--teks-body)' : 'var(--teks-meta)') + '; position: relative; z-index: 1; height: 3.2rem; border-radius: var(--action); display: flex; align-items: center; justify-content: center; column-gap: 0.25rem; margin: ' + (i === 0 ? '0 0 0 0.1rem' : '0.1rem 0.1rem 0 0');
      return {
        label: o.label,
        n: String(o.n ?? ''),
        adaN: !!o.n,
        tekan: on ? 'true' : 'false',
        gaya,
        ikonProps: { ikon: o.ikon, ukuran: on ? 24 : 16, warna: 'currentColor', garis: 1.75 },
        pilih: () => {
          this.setState({ pilih: o.id });
          if (this.props.onPilih) this.props.onPilih(o.id);
        }
      };
    });
    const jempolIkon = desktop
      ? 'position: absolute; top: 0.3rem; bottom: 0.3rem; left: 0.3rem; width: 3.4rem; border-radius: calc(var(--action) - 0.1rem); background: var(--surface); transition: transform 220ms var(--ease-keluar); pointer-events: none; transform: translateX(' + (ke ? 36 : 0) + 'px); margin-right: 0.1rem'
      : 'position: absolute; top: 0.5rem; bottom: 0.5rem; left: 0.5rem; width: 3rem; border-radius: calc(var(--action) - 0.1rem); background: var(--line); transition: transform 220ms var(--ease-keluar); pointer-events: none; transform: translateX(' + (ke ? 36 : 0) + 'px); margin-right: 0.1rem';
    const jempolTeks = 'position: absolute; z-index: 0; left: 0.5rem; top: 0.5rem; bottom: 0.5rem; width: calc((100% - 1.6rem) / 2); border-radius: calc(var(--action) - 0.1rem); background: var(--line); pointer-events: none; transform: translateX(' + (ke ? 'calc(100% + 0.6rem)' : '0') + '); margin: 0 0.1rem 0.1rem 0';
    return {
      isIkon: jenis === 'ikon',
      isTeks: jenis === 'teks',
      ariaLabel: this.props.ariaLabel ?? 'Tampilan daftar harga',
      opsi,
      jempol: jenis === 'ikon' ? jempolIkon : jempolTeks,
      wadahIkon: 'position: relative; overflow: hidden; display: inline-flex; column-gap: 0; flex-shrink: 0; box-sizing: border-box; padding: 0.3rem; border-radius: var(--action); ' + (desktop ? 'background: var(--line); -webkit-backdrop-filter: var(--cair-blur); backdrop-filter: var(--cair-blur); box-shadow: var(--cair-rim)' : 'background: var(--surface); box-shadow: var(--seg-lekuk)')
    };
  }
}
</script>
</body>
</html>
