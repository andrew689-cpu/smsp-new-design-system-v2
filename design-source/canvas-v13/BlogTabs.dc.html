<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>BlogTabs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<sc-if value="{{ isLembar }}" hint-placeholder-val="{{ true }}">
  <div style="box-sizing: border-box; padding: var(--dalam) var(--talang) 0 var(--talang); border-radius: 2.8rem 2.8rem 0 0; background: var(--surface); box-shadow: none; display: flex; flex-direction: column; align-items: stretch; row-gap: var(--dalam); column-gap: 0">
    <span style="flex-shrink: 0; min-width: 0; display: flex; flex-direction: column; row-gap: 0.4rem; column-gap: 0">
      <span style="font-size: var(--teks-section); line-height: var(--tinggi-artikel); font-weight: var(--bobot-bold); color: var(--ink)">{{ judul }}</span>
      <span style="font-size: var(--teks-meta); line-height: var(--tinggi-sedang); font-weight: var(--bobot-regular); color: var(--ink-2)">{{ sub }}</span>
    </span>
    <div role="group" aria-label="{{ ariaLabel }}" style="box-sizing: border-box; flex: 1 1 auto; min-width: 0; display: flex; align-items: stretch; justify-content: space-between; column-gap: var(--rapat); row-gap: 0; padding: 0; border-bottom: 0.1rem solid var(--line)">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{ t.pilih }}" aria-current="{{ t.kini }}" style="box-sizing: border-box; flex: 0 1 auto; min-width: 0; min-height: 4.4rem; display: inline-flex; align-items: center; justify-content: center; padding: 0 0 1rem 0; margin-bottom: -0.1rem; border: 0; border-bottom: 0.3rem solid transparent; background: transparent; font-size: var(--teks-body); line-height: var(--tinggi-tengah); text-align: center; white-space: nowrap; {{ t.gaya }}">{{ t.label }}</button>
      </sc-for>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isPita }}" hint-placeholder-val="{{ false }}">
  <nav aria-label="{{ ariaLabel }}" style="box-sizing: border-box; background: var(--merah-artikel); border-bottom: 0.1rem solid var(--blog-hero-panah)">
    <ul style="list-style: none; margin: 0; padding: 0 var(--talang); display: flex; align-items: stretch; column-gap: var(--dalam); row-gap: 0; overflow-x: auto; scrollbar-width: none">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
        <li style="flex-shrink: 0; display: flex">
          <button type="button" onClick="{{ t.pilih }}" aria-current="{{ t.kini }}" style="min-height: 4.4rem; padding: 0; border: 0; background: transparent; display: inline-flex; align-items: center; font-size: var(--teks-meta); line-height: var(--tinggi-tengah); color: var(--surface); white-space: nowrap; {{ t.gaya }}">{{ t.label }}</button>
        </li>
      </sc-for>
    </ul>
  </nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"jenis":{"editor":"enum","options":["lembar","pita"],"default":"lembar"},"judul":{"editor":null},"sub":{"editor":null},"butir":{"editor":null,"tsType":"Array<{id:number,label:string}>"},"nilai":{"editor":null},"onPilih":{"editor":null},"ariaLabel":{"editor":null},"$preview":{"width":360,"height":130}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const pita = p.jenis === 'pita';
    const butir = p.butir ?? [{ label: 'Semua', kini: true }, { label: 'Berita Baja' }, { label: 'Industri' }, { label: 'Edukasi' }];
    return {
      isLembar: !pita,
      isPita: pita,
      judul: p.judul ?? 'Topik Artikel',
      sub: p.sub ?? 'Temukan informasi berdasarkan kategori',
      ariaLabel: p.ariaLabel ?? 'Kategori artikel',
      tabs: butir.map((b) => ({
        label: b.label,
        pilih: b.pilih,
        kini: b.kini ? 'true' : 'false',
        gaya: pita
          ? (b.kini ? 'font-weight: var(--bobot-semibold); text-decoration: underline; text-decoration-thickness: 0.2rem; text-underline-offset: 0.6rem' : 'font-weight: var(--bobot-semibold)')
          : (b.kini ? 'color: var(--brand); font-weight: var(--bobot-bold); border-bottom-color: var(--brand)' : 'color: var(--ink); font-weight: var(--bobot-regular); border-bottom-color: transparent')
      }))
    };
  }
}
</script>
</body>
</html>
