      ['Apa perbedaan utama besi hollow hitam, galvanis, dan galvalum?', '', [
        ['Besi Hollow Hitam', 'Dibuat dari baja polos tanpa lapisan seng dengan panjang standar 6 meter. Ketahanan terhadap karat tergolong rendah sehingga membutuhkan lapisan cat dasar, membuat jenis ini lebih ideal digunakan untuk area interior, pembuatan furnitur, dan struktur umum.'],

      ['Apakah besi hollow hitam tahan karat dan apakah perlu dicat dasar?', ['Besi hollow hitam tidak tahan karat secara alami karena terbuat dari pelat baja karbon tanpa lapisan seng (non-galvanized). Untuk penggunaan luar ruangan (outdoor), permukaan besi hollow hitam wajib dibersihkan dari minyak/kerak pabrik, lalu dilapisi cat dasar anti-karat (primer epoxy) sebelum diaplikasikan cat akhir (finishing) agar ', 'terhindar dari korosi', 'https://www.smsperkasa.com/blog/cara-mencegah-korosi-mulai-dari-diy-hingga-solusi-industri', ' jangka panjang.']],
      ['Bagaimana tahapan pembersihan dan pengecatan besi hollow hitam agar cat anti-karat tidak mudah mengelupas?', 'Tahapan pengecatan besi hollow hitam wajib diawali dengan membersihkan lapisan minyak pabrik (milling oil) menggunakan kain yang dibasahi thiner atau cairan degreaser hingga permukaan benar-benar kering dan bebas lemak. Setelah minyak bersih, gosok ringan permukaan besi menggunakan amplas halus untuk menciptakan tekstur cengkeram (keying), lalu lapiskan cat dasar anti-karat (primer epoxy atau zinc chromate) sebagai benteng pelindung utama dari korosi. Setelah lapisan cat dasar kering sempurna (sekitar 12–24 jam), baru aplikasikan cat akhir (top coat) berbasis sintetis/alkyd agar lapisan cat merekat kuat dan tidak mudah mengelupas meskipun terpapar cuaca.'],
      ['Bagaimana teknik mengelas besi hollow hitam berdinding tipis agar tidak mudah bolong atau melengkung?', 'Mengelas besi hollow hitam berdinding tipis (ketebalan 0,8 mm hingga 1,2 mm) memerlukan pengaturan arus listrik (amperage) mesin las yang rendah, idealnya di kisaran 30 hingga 50 Ampere, dengan kawat las berdiameter kecil seperti ukuran 2,0 mm atau 2,6 mm. Pengelasan tidak boleh dilakukan secara terus-menerus dalam satu jalur (continuous bead), melainkan harus menggunakan teknik las titik (tack welding / las totol) yang diselingi jeda pendinginan guna mencegah panas berlebih (overheating) melubangi pelat besi. Selain itu, jepit sambungan besi hollow menggunakan klem penahan (C-clamp) pada meja kerja datar untuk mencegah perubahan bentuk (warping) akibat pemuaian panas.'],
