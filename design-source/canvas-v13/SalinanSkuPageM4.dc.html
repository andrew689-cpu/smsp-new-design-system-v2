      var ketemu = -1;
      for (var j = 0; j < sisa.length; j++) {
        if (sisa[j].indexOf(toks[i]) === 0) { ketemu = j; break; }
      }
      if (ketemu === -1) return false;
      sisa.splice(ketemu, 1);
    }
    return true;
  }

      marks.forEach(function (w) {
        var k = rest.indexOf(w);
        if (k !== -1 && (best === -1 || k < best)) { best = k; bestLen = w.length; }
      });
      if (best === -1) { hasil.push({ teks: rest }); break; }
      if (best > 0) hasil.push({ teks: rest.slice(0, best) });
      hasil.push({ teks: rest.slice(best, best + bestLen), tebal: true });
      rest = rest.slice(best + bestLen);
    }
    return hasil;
