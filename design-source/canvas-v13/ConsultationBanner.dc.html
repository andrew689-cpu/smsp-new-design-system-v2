<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>ConsultationBanner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; align-items: stretch; gap: 0; min-height: 14.8rem">
    <span style="flex-shrink: 0; width: 40%; align-self: stretch; border-radius: var(--card); overflow: hidden; background: var(--line); display: block">
      <img src="{{ foto }}" alt="{{ alt }}" loading="{{ muatM }}" style="width: 120%; height: 100%; margin-left: -20%; object-fit: cover; object-position: 50% 42%; display: block">
    </span>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: var(--rapat)">
      <p style="margin: 0; font-size: var(--teks-unit-lg); line-height: var(--tinggi-spanduk); font-weight: var(--bobot-bold); color: var(--ink); text-align: left; word-break: normal; -webkit-hyphens: none; hyphens: none">
        <sc-for list="{{ baris }}" as="b" hint-placeholder-count="3"><span style="display: block">{{ b }}</span></sc-for>
      </p>
      <dc-import name="Button" variant="kecil" label="{{ label }}" href="{{ href }}" hint-size="16rem,3rem"></dc-import>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isGambar }}" hint-placeholder-val="{{ false }}">
  <a href="{{ href }}" aria-label="{{ alt }}" style="display: block">
    <img src="{{ foto }}" alt="{{ alt }}" style="width: 100%; height: auto; display: block; border-radius: 0.5rem">
  </a>
</sc-if>
<sc-if value="{{ isStaf }}" hint-placeholder-val="{{ false }}">
  <a href="{{ href }}" style="{{ gayaStaf }}">
    <span style="flex: 0 0 13.4rem; box-sizing: border-box; padding-left: 1.4rem; align-self: flex-end; display: block">
      <img src="{{ foto }}" alt="{{ alt }}" loading="{{ muat }}" style="width: 100%; height: auto; display: block">
    </span>
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem 1.2rem">
      <div style="display: flex; flex-direction: column; gap: var(--jarak-y-dalam)">
        <p style="{{ gayaStafTeks }}"><sc-for list="{{ baris }}" as="b" hint-placeholder-count="1"><span style="display: block">{{ b }}</span></sc-for></p>
        <span style="align-self: flex-start; box-sizing: border-box; min-height: 2.6rem; padding: 0.4rem 1.5rem; border-radius: 0.2rem; background: var(--brand); color: var(--surface); font-size: var(--teks-meta); font-weight: var(--bobot-bold); line-height: var(--tinggi-sedang); text-align: center; display: flex; align-items: center; justify-content: center">{{ label }}</span>
      </div>
    </div>
    <sc-if value="{{ isGelap }}" hint-placeholder-val="{{ false }}">
      <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 2rem; background: var(--kons-tirai); pointer-events: none"></span>
    </sc-if>
  </a>
</sc-if>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
  <div style="display: flex; align-items: stretch; gap: 0; min-height: 18rem; border-radius: var(--quote); overflow: hidden">
    <span style="display: block; width: 34%; flex-shrink: 0; overflow: hidden">
      <img src="{{ foto }}" alt="{{ alt }}" loading="{{ muat }}" style="display: block; width: 100%; height: 100%; object-fit: cover">
    </span>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1.8rem; padding: 2.8rem 3.6rem">
      <p style="margin: 0; font-size: var(--teks-display); font-weight: var(--bobot-bold); color: var(--ink); line-height: var(--tinggi-sempit); word-break: normal; -webkit-hyphens: none; hyphens: none">
        <sc-for list="{{ baris }}" as="b" hint-placeholder-count="3"><span style="display: block">{{ b }}</span></sc-for>
      </p>
      <dc-import name="Button" variant="spanduk" label="{{ label }}" href="{{ href }}" hint-size="36rem,6rem"></dc-import>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tata":{"editor":"enum","options":["ponsel","desktop"],"default":"ponsel"},"rupa":{"editor":"enum","options":["bawaan","gambar","staf"],"default":"bawaan"},"nada":{"editor":"enum","options":["terang","gelap"],"default":"terang"},"baris":{"editor":null},"foto":{"editor":null},"alt":{"editor":null},"muat":{"editor":null,"default":"lazy"},"label":{"editor":null,"default":"Konsultasi Sekarang"},"href":{"editor":null,"default":"#whatsapp"},"$preview":{"width":330,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const tata = this.props.tata ?? 'ponsel';
    const rupa = this.props.rupa ?? 'bawaan';
    const gelap = this.props.nada === 'gelap';
    const b = this.props.baris ?? ['Cek ketersediaan stok', 'dan estimasi pengiriman', 'untuk proyekmu'];
    return {
      muatM: this.props.muat ?? 'lazy',
      isMobile: tata === 'ponsel' && rupa === 'bawaan',
      isDesktop: tata === 'desktop' && rupa === 'bawaan',
      isGambar: rupa === 'gambar',
      isStaf: rupa === 'staf',
      isGelap: gelap,
      gayaStaf: 'position: relative; box-sizing: border-box; display: flex; align-items: stretch; gap: 0; min-height: 20.1rem; overflow: hidden; text-decoration: none; ' + (gelap ? 'background: var(--kons-gelap); color: var(--surface)' : 'background: var(--surface); color: var(--ink)'),
      gayaStafTeks: 'margin: 0; font-size: var(--teks-spanduk-staf); line-height: var(--tinggi-baca); font-weight: var(--bobot-bold); color: ' + (gelap ? 'var(--surface)' : 'var(--ink)') + '; text-align: left; word-break: normal; -webkit-hyphens: none; hyphens: none',
      baris: Array.isArray(b) ? b : [b],
      foto: this.props.foto ?? '/_blob/70fa270c0d20fb5923a3557ecde3c3c4',
      alt: this.props.alt ?? 'Staf sales SMS Perkasa berambut panjang, berkaus merah bertuliskan SMS Perkasa Team, memberi salam dengan kedua telapak tangan dirapatkan',
      muat: this.props.muat ?? 'lazy',
      label: this.props.label ?? 'Konsultasi Sekarang',
      href: this.props.href ?? '#whatsapp'
    };
  }
}
</script>
</body>
</html>
