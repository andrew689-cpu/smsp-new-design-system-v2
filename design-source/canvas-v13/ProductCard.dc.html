    const isUjungLama = jenis === 'ujung-lama';
    const isKolom = !isBaris && !isUjung && !isPromo && !isUpvc && !isSkuLama && !isUjungLama;
    const adaUbin = jenis === 'indeks' || jenis === 'sku' || jenis === 'sku-rel';
    const adaSku = jenis === 'sku' || jenis === 'sku-rel';
    const hubungi = this.props.hubungi ?? '';
    return {
      isSkuLama,
      isUjungLama,
      altLama: this.props.alt ?? 'Besi hollow hitam berpenampang persegi, ujungnya terpotong rapi memperlihatkan rongga dan tebal dindingnya',
      unitLama: this.props.unit ?? '/btg',
      berat: this.props.berat ?? '',
      isKolom,
      isBaris,
      isUjung,
      isPromo,
      isUpvc,
      upvcUbin: rupa === 'polos',
      upvcKartu: rupa !== 'polos',
      dataHarga: rupa === 'merah' ? '1' : undefined,
      isGambar: isKolom && !adaUbin,
      isUbin: isKolom && adaUbin,
      adaFoto: !!foto,
      takFoto: !foto,
      foto,
      alt: this.props.alt ?? altBawaan[jenis],
      muat: jenis === 'terkait' ? undefined : 'lazy',
      nama,
      varian,
      angka,
      unit: this.props.unit ?? 'per batang',
      aria: this.props.aria,
      href: this.props.href ?? '#',
      adaMulai: jenis === 'mulai',
      adaVarian: !!varian && !adaSku,
      adaHargaPonsel: adaSku && !d,
      adaHargaDesktop: adaSku && d,
      atasHargaD: this.props.hargaRapat ? '-0.6rem' : '0',
      ukuranTeks: this.props.ukuranTeks ?? '',
      adaUkuran: !!this.props.ukuranTeks,
      hubungi,
      adaHubungi: !!hubungi,
      adaAngka: !hubungi,
      gayaKartu: v.kartu,
      gayaFoto: v.foto,
      gayaUbin: v.ubin,
      gayaNama: warnaNama ? v.nama + '; color: ' + warnaNama : v.nama,
      gayaVarian: varianTebal ? v.varian + '; font-weight: var(--bobot-semibold); color: var(--ink)' : v.varian,
      gayaHarga: v.harga,
      gayaAngkaD: 'font-size: var(--teks-price-lg); font-weight: var(--bobot-bold); white-space: nowrap; font-variant-numeric: tabular-nums; ' + (v.angkaD || ''),
      gayaTeksPromo: v.teks,
      gayaUkuran: v.ukuran,
      gayaAngkaPromo: v.angka,
      gayaRpPromo: v.rp,
      gayaHubungi: v.hubungi
    };
  }
}
</script>
