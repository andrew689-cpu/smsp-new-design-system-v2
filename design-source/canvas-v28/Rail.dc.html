    const d = this.props.tata === 'desktop';
    const ubinKoleksi = koleksi === 'kategori-foto';
    const komponen = this.props.komponen ?? (ubinKoleksi ? 'CategoryTile' : 'ProductCard');
    const kolom = Number(this.props.kolom ?? 0);
    const tepi = this.props.tepi ?? 'pertama';
    const kategoriRel = komponen === 'CategoryTile' && !kolom;
    const lebar = this.props.lebar || (kategoriRel ? '30%' : '48%');
    const gutter = this.props.gutter || (kolom > 0 ? 'calc(var(--rapat) / 2)' : kategoriRel ? 'calc(var(--jarak-x-tiga) / 2)' : 'calc(var(--selokan-ubin) / 2)');
    const celahY = this.props.celahY || gutter;
    const snap = this.props.snap ?? true;
    const sembunyi = !!this.props.sembunyi;
    const panah = this.props.panah ?? 'tanpa';
    const daftar = this.props.items ?? this.isiKoleksi(koleksi, d) ?? [
      { jenis: 'dasar', nama: 'Besi Hollow Hitam', varian: 'Tersedia 297 varian', foto: '/_blob/3e253621e68085ed4f1ceb648cc0b533' },
      { jenis: 'dasar', nama: 'Besi Beton', varian: 'Tersedia 10 varian', foto: '/_blob/31aea6bfad3d6009de172f36cf47db15' },
      { jenis: 'dasar', nama: 'Besi Siku', varian: 'Tersedia 32 varian', foto: '/_blob/afbf9d3db78dee3edbdfd256a4405af2' },
      { jenis: 'dasar', nama: 'Reng Baja Ringan', varian: 'Tersedia 4 varian', foto: '/_blob/eaba17e08cf2095e44e636547c3fa614' },
      { jenis: 'dasar', nama: 'Plat Besi Hitam', varian: 'Tersedia 36 varian', foto: '/_blob/e1474c92af7d2b81503b90b37b2e4758' }
    ];
    const n = daftar.length;
    const butir = daftar.map((p, i) => {
      let gaya;
      if (kolom > 0) {
        const kiri = tepi === 'kisi' ? i % kolom === 0 : i === 0;
        const kanan = tepi === 'kisi' && i % kolom === kolom - 1;
        gaya = 'display: grid; min-width: 0; margin: ' + (i < kolom ? '0' : celahY) + ' ' + (kanan ? '0' : gutter) + ' ' + (i >= n - kolom ? '0' : celahY) + ' ' + (kiri ? '0' : gutter) + (this.props.penuh ? '; width: 100%' : '');
      } else {
        gaya = 'display: grid; flex: 0 0 ' + lebar + '; max-width: 100%; min-width: 0; ' + (snap ? 'scroll-snap-align: ' + (this.props.snapTengah ? 'center' : 'start') + '; ' : '') + 'margin-right: ' + gutter + (i === 0 ? '' : '; margin-left: ' + gutter);
      }
      return { gaya, props: p, isProduk: komponen === 'ProductCard', isKategori: komponen === 'CategoryTile' };
    });
    const anak = this.props.children;
    const geser = (arah) => (e) => {
      const wadah = e.currentTarget.closest('[data-rail-wadah]');
      const el = wadah.querySelector('[data-rail]');
      if (el) el.scrollBy({ left: arah * (panah === 'desktop' ? el.clientWidth * 0.23 + 16 : el.clientWidth * 0.52 + (this.props.tambahLangkah ?? 2)), behavior: 'smooth' });
    };
    const lokasi = panah === 'desktop'
      ? ['left: -2.2rem; top: 9.5rem', 'right: -2.2rem; top: 9.5rem']
      : ['left: 0; top: 9.6rem', 'right: 1.6rem; top: 9.6rem'];
    const tombol = (mati, sisi) => (mati ? 'display: none' : 'display: grid') + '; position: absolute; ' + sisi + '; width: 4.4rem; height: 4.4rem; place-items: center; z-index: 2';
    return {
      isRel: !kolom,
      isKisi: kolom > 0,
      butir,
      adaAnak: !!anak,
      anak,
      dataSembunyi: sembunyi ? '1' : undefined,
      peran: this.props.ariaLabel ? 'group' : undefined,
      fokus: this.props.ariaLabel ? '0' : undefined,
      ariaLabel: this.props.ariaLabel || undefined,
      saatGulir: (panah === 'tanpa' && !this.props.onAktif) ? undefined : (e) => {
        const el = e.currentTarget;
        if (this.props.onAktif) {
          const pusat = el.scrollLeft + el.clientWidth / 2;
          let kini = 0;
          let jarak = Infinity;
          Array.prototype.forEach.call(el.querySelectorAll('[data-rel-kartu="1"]'), (k, i) => {
            const d2 = Math.abs(k.offsetLeft - el.offsetLeft + k.offsetWidth / 2 - pusat);
            if (d2 < jarak) { jarak = d2; kini = i; }
          });
          if (kini !== this._aktif) { this._aktif = kini; this.props.onAktif(kini); }
        }
        const awal = el.scrollLeft <= 2;
        const akhir = el.scrollLeft + el.clientWidth >= el.scrollWidth - 2;
        if (awal !== this.state.awal || akhir !== this.state.akhir) this.setState({ awal, akhir });
      },
      gayaTrek: 'display: flex; column-gap: ' + (anak ? 'calc(' + gutter + ' * 2)' : '0') + '; overflow-x: auto; ' + (snap ? 'scroll-snap-type: x mandatory; ' : '') + (sembunyi ? 'overscroll-behavior-x: contain; scrollbar-width: none; ' : '') + 'margin-right: ' + (this.props.margKanan || (panah !== 'tanpa' ? '0' : 'var(--talang)')) + '; padding: ' + (this.props.pad || 'var(--talang) 0 0 0'),
      gayaKisi: 'display: grid; grid-template-columns: repeat(' + kolom + ', minmax(0, 1fr)); column-gap: 0; row-gap: 0',
      adaPanahPonsel: panah === 'ponsel',
      adaPanahDesktop: panah === 'desktop',
      gayaPrev: tombol(this.state.awal, lokasi[0]),
      gayaNext: tombol(this.state.akhir, lokasi[1]),
      ariaPrev: this.props.ariaPrev ?? 'Ukuran sebelumnya',
      ariaNext: this.props.ariaNext ?? 'Ukuran berikutnya',
      prev: geser(-1),
      next: geser(1)
    };
  }
}
</script>
