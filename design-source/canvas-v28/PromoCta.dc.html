<sc-if value="{{ isKalkOtomatis }}" hint-placeholder-val="{{ false }}">

    <div style="position: relative; padding: 2.8rem 1.6rem 2rem 1.6rem">
      <dc-import name="Heading" level="{{ 2 }}" varian="polos" ukuran="var(--teks-page)" tinggi="var(--tinggi-sempit)" bobot="var(--bobot-bold)" renggang="var(--renggang-judul)" rata="left" warna="var(--surface)" baris="{{ judulOtomatis }}" hint-size="100%,9.3rem"></dc-import>

        <p style="margin: 0; font-size: var(--teks-page); line-height: var(--tinggi-rapat); font-weight: var(--bobot-bold); color: var(--situs-putih); text-align: center">{{ judul }}</p>
        <sc-if value="{{ adaTeks }}" hint-placeholder-val="{{ true }}">

      </div>
      <dc-import name="Button" variant="situs" label="{{ label }}" href="{{ href }}" target="_blank" rel="noopener" hint-size="20rem,4.2rem"></dc-import>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isKalkD }}" hint-placeholder-val="{{ false }}">
  <div style="display: grid; grid-template-columns: 25% minmax(0, 1fr); align-items: center; column-gap: 0">
    <img src="{{ foto }}" alt="{{ alt }}" loading="lazy" style="width: 100%; max-width: 30rem; height: auto; aspect-ratio: auto 4 / 3; display: block; margin-right: calc(var(--selokan-dalam) / 2)">

    </div>
  </div>
</sc-if>
<sc-if value="{{ isPromoM }}" hint-placeholder-val="{{ false }}">
  <div>
    <div style="margin-right: var(--talang); box-sizing: border-box; padding: var(--dalam); border-radius: var(--action); background: var(--biru-dasar)">
      <div style="margin-top: var(--dalam); display: flex; align-items: center; column-gap: 0">
        <div style="min-width: 0; margin-right: calc(var(--selokan-sempit) / 2)">
          <dc-import name="Heading" varian="polos" level="{{ 3 }}" ukuran="var(--teks-section)" tinggi="var(--tinggi-rapat)" bobot="var(--bobot-bold)" renggang="var(--renggang-upvc)" kapital="ya" warna="var(--biru-tinta)" teks="{{ judul }}" hint-size="100%,2.4rem"></dc-import>
        </div>
        <div style="position: relative; flex-shrink: 0; display: inline-block; padding: var(--dalam) var(--rapat) var(--rapat); border-radius: var(--sheet); background: var(--surface); box-shadow: var(--bayang-kartu); margin-left: calc(var(--selokan-sempit) / 2); margin-right: calc(var(--selokan-sempit) / 2)">
          <span style="position: absolute; top: -1.1rem; left: var(--rapat); display: block"><dc-import name="Tag" jenis="mulai" teks="{{ labelMulai }}" hint-size="7rem,2.2rem"></dc-import></span>

      <div style="margin-top: var(--dalam); box-sizing: border-box; padding: var(--dalam) 0; border-top: 0.1rem solid var(--garis-panel); border-bottom: 0.1rem solid var(--garis-panel); display: flex">
        <sc-for list="{{ warna }}" as="w" hint-placeholder-count="3">
          <div style="{{ w.gaya }}">
            <dc-import name="Tag" jenis="keping" nada="{{ w.nada }}" teks="{{ w.nama }}" hint-size="8rem,2.1rem"></dc-import>
            <span style="margin-top: 0.6rem; display: flex; align-items: flex-start; column-gap: 0">
              <span style="display: flex; flex-shrink: 0; margin-right: 0.3rem"><dc-import name="Icon" ikon="matahari" ukuran="{{ 14 }}" hint-size="14px,14px"></dc-import></span>
              <span style="font-size: var(--teks-tiny); line-height: var(--tinggi-sedang); color: var(--ink-2); margin-left: 0.3rem; margin-right: 0.3rem">{{ w.catatan }}</span>
            </span>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: var(--dalam)"><dc-import name="Rail" items="{{ kartu }}" lebar="48%" gutter="calc(var(--selokan-sempit) / 2)" pad="0 0 0.6rem 0" margKanan="0" hint-size="100%,28rem"></dc-import></div>
      <span style="display: block; margin-top: var(--dalam)"><dc-import name="Button" variant="kecil" label="{{ label }}" href="{{ href }}" hint-size="16rem,3rem"></dc-import></span>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isPromoD }}" hint-placeholder-val="{{ false }}">
  <div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; column-gap: 0">
      <div style="margin-right: calc(var(--selokan-dalam) / 2)">
        <dc-import name="Heading" level="{{ 3 }}" tata="desktop" teks="{{ judul }}" hint-size="100%,2.7rem"></dc-import>
        <p style="margin: 0.8rem 0 0 0; font-size: var(--teks-subhead); line-height: var(--tinggi-rapat); font-weight: var(--bobot-regular); letter-spacing: var(--renggang-label-d); text-transform: uppercase; color: var(--ink-2)">{{ merek }}</p>
        <span style="margin-top: var(--rapat); display: inline-flex; align-items: center; column-gap: 0.4rem; font-size: var(--teks-body); line-height: var(--tinggi-tengah); font-weight: var(--bobot-medium); letter-spacing: var(--renggang-kecil); text-transform: uppercase; color: var(--ink-2)"><span style="display: flex; flex-shrink: 0; margin-right: 0.4rem"><dc-import name="Icon" ikon="perisai-cek" hint-size="1.8rem,1.8rem"></dc-import></span>{{ klaim }}</span>
        <div style="position: relative; display: block; width: fit-content; margin-top: calc(var(--dalam) + 1.3rem); padding: var(--dalam) var(--dalam) var(--rapat); border: 0.1rem solid var(--line-kuat); border-radius: var(--card); background: transparent">
          <span style="position: absolute; top: -1.3rem; left: var(--dalam); display: inline-block; padding: 0.4rem var(--rapat); border-radius: var(--pill); background: var(--ink); color: var(--surface); font-size: var(--teks-meta); line-height: var(--tinggi-tengah); font-weight: var(--bobot-semibold); letter-spacing: var(--renggang-kecil); white-space: nowrap">{{ labelMulai }}</span>
          <dc-import name="Price" ukuran="promo-d" angka="{{ angka }}" unit="{{ unit }}" hint-size="16rem,3.2rem"></dc-import>
        </div>
        <div style="margin-top: var(--dalam); box-sizing: border-box; padding: var(--rapat); border-radius: var(--tile); display: flex; column-gap: 0">
          <sc-for list="{{ warna }}" as="w" hint-placeholder-count="3">
            <div style="{{ w.gaya }}">
              <span style="display: block; font-size: var(--teks-lead); line-height: var(--tinggi-tengah); font-weight: var(--bobot-bold); color: var(--ink)">{{ w.nama }}</span>
              <span style="margin-top: 0.6rem; display: flex; align-items: flex-start; column-gap: 0">
                <span style="display: flex; flex-shrink: 0; margin-top: 0.5rem; margin-right: 0.3rem"><dc-import name="Icon" ikon="matahari" ukuran="{{ 16 }}" hint-size="16px,16px"></dc-import></span>
                <span style="font-size: var(--teks-lead); line-height: var(--tinggi-sedang); color: var(--ink-2); margin-left: 0.3rem; margin-right: 0.3rem">{{ w.catatan }}</span>
              </span>
            </div>
          </sc-for>
        </div>
      </div>
      <img src="{{ foto }}" alt="{{ alt }}" loading="lazy" style="width: 100%; height: auto; aspect-ratio: auto 4 / 3; display: block; margin-left: calc(var(--selokan-dalam) / 2); margin-right: calc(var(--selokan-dalam) / 2)">
    </div>
    <div style="margin-top: var(--seksi)"><dc-import name="Rail" items="{{ kartu }}" kolom="{{ 3 }}" tepi="kisi" gutter="calc(var(--dalam) / 2)" hint-size="100%,44rem"></dc-import></div>
    <span style="display: block; margin-top: var(--dalam)"><dc-import name="Button" variant="spanduk" label="{{ label }}" href="{{ href }}" hint-size="36rem,6rem"></dc-import></span>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"jenis":{"editor":"enum","options":["kalkulator","promo"],"default":"kalkulator","section":"Resep"},"tata":{"editor":"enum","options":["ponsel","desktop"],"default":"ponsel","section":"Resep"},"rupa":{"editor":"enum","options":["bawaan","situs","gelap","otomatis"],"default":"bawaan","section":"Resep"},"judul":{"editor":"text","default":"","section":"Isi"},"teks":{"editor":"text","default":"","section":"Isi"},"teksTampil":{"editor":"boolean","default":true,"section":"Isi"},"merek":{"editor":"text","default":"Mattaka","section":"Isi"},"klaim":{"editor":"text","default":"Kuat, Sejuk, &amp; Tahan Lama","section":"Isi"},"labelMulai":{"editor":"text","default":"Mulai Dari","section":"Isi"},"angka":{"editor":"text","default":"140.000","section":"Isi"},"unit":{"editor":"text","default":"/meter","section":"Isi"},"warna":{"editor":null,"tsType":"Array<{nama:string,nada:string,catatan:string}>"},"produk":{"editor":null,"tsType":"Array<[ukuran:string,varian:string,angka:string,foto:string]>"},"foto":{"editor":"text","default":"","section":"Isi"},"alt":{"editor":"text","default":"","section":"Isi"},"label":{"editor":"text","default":"","section":"Isi"},"labelLanjut":{"editor":"text","default":"Pelajari Selengkapnya","section":"Isi"},"href":{"editor":"text","default":"","section":"Isi"},"hrefKartu":{"editor":"text","default":"SkuDetailM4.dc.html","section":"Isi"},"$preview":{"width":330,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const jenis = this.props.jenis ?? 'kalkulator';
    const d = this.props.tata === 'desktop';
    const kalk = jenis === 'kalkulator';
    const gelap = kalk && !d && this.props.rupa === 'gelap';
    const otomatis = kalk && !d && this.props.rupa === 'otomatis';
    const daftarWarna = this.props.warna ?? [
      { nama: 'Warna Biru', nada: 'biru', catatan: '100% Tidak Tembus Cahaya' },
      { nama: 'Clear Matt', nada: 'abu', catatan: '20% Tembus Cahaya' },
      { nama: 'Warna Putih', nada: 'hangat', catatan: '100% Tidak Tembus Cahaya' }
    ];
    const nWarna = daftarWarna.length;
    const warna = daftarWarna.map((w, i) => {
      const gaya = d
        ? 'flex: 1 1 0; min-width: 0; margin-right: calc(var(--rapat) / 2)' + (i === 0 ? '' : '; margin-left: calc(var(--rapat) / 2)')
        : 'flex: 1 1 0; min-width: 0; padding: ' + (i === 0 ? '0 1rem 0 0' : i === nWarna - 1 ? '0 0 0 1rem' : '0 1rem');
      return Object.assign({}, w, { gaya });
    });
    const upvc = this.props.produk ?? [
      ['12mm x 760mm x 4M', 'Mattaka, Biru', '711.000', '/_blob/54f43a08a1384c69e762171c48898e59'],
      ['12mm x 760mm x 5M', 'Mattaka, Biru', '888.000', '/_blob/54f43a08a1384c69e762171c48898e59'],
      ['12mm x 760mm x 6M', 'Mattaka, Biru', '1.066.000', '/_blob/54f43a08a1384c69e762171c48898e59'],
      ['12mm x 760mm x 4M', 'Mattaka, Clear', '', '/_blob/4861e23e8b2352c004a9ab1ec6f49b14'],
      ['12mm x 760mm x 5M', 'Mattaka, Clear', '', '/_blob/4861e23e8b2352c004a9ab1ec6f49b14'],
      ['12mm x 760mm x 6M', 'Mattaka, Clear', '', '/_blob/4861e23e8b2352c004a9ab1ec6f49b14'],
      ['12mm x 760mm x 4M', 'Mattaka, Putih', '711.000', '/_blob/3dc9fe0af201ce8c738b8ed1bc9802fb'],
      ['12mm x 760mm x 5M', 'Mattaka, Putih', '888.000', '/_blob/3dc9fe0af201ce8c738b8ed1bc9802fb'],
      ['12mm x 760mm x 6M', 'Mattaka, Putih', '1.066.000', '/_blob/3dc9fe0af201ce8c738b8ed1bc9802fb']
    ];
    const kartu = upvc.map((u) => ({
      jenis: 'promo',
      tata: d ? 'desktop' : 'ponsel',
      nama: 'Atap UPVC Double Layer',
      ukuranTeks: u[0],
      varian: '[' + u[1] + ']',
      angka: u[2] || undefined,
      hubungi: u[2] ? '' : 'Hubungi kami',
      foto: u[3],
      href: this.props.hrefKartu || 'SkuDetailM4.dc.html'
    }));
    const judulBawaan = kalk ? 'Kalkulator Material' : (d ? 'Atap UPVC Double Layer' : 'Atap UPVC');
    return {
      isKalkSitus: kalk && !d && this.props.rupa === 'situs',
      isKalkM: kalk && !d && this.props.rupa !== 'situs' && !gelap && !otomatis,
      isKalkOtomatis: otomatis,
      fotoOtomatis: '/_blob/068254c8c127a1a735707f52e9df8523',
      altOtomatis: 'Kalkulator di atas gambar kerja biru, dengan pena, pensil dan meteran, berlatar gedung yang sedang dibangun',
      judulOtomatis: [{ teks: 'Kalkulator' }, { teks: 'Material' }, { teks: 'Otomatis' }],
      labelOtomatis: this.props.label || 'Coba Kalkulator Sekarang',
      isKalkGelap: gelap,
      fotoGelap: '/_blob/2059fb2e39d769fc2db1a39e04a76e93',
      altGelap: 'Kalkulator di atas gambar kerja biru, dengan meteran dan pensil',
      judulGelap: [{ teks: 'Bangun Tanpa Ragu,' }, { teks: 'Hitung Kebutuhanmu', warna: 'var(--brand)' }, { teks: 'Sekarang!' }],
      teksGelap: this.props.teks || 'Estimasi kebutuhan material konstruksi Anda secara cepat, akurat, dan gratis. Cukup masukkan luas pekerjaan Anda di bawah ini!',
      poinGelap: [{ ikon: 'stopwatch-cepat', teks: 'Akurat & Cepat' }, { ikon: 'stopwatch', teks: 'Hemat Waktu' }],
      labelLanjut: this.props.labelLanjut ?? 'Pelajari Selengkapnya',
      isKalkD: kalk && d,
      isPromoM: !kalk && !d,
      isPromoD: !kalk && d,
      judul: this.props.judul || judulBawaan,
      teks: this.props.teks || 'Hitung kebutuhan atap, berat besi beton, dan material proyek Anda dalam hitungan detik.',
      adaTeks: this.props.teksTampil ?? !d,
      merek: this.props.merek ?? 'Mattaka',
      klaim: this.props.klaim ?? 'Kuat, Sejuk, & Tahan Lama',
      labelMulai: this.props.labelMulai ?? 'Mulai Dari',
      angka: this.props.angka ?? '140.000',
      unit: this.props.unit ?? '/meter',
      warna,
      kartu,
      foto: this.props.foto || (kalk ? '/_blob/500a91f99c98f43a0496f65d94a21b26' : '/_blob/529008f53af8d85bad1ad0f175c207b2'),
      alt: this.props.alt || (kalk ? 'Ilustrasi Kontraktor' : ''),
      label: this.props.label || (gelap ? 'Mulai Hitung' : kalk ? 'Hitung Sekarang' : 'Konsultasi Sekarang'),
      href: this.props.href || (kalk ? 'https://www.smsperkasa.com/' : '#whatsapp')
    };
  }
}
</script>
