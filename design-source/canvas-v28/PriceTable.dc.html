      filterAria: s.filterBuka ? 'Tutup Filter' : 'Filter' + (ocN ? ', ' + ocN + ' aktif' : ''),
      bukaFilter: () => this.setState({ filterBuka: !s.filterBuka, urutBuka: false }),
      tutupFilter: () => this.setState({ filterBuka: false }),
      terapFilter: (f) => this.setState({ filterBuka: false, limit: 50, ukuran: f.ukuran, tebal: f.tebal }),
      ubahFilter: (f) => this.setState({ ukuran: f.ukuran, tebal: f.tebal, hal: 0 }),
      resetUrut: () => this.setState({ urut: 'populer' }),
      judulFilter: this.props.judulFilter ?? 'Filter Besi Hollow Hitam'
    };
  }
}
</script>
</body>
</html>
