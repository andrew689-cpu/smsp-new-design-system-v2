<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>CategoryNav</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<div style="position: sticky; top: 7.2rem; z-index: 35; box-sizing: border-box; min-height: 5.2rem; padding: 0 12rem; background: var(--surface); box-shadow: inset 0 -0.1rem 0 var(--line); display: flex; align-items: center; row-gap: 2.4rem; column-gap: 0">
  <nav aria-label="{{ ariaLabel }}" style="min-width: 0; flex-grow: 1; display: flex; align-items: center; row-gap: 1.6rem; column-gap: 0; margin-right: 1.2rem">
    <span style="display: flex; flex-shrink: 0; margin-right: 0.8rem"><dc-import name="Button" dc-props="{{ produkProps }}" hint-size="10rem,4.4rem"></dc-import></span>
    <span aria-hidden="true" style="flex-shrink: 0; width: 0.1rem; height: 2rem; background: var(--line); margin-left: 0.8rem; margin-right: 0.8rem"></span>
    <sc-for list="{{ tautan }}" as="t" hint-placeholder-count="7">
      <span style="display: flex; flex-shrink: 0; margin-left: 0.8rem; margin-right: 0.8rem"><dc-import name="Button" dc-props="{{ t }}" hint-size="9rem,4.4rem"></dc-import></span>
    </sc-for>
  </nav>
  <sc-if value="{{ teleponTampil }}" hint-placeholder-val="{{ false }}">
    <div style="flex-shrink: 0; display: flex; align-items: center; row-gap: 1rem; column-gap: 0; margin-left: 1.2rem; margin-right: 1.2rem">
      <span style="font-size: var(--teks-meta); color: var(--ink-2); white-space: nowrap; margin-right: 0.5rem">{{ teleponLabel }}</span>
      <span style="display: flex; margin-left: 0.5rem; margin-right: 0.5rem"><dc-import name="Button" variant="nav-telepon" ikon="telepon-garis" label="{{ telepon }}" href="{{ teleponHref }}" hint-size="16rem,4.4rem"></dc-import></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"isi":{"editor":"enum","options":["produk","artikel"],"default":"produk","section":"Isi"},"ariaLabel":{"editor":"text","default":"","section":"Isi"},"produk":{"editor":null,"section":"Isi","tsType":"{label:string,href?:string,ikon?:string}"},"tautan":{"editor":null,"section":"Isi","tsType":"Array<{label:string,href?:string}>"},"teleponTampil":{"editor":"boolean","default":false,"section":"Telepon"},"teleponLabel":{"editor":null,"section":"Telepon"},"telepon":{"editor":null,"section":"Telepon"},"hrefProduk":{"editor":"text","default":"","section":"Isi"},"hrefPertama":{"editor":"text","default":"","section":"Isi"},"$preview":{"width":1440,"height":52}}'>
class Component extends DCLogic {
  renderVals() {
    // Isi navigasi situs: satu tempat untuk semua halaman. Halaman hanya mengirim produk atau tautan bila memang beda.
    const ISI = {
      produk: {
        aria: 'Kategori produk',
        produk: { label: 'Semua Produk', href: '#produk', ikon: 'kotak' },
        tautan: [
          { label: 'Besi Hollow Hitam', href: 'DesktopProdukM4.dc.html' },
          { label: 'Besi H Beam', href: '#besi-h-beam' },
          { label: 'Besi WF', href: '#besi-wf' },
          { label: 'Besi Beton', href: '#besi-beton' },
          { label: 'Pipa Galvanis', href: '#pipa-galvanis' },
          { label: 'Besi Siku', href: '#besi-siku' },
          { label: 'Plat Besi Hitam', href: '#plat-besi-hitam' }
        ]
      },
      artikel: {
        aria: 'Kategori artikel',
        produk: { label: 'Semua Produk Produk Kategori', href: 'DesktopProdukIndexM4.dc.html' },
        tautan: [
          { label: 'Berita Baja', href: '#kat-berita' },
          { label: 'Industri Baja', href: '#kat-industri' },
          { label: 'Produk Besi', href: '#kat-produk' },
          { label: 'Team', href: '#kat-team' },
          { label: 'Trivia', href: '#kat-trivia' },
          { label: 'Semua Kategori', href: 'https://www.smsperkasa.com/blog' }
        ]
      }
    };
    const isi = ISI[this.props.isi] || ISI.produk;
    const dasarProduk = this.props.produk ?? isi.produk;
    const produk = this.props.hrefProduk ? Object.assign({}, dasarProduk, { href: this.props.hrefProduk }) : dasarProduk;
    const dasarTautan = this.props.tautan ?? isi.tautan;
    const tautan = this.props.hrefPertama ? dasarTautan.map((t, i) => (i === 0 ? Object.assign({}, t, { href: this.props.hrefPertama }) : t)) : dasarTautan;
    /* Nomor telepon datang dari SiteHeader; satu-satunya sumber. */
    const telepon = this.props.telepon;
    return {
      ariaLabel: this.props.ariaLabel || isi.aria,
      produkProps: { variant: 'nav-produk', label: produk.label, href: produk.href ?? '#', ikon: produk.ikon },
      tautan: tautan.map((t) => ({ variant: 'nav-teks', label: t.label, href: t.href ?? '#' })),
      teleponTampil: !!this.props.teleponTampil,
      teleponLabel: this.props.teleponLabel,
      telepon,
      teleponHref: 'tel:' + telepon
    };
  }
}
</script>
</body>
</html>
